[pytest]
# Put this repo root on sys.path so optional-module integration tests (collected from ../<optional_modules>/*/itest) can import the shared harness via `from test.itest.conftest import ...`. Harmless for core-only runs.
pythonpath = .
markers =
    unsafe: too many mqtt connect/disconnect (deselect with -m "not unsafe")
    cognito: legacy auth matrix; many real signups, burns Cognito email quota (opt in with -m cognito)
    xdist_group(name): group tests to run on the same xdist worker (serial within group)
