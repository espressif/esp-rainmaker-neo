[pytest]
# Two roots on sys.path: this repo root, so optional-module integration tests (collected from ../<optional_modules>/*/itest) can import the shared harness via `from test.itest.conftest import ...`; and cli/src, so `esp_morpheus` resolves in a plain checkout with nothing installed.
pythonpath = . cli/src
markers =
    unsafe: too many mqtt connect/disconnect (deselect with -m "not unsafe")
    cognito: legacy auth matrix; many real signups, burns Cognito email quota (opt in with -m cognito)
    xdist_group(name): group tests to run on the same xdist worker (serial within group)
