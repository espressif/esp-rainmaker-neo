workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # RMNG_RESOURCE_POOL (internal resource-pool base URL) is a CI/CD variable, not a value in this file. Keep it unprotected — the deploy jobs run as manual MR-pipeline jobs on unprotected branches and would otherwise curl an empty URL.
  # Docs toolchain image, used by the docs deploy jobs.
  ESP_DOCS_ENV_IMAGE: "$CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.4:1-1"

default:
  # Pinned to the go.mod toolchain. :latest silently follows new Go releases, so a
  # jump to the next minor would land in CI before the codebase is ready for it.
  image: golang:1.26.6
  tags:
    - rmng

stages:
  - lint
  - security
  - unittest
  - docker
  - deploy
  - swagger
  - docs

validate_swagger:
  stage: lint
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/api/**/*
  script:
    - npx --yes @apidevtools/swagger-cli validate docs/api/Api_Swagger.yaml
    - "npx --yes @apidevtools/swagger-cli validate
      docs/api/User_Api_Swagger.yaml"
    - "npx --yes @apidevtools/swagger-cli validate
      docs/api/MCP_Api_Swagger.yaml"

validate_mqtt:
  stage: lint
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/api/MQTT_*.yaml
        - docs/api/Push_*.yaml
  script:
    # npx --yes @asyncapi/cli pulls in @asyncapi/generator@3.4.0, which pins its own dependency @asyncapi/generator-hooks to version 0.1.1 — a version that was never published to npm — so the install fails with ETARGET
    - npm init --yes >/dev/null
    - npm pkg set overrides.@asyncapi/generator-hooks=0.1.0
    - npm install --no-save @asyncapi/cli@6.0.0
    - npx @asyncapi/cli validate docs/api/MQTT_Node.yaml
    - npx @asyncapi/cli validate docs/api/MQTT_User.yaml
    - npx @asyncapi/cli validate docs/api/Push_User.yaml

go_lint:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.go"
        - go.mod
        - go.sum
  script:
    - make lint
  allow_failure: true

secrets:
  stage: lint
  image: alpine:3.20
  variables:
    GITLEAKS_VERSION: 8.28.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache curl
    - curl -sSfL
      "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      | tar -xz -C /usr/local/bin gitleaks
    - gitleaks version
  script:
    - gitleaks dir . --no-banner --redact

npm_audit:
  stage: lint
  # node 24 for npm 11: npm 10 (node 22) audits through
  # /-/npm/v1/security/audits/quick, which the registry is retiring and now answers
  # with a 400 whose body reads "Invalid package tree, run npm install" — nothing to
  # do with the lockfile, which audits clean on npm 11. npm 11 uses the bulk
  # advisory endpoint instead.
  image: node:24-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # Production dependencies only
    - cd dashboard && npm audit --omit=dev --audit-level=high

# Deliberately a separate job from npm_audit rather than sharing one node:22-alpine
# container: pip-audit resolves requirements.txt in a throwaway venv, and playwright
# ships no musllinux wheel and no sdist, so on Alpine that resolution dies with
# "No matching distribution found" before anything is audited. python:3.12 is glibc,
# matching the "Python 3.12.3 compatible versions" contract atop requirements.txt.
pip_audit:
  stage: lint
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - pip install pip-audit
  script:
    - pip-audit -r requirements.txt

# -------------------------
# SPDX licence header gate. Blocking, and scoped to the files the MR adds.
# CI_MERGE_REQUEST_DIFF_BASE_SHA is the merge-base the MR diff is computed against, so
# the job sees exactly the files the MR widget shows as added.
# -------------------------
license_headers:
  stage: lint
  # Full python image, not -slim: the script shells out to git for the added-file list
  # and -slim ships no git.
  image: python:3.12
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 scripts/check_license_headers.py --added-since
      "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

# -------------------------
# CDK synth check — the only gate on Python and dependency changes.
# Every other job filters on **/*.go or docs/api/**, so a requirements.txt, cdk.json
# or stack.py change previously produced a pipeline with nothing in it. Synth needs no AWS
# credentials (there are no from_lookup calls) and the stacks are environment-agnostic.
# DASHBOARD_SKIP avoids requiring a built frontend; dashboard_check covers that instead.
# -------------------------
cdk_synth:
  stage: lint
  # Registry path from the predefined project variable; only the tag is pinned here.
  image: $CI_REGISTRY_IMAGE/rmng:go1.26.6_node24
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.py"
        - requirements.txt
        - cdk.json
        - Stackfile.yaml
        - deployment/docker/Dockerfile
        - Makefile
  variables:
    CDK_PUBLISH: "true"
    DASHBOARD_SKIP: "1"
    AWS_REGION: ap-south-1
    CDK_DEFAULT_REGION: ap-south-1
    RMNG_REGION: ap-south-1
  before_script:
    - pip3 install -r requirements.txt
  script:
    - make go_build
    - CDK_OUTDIR=cdk.out.rmng python3 cdk/apps/rmng.py
    - CDK_OUTDIR=cdk.out.espuser python3 cdk/apps/espuser.py
    - CDK_OUTDIR=cdk.out.alexa python3 cdk/apps/alexa.py
    - CDK_OUTDIR=cdk.out.smartthings python3 cdk/apps/smartthings.py
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - cdk.out.rmng
      - cdk.out.espuser
      - cdk.out.alexa
      - cdk.out.smartthings

# -------------------------
# Dashboard check — nothing else builds or tests the frontend, so a broken typecheck or
# failing vitest suite could previously reach a deploy. `make admin-dashboard-build` is
# reused for the npm ci + build so the registry token logic stays in one place.
# -------------------------
dashboard_check:
  stage: lint
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - dashboard/**/*
  before_script:
    - apk add --no-cache make
  script:
    - make admin-dashboard-build
    - cd dashboard
    - npm run typecheck
    - npm test
    # eslint --max-warnings 0 plus the en/zh i18n key-parity check.
    - npm run lint

# -------------------------
# Vulnerability scanning (govulncheck) — blocking gate across all go.work modules
# -------------------------
go_vulncheck:
  stage: security
  # Pinned to the exact go.mod toolchain, matching GitHub's vulncheck job
  image: golang:1.26.6
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.go"
        - "**/go.mod"
        - "**/go.sum"
        - go.work
        - go.work.sum
        - src/esp-cloud-common
  script:
    - make vulncheck

unittest:
  stage: unittest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.go"
        - go.mod
        - go.sum
        - Makefile
  before_script:
    # Pinned to the versions in go.mod and deployment/docker/Dockerfile — a ginkgo CLI newer
    # than the library it drives produces confusing failures. Bump all three together.
    - go install github.com/onsi/ginkgo/v2/ginkgo@v2.28.3
    - go install github.com/onsi/gomega/...@v1.40.0
    - go install github.com/boumenot/gocover-cobertura@v1.5.0
  script:
    - make test
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/coverage.xml
    paths:
      - build/coverage/coverage.xml

# -------------------------
# Template for AWS deploy
# -------------------------
.deploy_template:
  stage: deploy
  # Registry path from the predefined project variable; only the tag is pinned here.
  image: $CI_REGISTRY_IMAGE/rmng:go1.26.6_node24
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  artifacts:
    paths:
      - build/tests/report.html
      - build/cdk/cdk-outputs.json
    when: always
  before_script:
    - pip3 install -r requirements.txt
    - curl -o resource-pool-cli.py ${RMNG_RESOURCE_POOL}/download-cli
    - python3 resource-pool-cli.py status
    - python3 resource-pool-cli.py grab --user-id ${CI_JOB_ID} --resource-type
      rmng_aws_account_${AWS_REGION} --wait-time 3600 --timeout 3600
    - access_key=$(python3 -c "import glob, json; f =
      glob.glob('/root/.resource-pool/rmng_aws_account*.json')[0];
      print(json.load(open(f))['data']['aws_access_key_id'])")
    - secret_access_key=$(python3 -c "import glob, json; f =
      glob.glob('/root/.resource-pool/rmng_aws_account*.json')[0];
      print(json.load(open(f))['data']['aws_secret_access_key'])")
    - session_token=$(python3 -c "import glob, json; f =
      glob.glob('/root/.resource-pool/rmng_aws_account*.json')[0];
      print(json.load(open(f))['data']['aws_session_token'])")
    - export AWS_ACCESS_KEY_ID=${access_key}
    - export AWS_SECRET_ACCESS_KEY=${secret_access_key}
    - export AWS_SESSION_TOKEN=${session_token}
    - python3 -u tools/aws_cleanup.py --access-key ${AWS_ACCESS_KEY_ID}
      --secret-key ${AWS_SECRET_ACCESS_KEY} --session-token
      "${AWS_SESSION_TOKEN}" --region ${AWS_REGION}
  script:
    - mkdir -p /root/.aws
    - echo "[default]" > /root/.aws/config
    - echo region = ${AWS_REGION} >> /root/.aws/config
    - echo output = json >> /root/.aws/config
    - aws s3 ls
    - git submodule update --init --recursive
    # make deploy gathers Stackfile prompt inputs (e.g. AdminEmails) from the environment.
    - export RMNG_ADMIN_EMAILS="${RMNG_ADMIN_EMAILS}"
    # itest creds as single JSON blobs (masked CI/CD variables): Mailosaur + APNs/Firebase push.
    - export RMNG_ITEST_CONFIG_JSON="${RMNG_ITEST_CONFIG_JSON}"
    - export RMNG_NOTIFY_DATA_JSON="${RMNG_NOTIFY_DATA_JSON}"
    - make setup
    - make deploy
    - make itest ITEST_ARGS='-n auto --dist=loadgroup --reruns 3 --reruns-delay
      5'
  after_script:
    - python3 resource-pool-cli.py release-all --user-id ${CI_JOB_ID}

# -------------------------
# Region-specific jobs
# -------------------------
deploy_us-east-1:
  extends: .deploy_template
  variables:
    AWS_REGION: us-east-1

deploy_eu-west-1:
  extends: .deploy_template
  variables:
    AWS_REGION: eu-west-1

# -------------------------
# Docker build
# -------------------------
.build_docker_template:
  stage: docker
  image: espressif/dind:1
  tags:
    - dind
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    NODE_VERSION: "24"
    GO_VERSION: "1.26.6"
    DOCKER_IMAGE_REGISTRY: "$CI_REGISTRY"
    DOCKER_IMAGE_VERSION: "go${GO_VERSION}_node${NODE_VERSION}"
    DOCKER_IMAGE_NAME: "${CI_REGISTRY_IMAGE}/rmng:${DOCKER_IMAGE_VERSION}"
    # No GitLab credentials are passed in: the image installs only public
    # toolchains, and every npm dependency resolves from public npm (there is no
    # .npmrc anywhere in the tree). The four GITLAB_*_APP_FRAMEWORKS/RAINMAKER
    # build args this used to forward were never referenced in the Dockerfile.
    DOCKER_BUILD_ARGS:
      "--build-arg VERSION=${DOCKER_IMAGE_VERSION} --build-arg
      NODE_VERSION=${NODE_VERSION} --build-arg GO_VERSION=${GO_VERSION}"
    REPOS_PATH: "/root"
  script:
    - echo ${CI_GITLAB_PASSWORD_APP_FRAMEWORKS_DOCKER_PUSH} | docker login
      --username ${CI_GITLAB_USERNAME_APP_FRAMEWORKS_DOCKER_PUSH}
      --password-stdin ${DOCKER_IMAGE_REGISTRY}
    - docker build -f deployment/docker/Dockerfile --no-cache
      ${DOCKER_BUILD_ARGS} --tag ${DOCKER_IMAGE_NAME} .
    - docker push ${DOCKER_IMAGE_NAME}

build_docker:
  extends: .build_docker_template

.inject_home_link: &inject_home_link
  - |
    banner="<div class=\"rmng-home\"><a href=\"${HOME_HREF}\">\&larr; API Reference Home</a></div>"
    style="<style>.rmng-home{font:14px/1.4 system-ui,sans-serif;padding:12px 16px;background:#fafcff;border-bottom:1px solid #e1e1e1}.rmng-home a{color:#2a5a9a;text-decoration:none}.rmng-home a:hover{text-decoration:underline}</style>"
    for f in $(find "${INJECT_DIR}" -name index.html); do
      sed -i "s|</head>|${style}</head>|" "$f"
      sed -i "s|\(<body[^>]*>\)|\1${banner}|" "$f"
    done

# -------------------------
# Swagger sync to S3
# -------------------------
sync_swagger:
  stage: swagger
  # Publishing docs consumes nothing the earlier stages produce. Without needs: []
  # the job waits out the whole pipeline and gets skipped when an unrelated docker
  # or deploy job fails, so a swagger change silently never reaches S3.
  needs: []
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        # Whole folder, not a hand-maintained list: index.html, index.css, the
        # favicons and LICENSE/NOTICE are part of the published site too, and under
        # a narrower list an edit to one of them silently never reached S3 — it rode
        # along with whatever unrelated spec change came next. The MQTT/Push specs
        # ride along too — their raw YAML is served from this bucket (see below),
        # so a commit touching only those is a real sync, not a no-op.
        - docs/api/**/*
  variables:
    AWS_DEFAULT_REGION: us-east-1
  script:
    - export AWS_ACCESS_KEY_ID=${RMNG_PROD_ACCESS_KEY}
    - export AWS_SECRET_ACCESS_KEY=${RMNG_PROD_SECRET_ACCESS_KEY}
    - aws s3 sync docs/api/ s3://esp-rainmaker-neo-api/http/ --delete --exclude
      "MQTT_*.yaml" --exclude "mqtt_*" --exclude "Push_*.yaml" --exclude
      "landing_index.html"
    - aws s3 cp docs/api/landing_index.html
      s3://esp-rainmaker-neo-api/index.html
    - aws s3 cp docs/api/favicon-neo-16x16.png
      s3://esp-rainmaker-neo-api/favicon-neo-16x16.png
    - aws s3 cp docs/api/favicon-neo-32x32.png
      s3://esp-rainmaker-neo-api/favicon-neo-32x32.png
    - aws s3 cp docs/api/logo-neo-mark.png
      s3://esp-rainmaker-neo-api/logo-neo-mark.png
    - aws s3 cp docs/api/logo-neo-vertical.png
      s3://esp-rainmaker-neo-api/logo-neo-vertical.png
    - aws cloudfront create-invalidation --distribution-id E3F6AIL6K7W45G
      --paths "/*"
    - 'echo "API reference site: https://api.docs.neo.rainmaker.espressif.com"'
    - 'echo "  HTTP: https://api.docs.neo.rainmaker.espressif.com/http/"'

# -------------------------
# MCP tool catalogue sync to S3
# -------------------------
sync_mcp:
  stage: swagger
  # Same reasoning as sync_swagger -- no dependency on the build or deploy stages.
  needs: []
  image: python:3.12-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        # The catalogue is generated from the Go tool registry and byte-compared by
        # TestToolCatalogMatchesSnapshot, so it lives outside docs/api/ and needs
        # its own trigger -- the generator script does too, since a change to the
        # rendering must republish the page even when no tool changed.
        - docs/mcp/rainmaker-mcp.json
        - scripts/generate_mcp_reference.py
  variables:
    AWS_DEFAULT_REGION: us-east-1
  before_script:
    - apk add --no-cache aws-cli
  script:
    - export AWS_ACCESS_KEY_ID=${RMNG_PROD_ACCESS_KEY}
    - export AWS_SECRET_ACCESS_KEY=${RMNG_PROD_SECRET_ACCESS_KEY}
    # No template engine here: the catalogue is neither OpenAPI nor AsyncAPI, so
    # Swagger UI and @asyncapi/html-template cannot render it. The home-link
    # banner is baked into the generated page rather than sed-injected after the
    # fact, so *inject_home_link is deliberately not used.
    - python3 scripts/generate_mcp_reference.py --out dist/mcp/index.html
    # --delete is scoped to the mcp/ prefix, and the raw catalogue is copied in
    # afterwards, so it is not removed on the next run.
    - aws s3 sync dist/mcp/ s3://esp-rainmaker-neo-api/mcp/ --delete
    # Raw catalogue alongside its rendering, for codegen and diffing -- the same
    # convention as the MQTT and event specs.
    - aws s3 cp docs/mcp/rainmaker-mcp.json
      s3://esp-rainmaker-neo-api/mcp/rainmaker-mcp.json
    - aws cloudfront create-invalidation --distribution-id E3F6AIL6K7W45G
      --paths "/mcp/*"
    - 'echo "MCP tools: https://api.docs.neo.rainmaker.espressif.com/mcp/"'

# -------------------------
# MQTT AsyncAPI sync to S3
# -------------------------
sync_mqtt:
  stage: swagger
  # Same reasoning as sync_swagger — no dependency on the build or deploy stages.
  needs: []
  image:
    name: node:22-alpine
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - docs/api/**/*
  variables:
    AWS_DEFAULT_REGION: us-east-1
  before_script:
    - apk add --no-cache aws-cli
    # Pin CLI + template to a verified-compatible pair.
    # CLI 4.1.1 bundles @asyncapi/generator 1.17.25; html-template@2.3.0 is the last
    # template release compatible with generator 1.x (declares generator >=1.15.0 <2.0.0).
    # Newer template majors (3.x) need generator 2.x, which no published CLI bundles.
    - npm install -g @asyncapi/cli@4.1.1
  script:
    - export AWS_ACCESS_KEY_ID=${RMNG_PROD_ACCESS_KEY}
    - export AWS_SECRET_ACCESS_KEY=${RMNG_PROD_SECRET_ACCESS_KEY}
    - "asyncapi generate fromTemplate docs/api/MQTT_Node.yaml
      @asyncapi/html-template@2.3.0 -o dist/node --force-write"
    - "asyncapi generate fromTemplate docs/api/MQTT_User.yaml
      @asyncapi/html-template@2.3.0 -o dist/user --force-write"
    - export HOME_HREF="../../" INJECT_DIR="dist"
    - *inject_home_link
    - aws s3 sync dist/node/ s3://esp-rainmaker-neo-api/mqtt/node/ --delete
    - aws s3 sync dist/user/ s3://esp-rainmaker-neo-api/mqtt/user/ --delete
    # Raw specs alongside their renderings, for codegen and diffing. Safe at the
    # mqtt/ prefix root: the --delete syncs above are scoped to node/ and user/.
    - aws s3 cp docs/api/MQTT_Node.yaml
      s3://esp-rainmaker-neo-api/mqtt/MQTT_Node.yaml
    - aws s3 cp docs/api/MQTT_User.yaml
      s3://esp-rainmaker-neo-api/mqtt/MQTT_User.yaml
    - aws cloudfront create-invalidation --distribution-id E3F6AIL6K7W45G
      --paths "/mqtt/*"
    - 'echo "MQTT Node: https://api.docs.neo.rainmaker.espressif.com/mqtt/node/"'
    - 'echo "MQTT User: https://api.docs.neo.rainmaker.espressif.com/mqtt/user/"'

# -------------------------
# Notification/event payloads (AsyncAPI) sync to S3
# -------------------------
sync_events:
  stage: swagger
  # Same reasoning as sync_swagger — no dependency on the build or deploy stages.
  needs: []
  image:
    name: node:22-alpine
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - docs/api/**/*
  variables:
    AWS_DEFAULT_REGION: us-east-1
  before_script:
    - apk add --no-cache aws-cli
    # Same pinned CLI/template pair as sync_mqtt — see the comment there.
    - npm install -g @asyncapi/cli@4.1.1
  script:
    - export AWS_ACCESS_KEY_ID=${RMNG_PROD_ACCESS_KEY}
    - export AWS_SECRET_ACCESS_KEY=${RMNG_PROD_SECRET_ACCESS_KEY}
    - "asyncapi generate fromTemplate docs/api/Push_User.yaml
      @asyncapi/html-template@2.3.0 -o dist/events --force-write"
    - export HOME_HREF="../" INJECT_DIR="dist"
    - *inject_home_link
    # This sync targets the events/ prefix root, so --delete would remove the raw
    # spec copied below on every run; --exclude keeps it out of scope.
    - aws s3 sync dist/events/ s3://esp-rainmaker-neo-api/events/ --delete
      --exclude "Push_User.yaml"
    # Raw spec alongside its rendering, for codegen and diffing.
    - aws s3 cp docs/api/Push_User.yaml
      s3://esp-rainmaker-neo-api/events/Push_User.yaml
    - aws cloudfront create-invalidation --distribution-id E3F6AIL6K7W45G
      --paths "/events/*"
    - 'echo "Events payloads site:
      https://api.docs.neo.rainmaker.espressif.com/events/"'

# -------------------------
# Cloud specification docs (Sphinx) -> Espressif doc server
# -------------------------
# See docs/README.md.
.docs_template:
  stage: docs
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: "1"
    # esp-docs labels this branch "latest"; it defaults to master.
    ESP_DOCS_LATEST_BRANCH_NAME: "main"

.docs_changes: &docs_changes
  - docs/**/*
  - .gitlab-ci.yml

build_docs:
  extends: .docs_template
  image: python:3.12
  interruptible: true
  needs: []
  rules:
    - if:
        '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH ==
        "main"'
      changes: *docs_changes
  artifacts:
    when: always
    paths:
      - docs/_build/*/*/*.txt
      - docs/_build/*/*/html
    expire_in: 1 week
  script:
    - cd docs
    - pip install -r requirements.txt
    - build-docs -l en -pp $CI_PROJECT_DIR

# deploy-docs ships build_docs' artifacts over ssh/scp, which python:3.12 lacks.
# It renders nothing, so esp-docs alone is enough.
.deploy_docs_template:
  extends: .docs_template
  image: $ESP_DOCS_ENV_IMAGE
  tags: [deploy_docs]
  needs: [build_docs]
  variables:
    DOCS_BUILD_DIR: "$CI_PROJECT_DIR/docs/_build/"
  script:
    - source $CI_PROJECT_DIR/docs/utils.sh
    - add_doc_server_ssh_keys $DOCS_DEPLOY_PRIVATEKEY $DOCS_DEPLOY_SERVER
      $DOCS_DEPLOY_SERVER_USER
    - export GIT_VER=$(git describe --always)
    - pip install "$(grep '^esp-docs==' $CI_PROJECT_DIR/docs/requirements.txt)"
    - deploy-docs

deploy_docs_preview:
  extends: .deploy_docs_template
  variables:
    TYPE: "preview"
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PREVIEW_PRIVATEKEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PREVIEW_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PREVIEW_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PREVIEW_PATH"
    DOCS_DEPLOY_URL_BASE: "$DOCS_PREVIEW_URL_BASE"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *docs_changes

deploy_docs_production:
  extends: .deploy_docs_template
  variables:
    TYPE: "production"
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PROD_PRIVATEKEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PROD_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PROD_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PROD_PATH"
    DOCS_DEPLOY_URL_BASE: "$DOCS_PROD_URL_BASE"
  # allow_failure keeps this non-blocking: under rules: a manual job defaults to
  # blocking, and the project requires a green pipeline to merge.
  allow_failure: true
  # The changes: filter must mirror build_docs': this job needs: it, and a
  # pipeline that creates the deploy without the build is a YAML error.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *docs_changes
      when: manual
