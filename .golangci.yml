# Every enabled linter and formatter blocks CI. A linter joins `enable` only once the tree passes it; report one that is not gated yet with `golangci-lint run --enable-only <linter>`.
version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - govet
    - ineffassign
    - makezero
    - misspell
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    staticcheck:
      # Bug checks only; the S1/ST/QF style checks are not gated yet.
      checks: ["SA*"]

formatters:
  enable:
    - gofmt
  exclusions:
    # Another repo's code; `golangci-lint fmt` walks directories and would otherwise rewrite the submodule.
    paths:
      - src/esp-cloud-common
