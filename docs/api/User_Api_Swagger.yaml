openapi: 3.0.0
info:
  title: ESP RainMaker Neo Auth & Accounts API
  version: 0.8.0
  description: |
    Sign-in and account management for the ESP RainMaker Neo cloud.
    Anything that produces or rotates an access token lives here; once
    you have a token, the rest of the platform lives in the
    **ESP RainMaker Neo Platform API**

    ESP User is the platform's own OAuth 2.1 / OIDC issuer: every token a client
    holds is minted here, regardless of how the user proved their identity.
    Admins authenticate directly against their AWS Cognito user pool.

    Login methods (all end in OUR tokens; upstream credentials never reach clients):

    - **Sign-in page (default)**: `GET /oauth2/authorize` starts a browser
      authorization-code + PKCE flow and sends the browser to `GET /user/login`,
      which draws the providers the client allows: a password form checked by the
      pool of an enabled `oidc` row whose `password_verifier` is `cognito` (`POST /user/login/password`),
      a one-time code, or a button that redirects to the own page of an `oidc` provider naming no `password_verifier`.
    - **Federated login**: an `oidc` provider's button, or `GET /oauth2/authorize`
      itself when that provider is the only enabled one, sends the browser to the
      provider; the broker exchanges the upstream code server-side and issues OUR
      authorization code at the client's `redirect_uri`.
    - **Native password APIs** (`/v1/user/auth/*`): the main-era
      native surface. Credentials are verified against the bundled Cognito pool server-side and converted to our tokens.

    Token lifecycle after login:

    1. `POST /oauth2/token` (`grant_type=refresh_token`) - rotate the token set
       (native `/v1/user/auth/token/refresh` rotates the same way).
    2. Send `access_token` as a `Bearer` `Authorization` header on subsequent
       calls. To call the platform API you must first exchange the token for AWS
       credentials at `POST /v1/user/credentials` and SigV4-sign every request.
       A token this IdP issued is exchanged on its own; a token issued directly by
       the Cognito provider must also carry its `id_token` in the body, and the two
       must come from the same sign-in.
  termsOfService: http://swagger.io/terms/
  contact:
    email: esp-rainmaker-support@espressif.com
    url: https://rainmaker.espressif.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

# A `servers:` block lets Swagger UI (and the docusaurus-openapi-docs
# Try-it-out panel) populate a base URL. Replace `{deployment}` with
# your stack's API Gateway hostname; `{stage}` is the API Gateway stage,
# which every RMNG deployment creates as `prod`.
servers:
  - url: https://{deployment}/{stage}
    description: Your ESP RainMaker Neo deployment's API Gateway base URL
    variables:
      deployment:
        default: api.example.com
        description: Replace with your API Gateway hostname.
      stage:
        default: prod
        description: API Gateway stage name.

# Top-level tag declarations control rendering order in Swagger UI
# and in the docs-site sidebar.
tags:
  - name: OIDC Discovery
    description:
      Public OpenID Connect discovery documents. Fetch these before starting an
      auth request.
  - name: OAuth2 / OIDC Core
    description:
      Authorization, token issuance/rotation, userinfo, revocation, and sign-out — the endpoints every login method converges on.
  - name: Federated Login
    description:
      The provider's return leg of a browser login started at `/oauth2/authorize`, brokered to an upstream identity provider. Clients only ever receive ESP User tokens.
  - name: Sign-in Pages
    description:
      Our sign-in, consent and sign-out pages, and the calls they make. Applications never call them.
  - name: User Auth
    description:
      The main-era native `/v1/user/auth/*` password surface, kept
      request/response compatible. Credentials verify against the bundled
      Cognito pool server-side; every token returned is an ESP User token.
  - name: Sessions
    description:
      The authorization server's own browser session — sign-out, a person's
      list of the browsers they are signed in on, and the apps that hold
      offline access.
  - name: Users
    description: User lookup.
  - name: Admin Clients
    description: Admin-only OAuth client registry
  - name: Admin Creds
    description:
      Scoped AWS credentials the dashboard uses to run seevral admin steps

paths:
  # ==========================================
  # OIDC Discovery (public, static)
  # ==========================================

  /.well-known/openid-configuration:
    get:
      summary: OpenID Provider metadata
      description:
        OIDC discovery document — endpoint URLs and the `jwks_uri`; `claims_supported` includes `amr` and `idp`. Public and
        cacheable. Served at `<issuer>/.well-known/*` by the ESP User API, built per request;
        revalidate with `If-None-Match` to get a 304 instead of the body.
      tags:
        - OIDC Discovery
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` from an earlier response.
          schema:
            type: string
          example: '"3f2a9c1e0b7d4a6c8e5f1a2b3c4d5e6f"'
      responses:
        "200":
          description: Discovery metadata
          headers:
            Cache-Control:
              schema:
                type: string
              example: "public, max-age=300, must-revalidate"
            ETag:
              schema:
                type: string
              example: '"3f2a9c1e0b7d4a6c8e5f1a2b3c4d5e6f"'
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIDConfiguration"
        "304":
          description: Not modified; the `If-None-Match` ETag is current. No body.

  /.well-known/oauth-authorization-server:
    get:
      summary: OAuth 2.0 Authorization Server metadata
      description:
        OAuth 2.0 authorization server metadata for non-OIDC clients. Public and
        cacheable. Served at `<issuer>/.well-known/*` by the ESP User API, built per request;
        revalidate with `If-None-Match` to get a 304 instead of the body.
      tags:
        - OIDC Discovery
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` from an earlier response.
          schema:
            type: string
          example: '"3f2a9c1e0b7d4a6c8e5f1a2b3c4d5e6f"'
      responses:
        "200":
          description: Authorization Server metadata
          headers:
            Cache-Control:
              schema:
                type: string
              example: "public, max-age=300, must-revalidate"
            ETag:
              schema:
                type: string
              example: '"3f2a9c1e0b7d4a6c8e5f1a2b3c4d5e6f"'
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
        "304":
          description: Not modified; the `If-None-Match` ETag is current. No body.

  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set
      description:
        Public keys for verifying issued tokens. Public and cacheable. Served at `<issuer>/.well-known/*` by the ESP User API, built per request;
        revalidate with `If-None-Match` to get a 304 instead of the body.
      tags:
        - OIDC Discovery
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` from an earlier response.
          schema:
            type: string
          example: '"3f2a9c1e0b7d4a6c8e5f1a2b3c4d5e6f"'
      responses:
        "200":
          description: JWK Set
          headers:
            Cache-Control:
              schema:
                type: string
              example: "public, max-age=3600"
            ETag:
              schema:
                type: string
              example: '"3f2a9c1e0b7d4a6c8e5f1a2b3c4d5e6f"'
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "304":
          description: Not modified; the `If-None-Match` ETag is current. No body.

  /oauth2/authorize:
    get:
      summary: Start browser login (authorization code + PKCE)
      description: |
        Starts the authorization-code + PKCE (`S256`) login. It ends at `redirect_uri` with a single-use `code` and `state`.

        A live `__Host-esp_session` cookie skips the login and returns the code immediately (single sign-on), unless `prompt`, `max_age` or `id_token_hint` rule it out.
      tags:
        - OAuth2 / OIDC Core
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: ["code"]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          description:
            Must exactly match a registered redirect URI for the client.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description:
            Optional (RFC 6749 §4.1.1), space-delimited; include `openid` for an
            id_token. A scope outside the client's allowed scopes returns
            `error=invalid_scope`. `offline_access` asks for a refresh token no sign-out
            ends and always shows the consent screen (OIDC Core 1.0 §11).
          schema:
            type: string
            example: "openid email"
        - name: code_challenge
          in: query
          required: false
          description:
            PKCE code challenge (RFC 7636). Required for clients registered with
            `require_pkce` (always the case for public clients); optional
            otherwise.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          description: Must be `S256` when a `code_challenge` is provided.
          schema:
            type: string
            enum: ["S256"]
        - name: state
          in: query
          required: false
          description:
            Opaque value echoed back on the redirect (client CSRF token).
          schema:
            type: string
        - name: resource
          in: query
          required: false
          description: |
            RFC 8707 resource indicators: the APIs this sign-in covers, one `resource`
            parameter each. Every value must appear in the client's `allowed_resources`,
            or the request redirects with `invalid_target`.

            **Omitted or empty:** the sign-in covers the client's `default_resource`; a client
            without one is refused with `invalid_target`. Each access token is for exactly
            one covered API, picked at `/oauth2/token`. An ID token's `aud` is the
            `client_id` either way — it is a statement to that client.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uri
          example: ["https://api.example.com"]
        - name: prompt
          in: query
          required: false
          description: |
            OIDC Core §3.1.2.1. **Default when
            omitted:** a live session answers the request silently.

            `none` never shows a page (`login_required` or `consent_required` instead; `invalid_request` with any other value). `login` and `select_account` re-authenticate; `consent` always asks.
          schema:
            type: string
            example: "none"
        - name: max_age
          in: query
          required: false
          description: |
            Maximum acceptable age, in seconds, of the session's authentication (its
            `auth_time`, inherited from the upstream provider). A session older than this
            is not used and the user re-authenticates.

            **Default when omitted:** no age bound — a session is used however old its
            authentication, up to the session's own idle and absolute limits. `max_age=0`
            always forces re-authentication. Carried to the upstream provider alongside
            `prompt`.
          schema:
            type: integer
            minimum: 0
        - name: id_token_hint
          in: query
          required: false
          description: |
            A previously issued ID token naming the expected subject. A session
            belonging to anyone else — or a hint that does not verify — is not
            used; the flow never switches to the hinted user.
          schema:
            type: string
      responses:
        "302":
          description: |
            To the sign-in page; with a live session, back to `redirect_uri` with `code` and `state`, or to the consent page. Errors found after `redirect_uri` is validated go back to it as `error` and `state`.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description:
                Short-lived HttpOnly Secure SameSite=Lax `__Host-esp_flow_id` cookie.
              schema:
                type: string
        "400":
          description: |
            invalid_request / unsupported_response_type / invalid client or
            redirect_uri — rendered on the service error page (not redirected).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /user/login/federation/start:
    get:
      summary: Redirect to an upstream identity provider
      description: |
        Sends the browser to an `oidc` provider's own sign-in page for the current sign-in, if the client allows that provider.
      tags:
        - Sign-in Pages
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          description:
            An `oidc` row's name from the identity-provider registry (e.g. `google`).
          schema:
            type: string
        - name: flow_id
          in: query
          required: true
          description:
            The sign-in the page's link was drawn for; it must equal the flow cookie.
          schema:
            type: string
        - name: __Host-esp_flow_id
          in: cookie
          required: true
          description: Login-flow session cookie set by `/oauth2/authorize`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's hosted login page.
          headers:
            Location:
              schema:
                type: string
        "400":
          description:
            "`invalid_request`: missing or expired flow, or unknown provider; `flow_replaced`: `flow_id` is not this browser's current sign-in (HTML error page)."
          content:
            text/html:
              schema:
                type: string
        "500":
          description:
            "`server_error`: the provider registry could not be read, or the provider's authorize URL could not be built (HTML error page)."
          content:
            text/html:
              schema:
                type: string

  /oauth2/federation/callback:
    get:
      summary: Upstream provider callback
      description: |
        The provider returns here after sign-in. Finishes the sign-in and redirects to `redirect_uri` with a `code`, or to the consent page; upstream tokens are discarded.

        A cancel at the provider goes back to the sign-in page when the client offers another way in, else to `redirect_uri` with `error=access_denied`. Any other error is a `400` page.
      tags:
        - Federated Login
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Upstream authorization code; absent when the provider answers `error`.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: The provider's refusal, sent instead of `code`.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: The broker's own HMAC-bound state (not the client's).
          schema:
            type: string
        - name: __Host-esp_flow_id
          in: cookie
          required: true
          description: Login-flow cookie set by `/oauth2/authorize`; it must name the flow the `state` was issued for.
          schema:
            type: string
      responses:
        "302":
          description:
            To `redirect_uri` with `code` and `state`, or to the consent page; after a cancel, to the sign-in page or to `redirect_uri` with `error=access_denied`.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: |
                The `__Host-esp_session` cookie
                (`Path=/; HttpOnly; Secure; SameSite=Lax`) establishing the
                authorization server's own session, whose record inherits the
                upstream's `auth_time`. It stores no token — an opaque revocable
                identifier only. A session-layer failure never blocks the login
                itself.
              schema:
                type: string
        "400":
          description:
            State/flow mismatch, a missing or different `__Host-esp_flow_id` cookie,
            upstream validation failure, or a provider `error` other than a cancel (HTML error page).
          content:
            text/html:
              schema:
                type: string
        "403":
          description:
            "`access_denied`: no account of ours can take this person, such as one with no verified email or phone (HTML error page)."
          content:
            text/html:
              schema:
                type: string
        "500":
          description:
            "`server_error`: the provider registry, the flow or the account could not be read or written, or the code could not be issued (HTML error page)."
          content:
            text/html:
              schema:
                type: string

  /oauth2/token:
    post:
      summary: OAuth token endpoint
      description: |
        Issues tokens by `grant_type`:
        - `authorization_code`: a login code and its PKCE verifier for a token set
        - `refresh_token`: a new token set; the refresh token rotates
        - `client_credentials`: a confidential client's own access token; no user, refresh token or id token

        Other grants return `unsupported_grant_type`. A confidential client authenticates with HTTP Basic (`client_secret_basic`) or with `client_id` and `client_secret` in the body (`client_secret_post`), Basic winning when both are sent (`401 invalid_client` on failure); a public client sends `client_id` with no secret.
      tags:
        - OAuth2 / OIDC Core
      security:
        - clientBasicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TokenCodeRequest"
                - $ref: "#/components/schemas/TokenRefreshRequest"
                - $ref: "#/components/schemas/TokenClientCredentialsRequest"
              discriminator:
                propertyName: grant_type
            examples:
              authorizationCode:
                summary: authorization_code, public client with PKCE
                value:
                  grant_type: authorization_code
                  code: "<authorization-code>"
                  code_verifier: "<pkce-code-verifier>"
                  client_id: rm_mobile
                  redirect_uri: "com.example://callback"
              authorizationCodeSecretPost:
                summary: authorization_code, confidential client with client_secret_post
                value:
                  grant_type: authorization_code
                  code: "<authorization-code>"
                  client_id: example_web_client
                  client_secret: "<client-secret>"
                  redirect_uri: "https://app.example.com/callback"
              refreshToken:
                summary: refresh_token, no resource named
                value:
                  grant_type: refresh_token
                  refresh_token: "<refresh-token>"
                  client_id: rm_mobile
              refreshTokenWithResource:
                summary: refresh_token naming one resource the sign-in covers
                description: The renewed access token's `aud` is this resource; a resource the sign-in does not cover returns `invalid_target` and leaves the refresh token unspent.
                value:
                  grant_type: refresh_token
                  refresh_token: "<refresh-token>"
                  client_id: rm_mobile
                  resource: "https://account.example.com"
              clientCredentials:
                summary: client_credentials, credentials in the HTTP Basic header
                value:
                  grant_type: client_credentials
                  scope: account.admin
                  resource: "https://api.example.com"
      responses:
        "200":
          description: "A fresh token set, including a new refresh token, sent with `Cache-Control: no-store` and `Pragma: no-cache` (RFC 6749 §5.1). `client_credentials` returns an access token only."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSet"
              examples:
                userTokenSet:
                  summary: authorization_code or refresh_token with openid in scope
                  value:
                    access_token: "<access-token>"
                    token_type: Bearer
                    expires_in: 3600
                    refresh_token: "<refresh-token>"
                    id_token: "<id-token>"
                    scope: "openid email offline_access"
                clientCredentials:
                  summary: client_credentials
                  value:
                    access_token: "<access-token>"
                    token_type: Bearer
                    expires_in: 3600
        "400":
          description: invalid_request / invalid_grant / invalid_scope / invalid_target / unauthorized_client / unsupported_grant_type. A refresh token whose session has ended gets invalid_grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              examples:
                invalidTarget:
                  summary: refresh_token naming a resource the sign-in does not cover
                  value:
                    error: invalid_target
                    error_description: "The requested resource is not part of this authorization."
                invalidGrant:
                  summary: unknown, expired, spent or revoked refresh token
                  value:
                    error: invalid_grant
                    error_description: "The refresh token is invalid, expired, or revoked."
        "401":
          description: invalid_client — unknown client, a confidential client with a bad or missing secret, or `client_credentials` with no client authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: server_error — the token set could not be issued; retry with backoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /oauth2/userinfo:
    get:
      summary: OIDC UserInfo endpoint
      description: |
        Returns the profile claims for the presented access token: `sub` always, `email` with the `email` or `profile` scope, `phone_number` with `phone`.
      tags:
        - OAuth2 / OIDC Core
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The subject's scope-authorized claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserinfoResponse"
        "401":
          description: |
            invalid_token — the access token is missing, expired, or invalid.
            Carries a `WWW-Authenticate: Bearer error="invalid_token"` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    post:
      summary: OIDC UserInfo endpoint (POST variant)
      description: |
        Same as `GET`. The access token may also be sent as the `access_token` field of a form body.
      tags:
        - OAuth2 / OIDC Core
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  description:
                    The access token, when not sent in the Authorization header.
                  example: "eyJhbGciOiJSUzI1Ni..."
      responses:
        "200":
          description: The subject's scope-authorized claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserinfoResponse"
        "401":
          description:
            invalid_token — the access token is missing, expired, or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /oauth2/revoke:
    post:
      summary: OAuth token revocation endpoint
      description: |
        Ends the refresh token's whole login; only the client it was issued to may revoke it (RFC 7009 §2.1), and an access token or an unknown or already revoked token gets `200` (§2.2).

        The client identifies itself with HTTP Basic (confidential) or the `client_id` form field (public). Neither returns `400 invalid_request`; a bad secret or unknown client returns `401 invalid_client`.
      tags:
        - OAuth2 / OIDC Core
      security:
        - clientBasicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "200":
          description: The token (if any) has been revoked. Empty body.
        "400":
          description:
            invalid_request — the `token` is missing, or neither Basic nor
            `client_id` was supplied. invalid_grant — the refresh token was
            issued to another client (RFC 6749 §5.2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              examples:
                missingToken:
                  value:
                    error: invalid_request
                    error_description: token is required.
                anotherClientsToken:
                  value:
                    error: invalid_grant
                    error_description: The token was not issued to this client.
        "401":
          description:
            invalid_client — unknown client, or a confidential client with a
            bad/missing secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_client
                error_description: client authentication failed.
        "503":
          description:
            temporarily_unavailable — the token may still work; retry later (RFC 7009 §2.2.1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: temporarily_unavailable
                error_description: The token could not be revoked; retry later.
        "500":
          description: server_error — the client could not be checked; nothing was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: server_error
                error_description: Internal server error.

  # ==========================================
  # GROUP 4: Authenticated User Profile
  # ==========================================

  # ==========================================
  # Native auth (/v1/user/auth/*)
  # Main-era request/response shapes; Cognito verified server-side, OUR tokens returned.
  # ==========================================
  # ==========================================
  # Sessions and sign-out
  # ==========================================

  /oauth2/logout:
    get:
      summary: RP-Initiated Logout (OpenID Connect RP-Initiated Logout 1.0 §2)
      description: |
        Signs this browser out and redirects to `post_logout_redirect_uri`; unless `id_token_hint` names this session, the person confirms on `/user/logout` first (RP-Initiated Logout 1.0 §2).

        - Must be a top-level navigation; a `fetch` does not carry the `SameSite=Lax` session cookie.
        - Access tokens stay valid until they expire, and `offline_access` grants are not ended (OIDC Back-Channel Logout 1.0 §2.7).
      tags:
        - OAuth2 / OIDC Core
      security: []
      parameters:
        - name: __Host-esp_session
          in: cookie
          required: false
          schema:
            type: string
          description:
            The session credential. The browser is identified by this cookie, not by the
            query parameters below, which are optional hints. Absent means there is no
            session to end and the request still succeeds (nothing to do).
        - name: client_id
          in: query
          required: false
          schema:
            type: string
          description:
            The client whose registered return URLs apply. Optional with an `id_token_hint`; ignored when it is not the hint's audience.
        - name: post_logout_redirect_uri
          in: query
          required: false
          schema:
            type: string
            format: uri
          description:
            Where to send the browser afterwards. Must exact-match one of the client's
            registered `post_logout_redirect_uris`.
        - name: id_token_hint
          in: query
          required: false
          schema:
            type: string
          description:
            The ID token issued to this client; one naming this session's subject and `sid` signs out without asking, expired or not.
            One that does not verify forfeits the redirect back to the client (RP-Initiated Logout 1.0 §4).
        - name: state
          in: query
          required: false
          schema:
            type: string
          description:
            Opaque value echoed back on the redirect to `post_logout_redirect_uri`
            (RP-Initiated Logout 1.0 §2), so the RP can correlate the logout response with
            its request. Ignored when there is no validated destination to return to.
      responses:
        "302":
          description: To the validated destination (through the provider's end-session endpoint when it has one), or to `/user/logout` to ask the person or when there is no destination.
          headers:
            Location:
              schema:
                type: string
                example: "../user/logout?client_id=esp-account-dashboard&post_logout_redirect_uri=https%3A%2F%2Faccounts.example.com%2Fsigned-out&state=xyz123"
            Set-Cookie:
              schema:
                type: string
                example: "__Host-esp_session=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0"
            Referrer-Policy:
              schema:
                type: string
                example: no-referrer
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: "`server_error`: the hint or the session could not be read, or the session could not be ended; nothing is signed out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    post:
      summary: RP-Initiated Logout (form POST)
      description: |
        Ends nothing itself: a cross-site POST carries no `SameSite=Lax` session cookie, so it answers `303` and the browser repeats the request as the `GET` above, carrying only the parameters below (the first value of each).
      tags:
        - OAuth2 / OIDC Core
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token_hint: { type: string }
                logout_hint: { type: string }
                client_id: { type: string }
                post_logout_redirect_uri: { type: string, format: uri }
                state: { type: string }
            example:
              client_id: esp-account-dashboard
              post_logout_redirect_uri: https://accounts.example.com/signed-out
              state: xyz123
      responses:
        "303":
          description: Repeat as a `GET` of `/oauth2/logout` with the carried parameters.
          headers:
            Location:
              schema:
                type: string
                example: "?client_id=esp-account-dashboard&post_logout_redirect_uri=https%3A%2F%2Faccounts.example.com%2Fsigned-out&state=xyz123"
        "400":
          description: The body is not `application/x-www-form-urlencoded` (`invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /user/login:
    get:
      summary: The sign-in page
      description: |
        The sign-in page. Its page data (`<script type="application/json" id="esp-page-data">`) names the client and the providers it allows; applications never call it.

        Without a live sign-in it shows an error, with "Start again" when there is a sign-in to restart.
      tags:
        - Sign-in Pages
      security: []
      parameters:
        - in: cookie
          name: __Host-esp_flow_id
          required: false
          schema:
            type: string
          description: The login in progress. Set by `/oauth2/authorize`.
        - in: query
          name: login_hint
          required: false
          schema:
            type: string
          description: Carried from `/oauth2/authorize`; prefills the username. Nothing is authorized on it.
        - in: query
          name: idp
          required: false
          schema:
            type: string
          description: Carried from `/oauth2/authorize`; preselects a provider. Nothing is authorized on it.
      responses:
        "200":
          description: The sign-in application.
          headers:
            Content-Security-Policy:
              schema:
                type: string
              description: "`default-src 'none'` with no remote origin permitted, and `frame-ancestors 'none'`."
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: No flow cookie (`invalid_request`), or the sign-in expired or is gone (`expired_flow`); the error screen offers "Start again" when it can.
          content:
            text/html:
              schema:
                type: string
        "500":
          description: The flow or its client could not be read (`server_error`); the error screen is drawn.
          content:
            text/html:
              schema:
                type: string

  /user/login/password:
    post:
      summary: Sign in with a password on the page
      description: |
        Checks the password with a provider that has a supported `password_verifier` and finishes the sign-in, answering where to send the browser. Never returns a token.
      tags:
        - Sign-in Pages
      security: []
      parameters:
        - in: cookie
          name: __Host-esp_flow_id
          required: true
          schema:
            type: string
          description: The login in progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow_id, username, password]
              properties:
                flow_id:
                  type: string
                  description: The `flow_id` the sign-in page was served with; it must be the flow cookie's.
                provider:
                  $ref: "#/components/schemas/PasswordProvider"
                username:
                  type: string
                  description: The account email or phone number.
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: |
            Signed in: `redirect_to` is `redirect_uri` with `code` and `state`, or the consent page.
          headers:
            Set-Cookie:
              description: The `__Host-esp_session` cookie (`Path=/; HttpOnly; Secure; SameSite=Lax`).
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedirectResponse"
              example:
                redirect_to: https://app.example.com/cb?code=abc&state=xyz
        "400":
          description: "`expired_flow`: the sign-in must start again; `flow_replaced`: another sign-in replaced it; `invalid_request`: an unreadable body or unknown provider."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: flow_replaced
                error_description: Another sign-in was started in this browser.
        "401":
          description: "`invalid_credentials`: a wrong password and an unknown account get the same answer, so the form is no account-existence oracle."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_credentials
                error_description: Signin failed. Check your email and password, or reset your password.
        "403":
          description: "`unconfirmed_account`, `new_password_required`, `password_reset_required`: the account needs that step first; `provider_not_allowed`; `access_denied`: the account cannot sign in here."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: provider_not_allowed
                error_description: This application does not allow signing in with that provider.
        "500":
          description: "`server_error`: something on our side failed, never a wrong password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /user/login/restart:
    get:
      summary: Start the same sign-in again after it expired
      description: |
        Starts the expired sign-in again with the request the app sent.
      tags:
        - Sign-in Pages
      security: []
      parameters:
        - in: cookie
          name: __Host-esp_flow_id
          required: true
          schema:
            type: string
          description: The login to resume.
      responses:
        "302":
          description: Redirect to `/oauth2/authorize` with the original parameters.
          headers:
            Location:
              schema:
                type: string
        "400":
          description: No flow cookie, or nothing left to resume from; the error page is shown.
        "500":
          description: The flow could not be read; the error page is shown.

  /user/login/consent:
    get:
      summary: The consent screen for a client we do not ship
      description: |
        Asks the person to allow an app we do not ship, or one that sent `prompt=consent`; no code exists until they answer (RFC 6749 s10.2).
      tags:
        - Sign-in Pages
      security: []
      parameters:
        - in: cookie
          name: __Host-esp_flow_id
          required: true
          schema:
            type: string
          description: The sign-in waiting for consent.
      responses:
        "200":
          description: The sign-in application, drawing the consent screen.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: No sign-in is waiting for consent; the error page is shown.
        "500":
          description: The sign-in could not be read; the error page is shown.
    post:
      summary: Allow or cancel the client's access
      description: |
        Allow issues the held code to this browser's session; Cancel returns `access_denied` to the app. The page then goes to `redirect_to`.
      tags:
        - Sign-in Pages
      security: []
      parameters:
        - in: cookie
          name: __Host-esp_flow_id
          required: true
          schema:
            type: string
        - in: cookie
          name: __Host-esp_session
          required: false
          schema:
            type: string
          description: The session that signed in. An Allow from a browser without it, or with another session, is answered `expired_flow`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, flow_id]
              properties:
                decision:
                  type: string
                  enum: [allow, deny]
                flow_id:
                  type: string
                  description: The `flow_id` the consent screen was served with; it must be the flow cookie's.
      responses:
        "200":
          description: Where to send the browser.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedirectResponse"
              example:
                redirect_to: https://app.example.com/cb?code=abc&state=xyz
        "400":
          description: "`invalid_request`: not allow or deny, or no flow cookie; `flow_replaced`: another sign-in replaced it; `expired_flow`: nothing is waiting for an answer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: The answer could not be recorded (`server_error`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /user/logout:
    get:
      summary: The sign-out question
      description: |
        Asks the person to confirm a sign-out `/oauth2/logout` did not end on its own; the answer goes to `POST /user/logout`.
      tags:
        - Sign-in Pages
      security: []
      parameters:
        - in: cookie
          name: __Host-esp_session
          required: false
          schema:
            type: string
          description: The session the question is about. Absent, or naming no live session, means there is nothing to ask.
        - in: query
          name: client_id
          required: false
          schema:
            type: string
          description: Carried from `/oauth2/logout`, as are `post_logout_redirect_uri`, `id_token_hint`, `state` and `logout_hint`; this page reads none of them.
      responses:
        "200":
          description: The sign-out question, or, with no session and no query, a signed-out page.
          headers:
            Content-Security-Policy:
              schema:
                type: string
              description: "`default-src 'none'` with no remote origin permitted, and `frame-ancestors 'none'`."
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            text/html:
              schema:
                type: string
              example: '<script type="application/json" id="esp-page-data">{"client":{},"providers":null,"otp_enabled":false,"logout":{"username":"person@example.com","csrf_token":"9jC0b2xWm1TQ2v8Yb1u4XwQx0b4c3kq7oR2sVn6pZ1E"}}</script>'
        "302":
          description: No live session, so nothing to ask; back to `/oauth2/logout` with the same query.
          headers:
            Location:
              schema:
                type: string
                example: "/oauth2/logout?client_id=esp-account-dashboard&post_logout_redirect_uri=https%3A%2F%2Faccounts.example.com%2Fsigned-out"
        "500":
          description: "`server_error` page: the session could not be read."
          content:
            text/html:
              schema:
                type: string
    post:
      summary: The person's answer to the sign-out question
      description: Sent only by the `/user/logout` page. Ends this browser's session and answers where to go next.
      tags:
        - Sign-in Pages
      security: []
      parameters:
        - name: __Host-esp_session
          in: cookie
          required: false
          schema:
            type: string
          description: The session to end; absent or ended means nothing to end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csrf_token]
              properties:
                csrf_token:
                  type: string
                  description: The `logout.csrf_token` the page was served with.
                client_id: { type: string }
                post_logout_redirect_uri: { type: string, format: uri }
                id_token_hint: { type: string }
                logout_hint: { type: string }
                state: { type: string }
            example:
              csrf_token: 9jC0b2xWm1TQ2v8Yb1u4XwQx0b4c3kq7oR2sVn6pZ1E
              client_id: esp-account-dashboard
              post_logout_redirect_uri: https://accounts.example.com/signed-out
              state: xyz123
      responses:
        "200":
          description: Signed out, or nothing to end; `redirect_to` is the validated destination, empty when there is none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedirectResponse"
              example:
                redirect_to: https://accounts.example.com/signed-out?state=xyz123
        "400":
          description: "`invalid_request`: the body cannot be read."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "403":
          description: "`invalid_request`: `csrf_token` is not this session's; nothing ends."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: "`server_error`: the hint or the session could not be read, or its tokens could not be deleted; the session is left intact."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /oauth2/federation/logout/callback:
    get:
      summary: Return point for the upstream provider's sign-out
      description: |
        Where the provider returns the browser after its own sign-out; it continues to the saved destination, or to `/user/logout`.
      tags:
        - OAuth2 / OIDC Core
      security: []
      responses:
        "302":
          description: To the saved destination, or to `/user/logout` when there is none.

  /v1/user/sessions:
    get:
      summary: The browsers this person is signed in on
      description: |
        Lists the person's signed-in user agents, each with the applications signed in on it. Requires the `account:sessions` scope.
      tags:
        - Sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's own sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id:
                          type: string
                          description: The session's public identifier. Exposed as `session_id` in the body; the path parameter stays `{sessionId}`, and the underlying OIDC token claim and stored attribute remain `sid`.
                        current:
                          type: boolean
                          description: True for the session this request's own token was minted under.
                        user_agent_type:
                          type: string
                          description: The readable rendering of user_agent, derived at render time — "Chrome on macOS" for a browser, "Android app" for a native client whose User-Agent names only an SDK. "Unknown" / "App" when it cannot be told.
                        user_agent_name:
                          type: string
                          description: The label the person gave this login at OTP initiate, when one was supplied. Absent on every other login path. A client showing a name should prefer this over user_agent_type — one is chosen, the other inferred.
                        user_agent: { type: string }
                        ip_address: { type: string }
                        provider: { type: string }
                        origin:
                          type: string
                          enum: [browser, app]
                          description: Whether this sign-in origin holds a cookie (browser, SSO possible) or none (app, never SSO). Absent reads as browser.
                        signed_in_at:
                          type: integer
                          format: int64
                          description: auth_time, epoch seconds. A fact, never moved by use.
                        last_seen_at:
                          type: integer
                          format: int64
                          description: Most recent activity of any kind — rendered as "last active".
                        expires_at:
                          type: integer
                          format: int64
                          description: The session's retention deadline and the table's TTL attribute; the row is swept once this passes with no activity. A cookie_expires_at in the past on a row still listed here is what "signed in, but this browser must sign in again" looks like — an app row simply has no cookie_expires_at.
                        cookie_expires_at:
                          type: integer
                          format: int64
                          description: When the browser will drop the cookie (browser rows only). A record of what we told the browser, not a control.
                        clients:
                          type: array
                          items:
                            $ref: "#/components/schemas/ClientGrant"
              example:
                sessions:
                  - session_id: sess_9fA2
                    current: true
                    user_agent_type: Chrome on macOS
                    origin: browser
                    signed_in_at: 1725100000
                    last_seen_at: 1725190000
                    expires_at: 1759750000
                    cookie_expires_at: 1759750000
                    clients:
                      - { client_id: esp-account-dashboard, client_name: ESP Account, created_at: 1725100000, last_used: 1725190000 }
                  - session_id: sess_7bQ9
                    current: false
                    user_agent_type: Android app
                    user_agent_name: John's iPhone
                    origin: app
                    signed_in_at: 1725000000
                    last_seen_at: 1725300000
                    expires_at: 1759860000
                    clients:
                      - { client_id: rainmaker-neo-home-app-client, created_at: 1725000000, last_used: 1725300000 }
        "401":
          description: Missing, malformed, expired, or not an access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "403":
          description: The token was not granted `account:sessions`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: "`server_error`: the client registry or storage failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    delete:
      summary: Sign out everywhere
      description: |
        Signs the person out of every user agent, including this one; `offline_access` grants stay (OIDC Back-Channel Logout 1.0 §2.7). Requires the `account:sessions` scope.
      tags:
        - Sessions
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Everything ended.
        "401":
          description: Missing, malformed, expired, or not an access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "403":
          description: The token was not granted `account:sessions`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: "`server_error`: the client registry or storage failed; a retry finishes the sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /v1/user/sessions/{sessionId}:
    delete:
      summary: End one browser's session
      description: |
        Signs one user agent out from anywhere by deleting its session and its refresh families. `204` on success; `404` when the caller has no such session, including one that belongs to someone else. Requires the `account:sessions` scope.
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          description: The session's public id, from `GET /v1/user/sessions`.
      responses:
        "204":
          description: The session was ended.
        "401":
          description: Missing, malformed, expired, or not an access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "403":
          description: The token was not granted `account:sessions`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "404":
          description: No such session for this user (the cross-user case included).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "500":
          description: "`server_error`: the client registry or storage failed; a retry finishes the sign-out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /v1/user/connected-apps:
    get:
      summary: The apps that hold offline access
      description: |
        The clients holding a live `offline_access` grant for the person, one per client, most recently used first; a grant past its expiry is left out. Requires a first-party client's token with `account:sessions`.
      tags:
        - Sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's connected apps.
          content:
            application/json:
              schema:
                type: object
                required: [connected_apps]
                properties:
                  connected_apps:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientGrant"
              example:
                connected_apps:
                  - { client_id: rainmaker-neo-alexa-client, client_name: Alexa, created_at: 1725000000, last_used: 1725300000, scopes: [offline_access, openid] }
                  - { client_id: mcp-oauth-client, created_at: 1725100000, last_used: 1725200000, scopes: [offline_access, openid] }
        "401":
          description: Missing, malformed, expired, or not an access token; a `client_credentials` token is refused here too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_token
                error_description: The access token is missing, expired, or invalid.
        "403":
          description: The token lacks `account:sessions` (`insufficient_scope`), or its client is not first-party (`access_denied`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: insufficient_scope
                error_description: This token was not granted the account:sessions scope.
        "405":
          description: A method this resource does not offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_request
                error_description: Method not allowed.
        "500":
          description: The grants or the client registry could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: server_error
                error_description: Internal server error.

  /v1/user/connected-apps/{clientId}:
    delete:
      summary: Disconnect one app
      description: |
        Ends every login the client holds for the person, offline and session alike. Requires a first-party client's token with `account:sessions`.
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
          description: The client's id, from `GET /v1/user/connected-apps`.
          example: rainmaker-neo-alexa-client
      responses:
        "204":
          description: The app was disconnected. No body.
        "401":
          description: Missing, malformed, expired, or not an access token; a `client_credentials` token is refused here too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_token
                error_description: The access token is missing, expired, or invalid.
        "403":
          description: The token lacks `account:sessions` (`insufficient_scope`), or its client is not first-party (`access_denied`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: insufficient_scope
                error_description: This token was not granted the account:sessions scope.
        "404":
          description: The caller has no offline grant for this client; nothing is ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_request
                error_description: No such connected app.
        "405":
          description: A method this resource does not offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_request
                error_description: Method not allowed.
        "500":
          description: The grants could not be read or changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: server_error
                error_description: Internal server error.

  /v1/user/auth/token:
    post:
      summary: Password sign-in
      description: |
        Signs in with `username` and `password` against the named `provider` (or the first password provider) and returns an ESP User token set.
        The sign-in covers every API the password client is granted (RFC 8707), and its access token is for the client's `default_resource`; `/v1/user/auth/token/refresh` with `resource` narrows it to another.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyTokenRequest"
            examples:
              passwordSignin:
                summary: Password sign-in
                value:
                  username: user@example.com
                  password: "<password>"
      responses:
        "200":
          description: "ESP User token set, sent with `Cache-Control: no-store` and `Pragma: no-cache` (RFC 6749 §5.1)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSet"
        "400":
          description: "`Invalid request body`, or `Unknown provider.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            `Authentication failed` — wrong password, or no such account.
            `Signin failed. Account not verified — reset your password.` — correct password, account never verified.
            `Signin failed. Password reset required — reset your password.` — correct password, account an administrator reset.
            `Signin failed. This account needs a new password — contact support.` — correct temporary password, account an administrator created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`This application does not allow signing in with that provider.`: the Home app client does not allow it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/user/auth/token/refresh:
    post:
      summary: Refresh tokens
      description: |
        Exchanges a refresh token for a new token set. The refresh token rotates: store the new one, because replaying a spent one ends the login.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRefreshRequest"
            examples:
              refresh:
                summary: Refresh, no resource named
                value:
                  refresh_token: "<refresh-token>"
              refreshWithResource:
                summary: Refresh naming one resource the sign-in covers
                description: The renewed access token's `aud` is this resource.
                value:
                  refresh_token: "<refresh-token>"
                  resource: ["https://account.example.com"]
      responses:
        "200":
          description: "ESP User token set, sent with `Cache-Control: no-store` and `Pragma: no-cache` (RFC 6749 §5.1)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSet"
        "400":
          description: |
            `Invalid request body`, or an RFC 8707 refusal naming the problem, e.g. `Only one resource may be requested; a token is never issued for two audiences.` or `The requested resource is not part of this authorization.`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                resourceNotAuthorized:
                  summary: Refresh naming a resource the sign-in does not cover
                  value:
                    message: "The requested resource is not part of this authorization."
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/user/auth/signup:
    post:
      summary: Create an account
      description: |
        Creates an account with exactly one of `email` or `phone_number` plus a `password`, and sends a verification code to confirm at `signup/verify`.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacySignupRequest"
      responses:
        "201":
          description: Account created; verification required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  requires_verification:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example:
                      Code sent. Existing RainMaker users must signin or reset
                      password.
        "400":
          description: A bad field, a refused address (`Failed to create user account`), a refused password (`Password does not meet the password requirements`), or `Unknown provider.`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Password does not meet the password requirements

  /v1/user/auth/signup/verify:
    post:
      summary: Confirm signup
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                email:
                  type: string
                phone_number:
                  type: string
                code:
                  type: string
                  description: Verification code Cognito delivered at signup.
                provider:
                  $ref: "#/components/schemas/PasswordProvider"
      responses:
        "200":
          description: "`Verified successfully. You can now login.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: |
            `Invalid code or RainMaker account already exists. Try signin or reset password.` — one answer for every failure: wrong, expired or empty code, an account that does not exist, and an account that is already confirmed. The product name appears only when the resolved provider is named RainMaker.
            A `provider` that is not an enabled row whose `password_verifier` is `cognito` and that has a `client_id` is `Unknown provider.`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/user/auth/password-recovery:
    post:
      summary: Start password recovery
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: The account email or phone number.
                provider:
                  $ref: "#/components/schemas/PasswordProvider"
      responses:
        "200":
          description: Reset code sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: If your account exists, you will receive a code
        "400":
          description: A bad field (`Invalid request body`), a reset that could not start (`Failed to initiate password reset`), or `Unknown provider.`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/user/auth/password-recovery/confirmation:
    post:
      summary: Confirm password recovery
      description: |
        Resets the password with the mailed code, then signs out every session of the account; `offline_access` grants stay. An account whose sign-in asks for a second step such as MFA is reset with no session ended.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, code, new_password]
              properties:
                username:
                  type: string
                code:
                  type: string
                new_password:
                  type: string
                provider:
                  $ref: "#/components/schemas/PasswordProvider"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: A wrong or expired code, or no such account (`Invalid verification code`); a refused password (`Password does not meet the password requirements`); or `Unknown provider.`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Password does not meet the password requirements
        "500":
          description: The password was reset, but the sessions could not be signed out; the new password works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Password reset, but sessions could not be signed out

  /v1/user/auth/password:
    post:
      summary: Change password
      description: |
        Changes the caller's password with the current one, then signs out every session, the caller's included, and disconnects every connected app, so the person signs in again with the new password. Requires an access token from this issuer for any of its APIs in the `Authorization: Bearer` header.
        A token carrying `idp` changes that provider's password only when its `amr` contains `pwd`; a token without `idp` uses the default password provider.
      tags:
        - User Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: The body cannot be parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The bearer token is missing or invalid, or the old password is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Password change failed
        "403":
          description: The token is valid but its sign-in used no password ESP User checks; the message names the provider it signed in through.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: You signed in through Google. This doesn't support password change.
        "500":
          description: The password was changed, but the sessions could not be signed out; the new password works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Password changed, but sessions could not be signed out

  /v1/user/auth/signout:
    post:
      summary: Sign out
      description: |
        Ends the login the refresh token belongs to, as `/oauth2/revoke` does for the RainMaker Home app client; a login that has already ended also answers `200`. `global: "true"` is refused with `400`.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                global:
                  type: string
                  description:
                    Accepted for compatibility; `"true"` is rejected with `400`.
      responses:
        "200":
          description: Signed out, or the login had already ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Successfully signed out
        "400":
          description: The body cannot be parsed, the refresh token is missing, or a global sign-out was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingToken:
                  value:
                    message: Refresh token is required
                global:
                  value:
                    message: Global signout is not supported; sign out each session with its refresh token
        "401":
          description: The refresh token is forged or malformed, or was issued to another client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid refresh token
        "500":
          description: The service could not start; nothing was signed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Internal server error
        "503":
          description: The sign-out could not be recorded; the token still works, so retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Sign-out failed; try again

  /v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description:
          The user's id, or `me` for the currently authenticated user.
        schema:
          type: string
    get:
      summary: Get user details
      description: |
        Returns a user's profile; `me` means the caller. The access token is sent as `Bearer` and verified in the handler (no API Gateway authorizer).
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ==========================================
  # Admin — OAuth Client Registry (admin)
  # ==========================================

  /v1/admin/clients:
    post:
      summary: Create OAuth client
      description: |
        Registers an OAuth client. `redirect_uris` are exact matches, `implicit` and `password` grants are refused, and public clients must use PKCE. A confidential client's secret is generated and returned in the response. Admin only.
      tags:
        - Admin Clients
      security:
        - CognitoAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreateRequest"
      responses:
        "201":
          description:
            Client created; client_secret present only for confidential, only
            here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      summary: List OAuth clients
      description: |
        Lists every client. `get_secret=true` includes each confidential client's secret, which is how a lost secret is recovered. Admin only.
      tags:
        - Admin Clients
      security:
        - CognitoAuthorizer: []
      parameters:
        - name: get_secret
          in: query
          required: false
          description:
            If true, include each confidential client's plaintext client_secret.
          schema:
            type: boolean
            default: false
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: The registered clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/clients/{client_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update OAuth client
      description: |
        Replaces a client's editable fields; omitted fields reset to their defaults. `client_id`, `client_type` and the secret cannot change. Same validation as create. Admin only.
      tags:
        - Admin Clients
      security:
        - CognitoAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateRequest"
      responses:
        "200":
          description: The updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete OAuth client
      description: |
        Deletes the client. It can no longer sign users in or get tokens; tokens already issued work until they expire. Admin only.
      tags:
        - Admin Clients
      security:
        - CognitoAuthorizer: []
      responses:
        "200":
          description: Client deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/credentials:
    post:
      summary: Get espuser-scoped AWS credentials (admin)
      description: |
        Returns short-lived AWS credentials limited to the espuser setup steps the dashboard runs: SNS SMS sandbox status, the SMS monthly spend limit, and Service Quotas reads and increase requests.
      tags:
        - Admin Creds
      security:
        - CognitoAuthorizer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredsRequest"
      responses:
        "200":
          description: Scoped credentials issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Failed to assume the admin-creds role

components:
  schemas:
    ClientGrant:
      type: object
      description: An application holding refresh grants, under a session or as a connected app.
      required: [client_id]
      properties:
        client_id:
          type: string
        created_at:
          type: integer
          format: int64
          description: When the earliest of these grants was made, epoch seconds; for an older grant with no record, absent under a session and its last refresh for a connected app.
        last_used:
          type: integer
          format: int64
          description: The most recent refresh of any of those grants, epoch seconds.
        client_name:
          type: string
          description: The client's registered display name; absent when it registered none.
        logo_uri:
          type: string
          description: The client's registered logo as an inline `data:image/...` URI; absent when it registered none.
        scopes:
          type: array
          items:
            type: string
          description: Connected apps only. Every scope granted across the client's offline grants, sorted.
    CredsRequest:
      type: object
      properties:
        session_suffix:
          type: string
          maxLength: 32
          pattern: "^[a-zA-Z0-9]*$"
          description:
            Optional alphanumeric suffix appended to the STS role session name,
            so concurrent admin sessions are distinguishable in CloudTrail.
          example: "dash01"
    CredsResponse:
      type: object
      required:
        - access_key
        - secret_key
        - session_token
      properties:
        access_key:
          type: string
          description: Temporary AWS access key ID.
        secret_key:
          type: string
          description: Temporary AWS secret access key.
        session_token:
          type: string
          description: Temporary AWS session token.
        expiration:
          type: integer
          nullable: true
          description:
            Unix timestamp at which the credentials expire, 1 hour from now.
          example: 1767225600
    OpenIDConfiguration:
      type: object
      description:
        OIDC provider metadata. The live document may include more fields.
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer:
          type: string
          format: uri
          description:
            This provider's issuer identifier (the deployment base URL).
          example: "https://auth.customer.com"
        authorization_endpoint:
          type: string
          format: uri
          example: "https://auth.customer.com/oauth2/authorize"
        token_endpoint:
          type: string
          format: uri
          example: "https://auth.customer.com/oauth2/token"
        jwks_uri:
          type: string
          format: uri
          description: URL of the JSON Web Key Set used to verify issued tokens.
          example: "https://auth.customer.com/.well-known/jwks.json"
        response_types_supported:
          type: array
          items:
            type: string
            enum: [code]
          example: ["code"]
        subject_types_supported:
          type: array
          items:
            type: string
            enum: [public]
          example: ["public"]
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum: [RS256]
          example: ["RS256"]

    AuthorizationServerMetadata:
      type: object
      description:
        OAuth 2.0 authorization server metadata. The live document may include
        more fields.
      required:
        - issuer
        - response_types_supported
        - authorization_endpoint
        - token_endpoint
      properties:
        issuer:
          type: string
          format: uri
          description: This authorization server's issuer identifier.
          example: "https://auth.customer.com"
        authorization_endpoint:
          type: string
          format: uri
          example: "https://auth.customer.com/oauth2/authorize"
        token_endpoint:
          type: string
          format: uri
          example: "https://auth.customer.com/oauth2/token"
        jwks_uri:
          type: string
          format: uri
          description: URL of the JSON Web Key Set used to verify issued tokens.
          example: "https://auth.customer.com/.well-known/jwks.json"
        response_types_supported:
          type: array
          items:
            type: string
            enum: [code]
          example: ["code"]
        grant_types_supported:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token]
          example: ["authorization_code", "refresh_token"]
        code_challenge_methods_supported:
          type: array
          items:
            type: string
            enum: [S256]
          example: ["S256"]

    JWKS:
      type: object
      description: JSON Web Key Set. Public signing keys only.
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JWK"

    JWK:
      type: object
      description: A single RSA public signing key.
      required:
        - kty
        - kid
        - use
        - alg
        - n
        - e
      properties:
        kty:
          type: string
          enum: [RSA]
          description: Key type.
          example: "RSA"
        kid:
          type: string
          description: Key ID; matched against the JWT header `kid`.
          example: "2026-06-a"
        use:
          type: string
          enum: [sig]
          description: Public key use; `sig` for signature verification.
          example: "sig"
        alg:
          type: string
          enum: [RS256]
          description: Algorithm this key is bound to.
          example: "RS256"
        n:
          type: string
          description: RSA modulus, base64url-encoded.
          example: "0vx7agoebGcQSuuPiLJXZptN..."
        e:
          type: string
          description: RSA public exponent, base64url-encoded.
          example: "AQAB"

    LegacyTokenRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: The account email or phone number.
        password:
          type: string
          format: password
        provider:
          $ref: "#/components/schemas/PasswordProvider"

    LegacyRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token from this surface; spent once redeemed.
        resource:
          type: array
          maxItems: 1
          description:
            The one API the renewed access token is for, from among those the
            sign-in covers. Omitted or empty, the only covered API, else the default.
          items:
            type: string
            format: uri
          example: ["https://account.example.com"]

    LegacySignupRequest:
      type: object
      required: [password]
      properties:
        email:
          type: string
          description: Exactly one of email or phone_number.
        phone_number:
          type: string
          description: E.164; exactly one of email or phone_number.
        password:
          type: string
          format: password
        provider:
          $ref: "#/components/schemas/PasswordProvider"

    TokenSet:
      type: object
      description: The issued ESP User token set.
      properties:
        access_token:
          type: string
          description: The access token.
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
          description: Refresh token; rotated on each use.
        id_token:
          type: string
          description: Present only if `openid` was requested. Like the access token, it carries `amr` (RFC 8176 methods ESP User verified, e.g. `["pwd"]`; absent for a federated sign-in) and `idp` (the provider that authenticated the person) when known.
        scope:
          type: string
          description: The granted scope, space-delimited, which can be narrower than the request (RFC 6749 §5.1). Absent for `client_credentials`.
          example: "openid email offline_access"

    OAuthError:
      type: object
      description:
        OAuth 2.0 error response. Distinct from the API's generic `{message}`
        errors.
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - invalid_target
            - invalid_token
            - access_denied
            - server_error
            - expired_flow
            - flow_replaced
            - unconfirmed_account
            - new_password_required
            - password_reset_required
            - invalid_credentials
            - provider_not_allowed
          example: "invalid_grant"
        error_description:
          type: string
          description:
            Human-readable detail. Does not distinguish why the token was
            rejected.
          example: "The refresh token is invalid, expired, or revoked."

    PasswordProvider:
      type: string
      description: A provider with a supported `password_verifier`; omitted, the first such provider by name. Any other name is `400` `Unknown provider.`.
      example: cognito

    RedirectResponse:
      type: object
      description: Where a page of the sign-in application sends the browser next; it never carries a token.
      properties:
        redirect_to:
          type: string

    TokenClientCredentialsRequest:
      type: object
      description: |
        A confidential client obtains an access token for **itself** (RFC 6749 §4.4).
        There is no resource owner, so the response carries **no refresh token** (the
        client re-authenticates by presenting its credentials again) and **no id token**
        (there is no human to describe).

        In the minted token `sub` is the `client_id` (RFC 9068 §2.2.1) and `aud` is the
        requested `resource` — the API the token will be spent at, not the caller.
        Rejected for public clients with `unauthorized_client`: a public client has no
        credentials to present.
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum: ["client_credentials"]
          example: "client_credentials"
        client_id:
          type: string
          description: The client, when it authenticates in the body (`client_secret_post`) instead of HTTP Basic.
          example: "example_service_client"
        client_secret:
          type: string
          format: password
          description: A confidential client's secret when it authenticates in the body (`client_secret_post`) instead of HTTP Basic.
        scope:
          type: string
          description: |
            Space-separated subset of the client's registered scopes. Omitted grants all
            of them — there is no user whose consent could narrow it further, so the
            registration is the only bound. An unregistered scope returns `invalid_scope`.
          example: "account.admin"
        resource:
          type: string
          format: uri
          description: |
            RFC 8707 resource indicator: the API this token is for, stamped into `aud`.
            Must appear in the client's `allowed_resources` or the request is rejected
            with `invalid_target`.

            **At most one.** Two `resource` values are rejected rather than producing a
            multi-audience token, so a leaked token is useful against exactly one API.

            **Omitted or empty:** the client's `default_resource`; a client without one is refused
            with `invalid_target`.
          example: "https://api.example.com"

    TokenCodeRequest:
      type: object
      description: |
        Exchange a browser-login authorization code for tokens. `code_verifier`
        is required iff the code was issued with a PKCE challenge (always, for
        public clients); `client_id` and `redirect_uri` must match those used at
        `/oauth2/authorize`.
      required:
        - grant_type
        - code
        - redirect_uri
      properties:
        grant_type:
          type: string
          enum: ["authorization_code"]
          description: Must be `authorization_code`.
          example: "authorization_code"
        code:
          type: string
          description: The single-use authorization code from the redirect.
          example: "ac_7f2b9c..."
        code_verifier:
          type: string
          description:
            PKCE verifier whose S256 hash equals the challenge sent at
            authorize. Required iff the code was bound to a challenge.
          example: "dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"
        client_id:
          type: string
          description: Must equal the client that started the flow. Required unless the client authenticates with HTTP Basic.
          example: "rainmaker-neo-home-app-client"
        client_secret:
          type: string
          format: password
          description: A confidential client's secret when it authenticates in the body (`client_secret_post`) instead of HTTP Basic.
        redirect_uri:
          type: string
          description: Must equal the redirect_uri used at authorize.
          example: "com.example://callback"
        resource:
          type: string
          format: uri
          description:
            The one API this access token is for, from among those the sign-in
            covers (RFC 8707 s2.2). Omitted or empty, the only covered API, else the client's
            `default_resource`. At most one; otherwise `invalid_target`.
          example: "https://api.example.com"

    TokenRefreshRequest:
      type: object
      required:
        - grant_type
        - refresh_token
      properties:
        grant_type:
          type: string
          enum: ["refresh_token"]
          description: Must be `refresh_token`.
          example: "refresh_token"
        refresh_token:
          type: string
          description:
            The current refresh token; it is replaced with a new one on use.
          example: "a1b2c3d4.9f8e7d6c..."
        client_id:
          type: string
          description: The client the token was issued to. Required unless the client authenticates with HTTP Basic.
          example: "rm_mobile"
        client_secret:
          type: string
          format: password
          description: A confidential client's secret when it authenticates in the body (`client_secret_post`) instead of HTTP Basic.
        resource:
          type: string
          format: uri
          description:
            The one API the renewed access token is for, from among those the
            sign-in covers (RFC 8707 s2.2). Omitted or empty, the only covered API, else the
            client's `default_resource`. A refusal does not spend the refresh token.
          example: "https://account.example.com"

    UserinfoResponse:
      type: object
      description: |
        UserInfo claims. `sub` is always present; `email` / `phone_number`
        appear only when the access token's scope allows them and the user has them set.
      required:
        - sub
      properties:
        sub:
          type: string
          description: The user's immutable user id (the token subject).
          example: "9aXb7cD..."
        email:
          type: string
          description: Present only with `email` / `profile` scope.
          example: "user@example.com"
        phone_number:
          type: string
          description: Present only with `phone` scope.
          example: "+15551234567"

    RevokeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description:
            The refresh token to revoke. Only this one token is invalidated, not
            the other tokens from the same login. An access token here has no
            effect.
          example: "a1b2c3d4.9f8e7d6c..."
        token_type_hint:
          type: string
          description: Optional hint; ignored.
          enum: ["refresh_token", "access_token"]
          example: "refresh_token"
        client_id:
          type: string
          description:
            Public client identifier (RFC 6749 §3.2.1) when not using the Basic
            header. A confidential client authenticates via Basic instead.
          example: "rainmaker-neo-home-app-client"

    GetUserResponse:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          description:
            The user's opaque identifier, minted by this issuer (the token `sub`
            claim).
          example: "8f3e9c1a-2b4d-4f6e-9a8c-1d2e3f4a5b6c"
        email:
          type: string
          format: email
          description: User's email address, if signed up with email.
          example: "user@example.com"
        phone_number:
          type: string
          description:
            User's phone number in E.164 format, if signed up with phone.
          example: "+1234567890"

    Client:
      type: object
      description: |
        A registered OAuth/OIDC client as returned by List. `client_secret` is
        included only when the list request passed `get_secret=true` (confidential
        clients only).
      properties:
        client_id:
          type: string
          example: "rm_mobile"
        client_name:
          type: string
          example: "RainMaker Mobile"
        client_type:
          type: string
          enum: ["public", "confidential"]
        redirect_uris:
          type: array
          items:
            type: string
          description: |
            Exact-match callback URLs. Validated at registration: absolute, fragment-free,
            no wildcards; `https` must carry a host; plain `http` is accepted only for
            loopback (`localhost`, `127.0.0.1`, `::1`) per RFC 8252 s7.3; a private-use
            scheme (`com.example.app://cb`) must address something; and `javascript:`,
            `data:`, `vbscript:`, `file:`, `blob:`, `about:` are refused -- they name code
            or a local file rather than a destination.
        post_logout_redirect_uris:
          type: array
          description: |
            Where GET /oauth2/logout may return the browser afterwards. Validated with
            exactly the rules `redirect_uris` gets, for the same reason: an endpoint that
            forwards a browser anywhere on a caller's say-so is an open redirect wearing the
            issuer's own hostname, and validating only one of the two lists would make the
            weaker one the list an attacker uses.

            A logout naming an unregistered URI is still
            performed; the browser simply lands on the issuer's own page instead.
          items:
            type: string
          example: ["https://app.example.com/signed-out"]
        grant_types:
          type: array
          items:
            type: string
            enum: ["authorization_code", "refresh_token"]
          description: implicit and password grants are not allowed.
        scopes:
          type: array
          items:
            type: string
            enum: ["openid", "email", "profile", "phone", "account:sessions", "offline_access"]
          example: ["openid", "profile", "email", "phone"]
        require_pkce:
          type: boolean
          description: Always true for public clients.
        application_type:
          type: string
          enum: [web, native]
          description: A native app's sign-in gets a session of its own, so a browser sign-out leaves it signed in (OIDC Dynamic Client Registration 1.0 s2). A native client must be public and may redirect only to its own URI scheme or an http loopback address.
        first_party:
          type: boolean
          description: Whether this client is one the account ships itself. A first-party client signs in with no consent screen and may manage a user's own sessions.
        logo_uri:
          $ref: "#/components/schemas/LogoURI"
        allowed_resources:
          type: array
          description:
            RFC 8707 resource identifiers this client may request an access token for.
            Absent means none, never any -- the parameter must enforce something for a
            client nobody configured.

            Each entry must be an absolute URI **with a host** and without a fragment,
            validated at write time. Requiring an authority is deliberately stricter than
            RFC 8707 s2, because a one-slash `https:/api.example.com` is a legal absolute
            URI with an empty host that would register happily and then never match the
            `https://api.example.com` a client actually sends. Non-authority forms such as
            `urn:` are rejected.
          items:
            type: string
            format: uri
        default_resource:
          type: string
          format: uri
          description:
            The one resource an access token is for when a request names no `resource`
            (RFC 9068 s3). Must be one of `allowed_resources`. Absent means a request that
            names no resource is refused with `invalid_target`.
          example: https://api.example.com
        allowed_providers:
          type: array
          description:
            Identity providers this client offers at login. Absent means ALL of them --
            the reverse of allowed_resources, because a provider list is a menu and an
            absent menu cannot sensibly mean none.
          items:
            type: string
        client_secret:
          type: string
          description:
            Plaintext secret; present only when the list request set
            get_secret=true (confidential clients).
        created_at:
          type: integer
        updated_at:
          type: integer

    ClientCreateRequest:
      type: object
      required:
        - client_name
        - client_type
      properties:
        client_id:
          type: string
          description:
            Supply to pin a stable id (e.g. rm_mobile); omit to auto-generate
            one (rm_<random>).
        client_name:
          type: string
          description: Human-readable display name.
        client_type:
          type: string
          enum: ["public", "confidential"]
        redirect_uris:
          type: array
          description: |
            Exact-match callback URLs. Validated at registration: absolute, fragment-free,
            no wildcards; `https` must carry a host; plain `http` is accepted only for
            loopback (`localhost`, `127.0.0.1`, `::1`) per RFC 8252 s7.3; a private-use
            scheme (`com.example.app://cb`) must address something; and `javascript:`,
            `data:`, `vbscript:`, `file:`, `blob:`, `about:` are refused -- they name code
            or a local file rather than a destination.
          items:
            type: string
          default: []
        post_logout_redirect_uris:
          type: array
          description: |
            Where GET /oauth2/logout may return the browser afterwards. Validated with
            exactly the rules `redirect_uris` gets, for the same reason: an endpoint that
            forwards a browser anywhere on a caller's say-so is an open redirect wearing the
            issuer's own hostname, and validating only one of the two lists would make the
            weaker one the list an attacker uses.

            A logout naming an unregistered URI is still
            performed; the browser simply lands on the issuer's own page instead.
          items:
            type: string
          example: ["https://app.example.com/signed-out"]
        grant_types:
          type: array
          description: implicit/password are rejected.
          items:
            type: string
            enum: ["authorization_code", "refresh_token"]
          default: ["authorization_code", "refresh_token"]
        scopes:
          type: array
          description:
            Allowed scopes for this client. Not yet enforced (the authorize
            slice will validate requested ⊆ this list), so an empty list has no
            effect today.
          items:
            type: string
            enum: ["openid", "email", "profile", "phone", "account:sessions", "offline_access"]
          default: []
        require_pkce:
          type: boolean
          description:
            Always true for public clients (forced server-side); applies to
            confidential clients as sent.
          default: false
        application_type:
          type: string
          enum: [web, native]
          default: web
          description: native for an app installed on a device; each of its sign-ins then gets a session of its own, so a browser sign-out leaves it signed in. A native client must be public and may redirect only to its own URI scheme or an http loopback address.
        first_party:
          type: boolean
          description:
            Mark this client as one the account ships itself. A first-party client signs in with
            no consent screen and may manage a user's own sessions; leave false for third-party
            integrations, which the person is asked to allow on every sign-in.
          default: false
        logo_uri:
          $ref: "#/components/schemas/LogoURI"
        allowed_resources:
          type: array
          description:
            RFC 8707 resource identifiers this client may request an access token for.
            Absent means none, never any -- the parameter must enforce something for a
            client nobody configured.

            Each entry must be an absolute URI **with a host** and without a fragment,
            validated at write time. Requiring an authority is deliberately stricter than
            RFC 8707 s2, because a one-slash `https:/api.example.com` is a legal absolute
            URI with an empty host that would register happily and then never match the
            `https://api.example.com` a client actually sends. Non-authority forms such as
            `urn:` are rejected.
          items:
            type: string
            format: uri
        default_resource:
          type: string
          format: uri
          description:
            The one resource an access token is for when a request names no `resource`
            (RFC 9068 s3). Must be one of `allowed_resources`. Absent means a request that
            names no resource is refused with `invalid_target`.
          example: https://api.example.com
        allowed_providers:
          type: array
          description:
            Identity providers this client offers at login. Absent means ALL of them --
            the reverse of allowed_resources, because a provider list is a menu and an
            absent menu cannot sensibly mean none.
          items:
            type: string

    ClientUpdateRequest:
      type: object
      description: |
        Full replacement of a client's mutable fields (client_id / client_type / secret are
        immutable). The body is the complete desired state; an omitted field resets to
        empty/default.
      required:
        - client_name
      properties:
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        post_logout_redirect_uris:
          type: array
          description: |
            Where GET /oauth2/logout may return the browser afterwards. Validated with
            exactly the rules `redirect_uris` gets, for the same reason: an endpoint that
            forwards a browser anywhere on a caller's say-so is an open redirect wearing the
            issuer's own hostname, and validating only one of the two lists would make the
            weaker one the list an attacker uses.

            A logout naming an unregistered URI is still
            performed; the browser simply lands on the issuer's own page instead.
          items:
            type: string
          example: ["https://app.example.com/signed-out"]
        grant_types:
          type: array
          items:
            type: string
            enum: ["authorization_code", "refresh_token"]
        scopes:
          type: array
          items:
            type: string
            enum: ["openid", "email", "profile", "phone", "account:sessions", "offline_access"]
        require_pkce:
          type: boolean
        application_type:
          type: string
          enum: [web, native]
          description: Replaces the stored type when sent; omitting it keeps the stored one. A native client must be public and may redirect only to its own URI scheme or an http loopback address.
        first_party:
          type: boolean
          description:
            Whether this client is one the account ships itself. PUT replaces it, so omitting
            it resets to false.
        logo_uri:
          $ref: "#/components/schemas/LogoURI"
        allowed_resources:
          type: array
          description:
            RFC 8707 resource identifiers this client may request an access token for.
            Absent means none, never any -- the parameter must enforce something for a
            client nobody configured.

            Each entry must be an absolute URI **with a host** and without a fragment,
            validated at write time. Requiring an authority is deliberately stricter than
            RFC 8707 s2, because a one-slash `https:/api.example.com` is a legal absolute
            URI with an empty host that would register happily and then never match the
            `https://api.example.com` a client actually sends. Non-authority forms such as
            `urn:` are rejected.
          items:
            type: string
            format: uri
        default_resource:
          type: string
          format: uri
          description:
            The one resource an access token is for when a request names no `resource`
            (RFC 9068 s3). Must be one of `allowed_resources`. Absent means a request that
            names no resource is refused with `invalid_target`.
          example: https://api.example.com
        allowed_providers:
          type: array
          description:
            Identity providers this client offers at login. Absent means ALL of them --
            the reverse of allowed_resources, because a provider list is a menu and an
            absent menu cannot sensibly mean none.
          items:
            type: string

    LogoURI:
      type: string
      description: "The client's logo on the consent screen (RFC 7591 §2): a base64 PNG, JPEG or WebP `data:` URI of at most 4 KiB."
      example: data:image/png;base64,iVBORw0KGgo=

    ClientCreateResponse:
      type: object
      description: |
        Returned by Create. client_secret is present only for confidential clients;
        it is also retrievable later via List with get_secret=true.
      required:
        - client_id
        - client_type
      properties:
        client_id:
          type: string
          example: "rm_mobile"
        client_secret:
          type: string
          description: Plaintext secret (confidential clients only).
        client_type:
          type: string
          enum: ["public", "confidential"]

    Error:
      type: object
      properties:
        message:
          type: string
          description: Detailed error message
          example: "Invalid request"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Unauthorized - Invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Unauthorized"

    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Not found"

    Forbidden:
      description:
        Forbidden - User does not have permission to access the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Internal server error"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Too many requests"

  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      description: |
        Admin Cognito User Pool JWT, for the admin APIs (`/v1/admin/*`).
        End-user routes take an ESP User token instead — see `bearerAuth`.
      x-amazon-apigateway-authtype: cognito_user_pools
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An ESP User access token, sent as a Bearer token. The token is verified
        against the provider's published public keys.
    clientBasicAuth:
      type: http
      scheme: basic
      description: |
        OAuth client authentication (RFC 6749 §2.3.1) as HTTP Basic
        `base64(client_id:client_secret)`. A confidential client sends its secret;
        a public client sends its client_id with an empty secret.

security: []
