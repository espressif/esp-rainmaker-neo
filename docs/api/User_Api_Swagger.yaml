openapi: 3.0.0
info:
  title: ESP RainMaker Neo Auth & Accounts API
  version: 0.8.0
  description: |
    Sign-in and account management for the ESP RainMaker Neo cloud.
    Anything that produces or rotates an access token lives here; once
    you have a token, the rest of the platform lives in the
    **ESP RainMaker Neo Platform API**

    ESP User is the platform's own OAuth 2.1 / OIDC issuer: every token a client
    holds is minted here, regardless of how the user proved their identity.
    Admins authenticate directly against their AWS Cognito user pool.

    Login methods (all end in OUR tokens; upstream credentials never reach clients):

    - **Federated login (default)**: `GET /oauth2/authorize` starts a browser
      authorization-code + PKCE flow. With a single enabled identity provider the
      user is auto-redirected to it; the
      broker exchanges the upstream code server-side and issues OUR authorization
      code at the client's `redirect_uri`.
    - **Native password APIs** (`/v1/user/auth/*`): the main-era
      native surface. Credentials are verified against the bundled Cognito pool server-side and converted to our tokens.

    Token lifecycle after login:

    1. `POST /oauth2/token` (`grant_type=refresh_token`) - rotate the token set
       (native `/v1/user/auth/token/refresh` is reuse-tolerant instead).
    2. Send `access_token` as a `Bearer` `Authorization` header on subsequent
       calls. To call the platform API you must first exchange the token for AWS
       credentials at `POST /v1/user/credentials` and SigV4-sign every request.
       A token this IdP issued is exchanged on its own; a token issued directly by
       the Cognito provider must also carry its `id_token` in the body, and the two
       must come from the same sign-in.
  termsOfService: http://swagger.io/terms/
  contact:
    email: esp-rainmaker-support@espressif.com
    url: https://rainmaker.espressif.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

# A `servers:` block lets Swagger UI (and the docusaurus-openapi-docs
# Try-it-out panel) populate a base URL. Replace `{deployment}` with
# your stack's API Gateway hostname; `{stage}` is the API Gateway stage,
# which every RMNG deployment creates as `prod`.
servers:
  - url: https://{deployment}/{stage}
    description: Your ESP RainMaker Neo deployment's API Gateway base URL
    variables:
      deployment:
        default: api.example.com
        description: Replace with your API Gateway hostname.
      stage:
        default: prod
        description: API Gateway stage name.

# Top-level tag declarations control rendering order in Swagger UI
# and in the docs-site sidebar.
tags:
  - name: OIDC Discovery
    description:
      Public OpenID Connect discovery documents. Fetch these before starting an
      auth request.
  - name: OAuth2 / OIDC Core
    description:
      Authorization, token issuance/rotation, userinfo, revocation, and sign-out — the endpoints every login method converges on.
  - name: Federated Login
    description:
      The upstream legs of a browser login started at `/oauth2/authorize`, brokered to an upstream identity provider (Cognito hosted UI in the open-source deployment). Clients only ever receive ESP User tokens.
  - name: User Auth
    description:
      The main-era native `/v1/user/auth/*` password surface, kept
      request/response compatible. Credentials verify against the bundled
      Cognito pool server-side; every token returned is an ESP User token.
  - name: Sessions
    description:
      The authorization server's own browser session — sign-out, and a person's
      list of the browsers they are signed in on.
  - name: Users
    description: User lookup.
  - name: Admin Clients
    description: Admin-only OAuth client registry
  - name: Admin Creds
    description:
      Scoped AWS credentials the dashboard uses to run seevral admin steps

paths:
  # ==========================================
  # OIDC Discovery (public, static)
  # ==========================================

  /.well-known/openid-configuration:
    get:
      summary: OpenID Provider metadata
      description:
        OIDC discovery document — endpoint URLs and the `jwks_uri`. Public and
        cacheable.
      tags:
        - OIDC Discovery
      security: []
      responses:
        "200":
          description: Discovery metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIDConfiguration"

  /.well-known/oauth-authorization-server:
    get:
      summary: OAuth 2.0 Authorization Server metadata
      description:
        OAuth 2.0 authorization server metadata for non-OIDC clients. Public and
        cacheable.
      tags:
        - OIDC Discovery
      security: []
      responses:
        "200":
          description: Authorization Server metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"

  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set
      description:
        Public keys for verifying issued tokens. Public and cacheable.
      tags:
        - OIDC Discovery
      security: []
      responses:
        "200":
          description: JWK Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"

  /oauth2/authorize:
    get:
      summary: Start browser login (authorization code + PKCE)
      description: |
        Starts the authorization-code + PKCE (`S256`) login. Validates the client, the exact `redirect_uri` and PKCE, sets the `__Host-esp_flow_id` cookie, and sends the browser to the login: straight to `/oauth2/federation/start` when exactly one provider is enabled, to the OTP page in an OTP-only deployment, otherwise to `/oauth2/login`. On success the browser returns to `redirect_uri` with a single-use `code` and `state`.

        A live `__Host-esp_session` cookie skips the login and returns the code immediately (single sign-on), unless `prompt`, `max_age` or `id_token_hint` rule it out.
      tags:
        - OAuth2 / OIDC Core
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: ["code"]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          description:
            Must exactly match a registered redirect URI for the client.
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description:
            Optional (RFC 6749 §4.1.1), space-delimited; include `openid` for an
            id_token. Each requested scope must be within the client's allowed
            scopes.
          schema:
            type: string
            example: "openid email"
        - name: code_challenge
          in: query
          required: false
          description:
            PKCE code challenge (RFC 7636). Required for clients registered with
            `require_pkce` (always the case for public clients); optional
            otherwise.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          description: Must be `S256` when a `code_challenge` is provided.
          schema:
            type: string
            enum: ["S256"]
        - name: state
          in: query
          required: false
          description:
            Opaque value echoed back on the redirect (client CSRF token).
          schema:
            type: string
        - name: resource
          in: query
          required: false
          description: |
            RFC 8707 resource indicator: the API the access token is for, stamped into
            `aud` on that token and on every token the resulting refresh family later
            mints. Must appear in the client's `allowed_resources`, or the request is
            rejected with `invalid_target`.

            **Default when omitted:** `aud` is the `client_id`. **At most one** value; two
            are refused rather than minting a token good at two APIs. An ID token's `aud`
            is the `client_id` either way — it is a statement to that client.
          schema:
            type: string
            format: uri
          example: "https://api.accounts.espressif.com"
        - name: prompt
          in: query
          required: false
          description: |
            OIDC Core §3.1.2.1. **Default when
            omitted:** a live session answers the request silently.

            `none` never shows a prompt — it answers from the session or redirects back
            with `error=login_required`. `login` forces re-authentication even with a live
            session, and is carried to the upstream provider so it re-authenticates too.

            `consent` and `select_account` are accepted, but this server does not yet
            distinguish them from `login`: all three disable the session shortcut, and the
            value is forwarded verbatim to the upstream provider. Neither renders a surface
            of its own here — there is no consent screen, and account choice belongs to the
            provider — so any difference you observe between them comes from the provider,
            not from us.
          schema:
            type: string
            example: "none"
        - name: max_age
          in: query
          required: false
          description: |
            Maximum acceptable age, in seconds, of the session's authentication (its
            `auth_time`, inherited from the upstream provider). A session older than this
            is not used and the user re-authenticates.

            **Default when omitted:** no age bound — a session is used however old its
            authentication, up to the session's own idle and absolute limits. `max_age=0`
            always forces re-authentication. Carried to the upstream provider alongside
            `prompt`.
          schema:
            type: integer
            minimum: 0
        - name: id_token_hint
          in: query
          required: false
          description: |
            A previously issued ID token naming the expected subject. A session
            belonging to anyone else — or a hint that does not verify — is not
            used; the flow never switches to the hinted user.
          schema:
            type: string
      responses:
        "302":
          description: |
            Redirect to the login UI (with a `flow_id` session cookie) — or, when
            a live session satisfies `prompt`/`max_age`/`id_token_hint`,
            straight back to `redirect_uri?code=…&state=…` with
            no login surface at all. A post-validation error instead redirects to
            `redirect_uri?error=<code>&state=<state>` (`invalid_scope`,
            `invalid_target`, or `login_required` for a failed `prompt=none`).
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description:
                Short-lived HttpOnly Secure SameSite=Lax flow_id cookie.
              schema:
                type: string
        "400":
          description: |
            invalid_request / unsupported_response_type / invalid client or
            redirect_uri — rendered on the service error page (not redirected).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /oauth2/federation/start:
    get:
      summary: Redirect to an upstream identity provider
      description: |
        Sends the browser to the upstream provider's login. Reads the flow from the `__Host-esp_flow_id` cookie, refuses a provider the client does not allow, and records this leg's own `state`, `nonce` and PKCE verifier on the flow. The client's values never reach the provider.
      tags:
        - Federated Login
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          description:
            Provider name from the identity-provider registry (e.g. `cognito`).
          schema:
            type: string
        - name: __Host-esp_flow_id
          in: cookie
          required: true
          description: Login-flow session cookie set by `/oauth2/authorize`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's hosted login page.
          headers:
            Location:
              schema:
                type: string
        "400":
          description:
            Missing/expired flow or unknown provider (HTML error page).
          content:
            text/html:
              schema:
                type: string

  /oauth2/federation/callback:
    get:
      summary: Upstream provider callback
      description: |
        The provider returns here after login. Verifies `state` against the flow, exchanges the upstream code, validates the upstream `id_token`, finds or creates the ESP User account, and redirects to the client's `redirect_uri` with a single-use `code`. Upstream tokens are discarded.
      tags:
        - Federated Login
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Upstream authorization code.
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: The broker's own HMAC-bound state (not the client's).
          schema:
            type: string
      responses:
        "302":
          description:
            Redirect to the client's `redirect_uri` with `code` (+ `state`).
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: |
                The `__Host-esp_session` cookie
                (`Path=/; HttpOnly; Secure; SameSite=Lax`) establishing the
                authorization server's own session, whose record inherits the
                upstream's `auth_time`. It stores no token — an opaque revocable
                identifier only. A session-layer failure never blocks the login
                itself.
              schema:
                type: string
        "400":
          description:
            State/flow mismatch or upstream validation failure (HTML error
            page).
          content:
            text/html:
              schema:
                type: string

  /oauth2/token:
    post:
      summary: OAuth token endpoint
      description: |
        Issues tokens by `grant_type`:
        - `authorization_code`: a login code and its PKCE verifier for a token set
        - `refresh_token`: a new token set; the refresh token rotates
        - `client_credentials`: a confidential client's own access token; no user, refresh token or id token

        Other grants return `unsupported_grant_type`. A confidential client authenticates with HTTP Basic (`401 invalid_client` on failure); a public client sends `client_id` with no secret.
      tags:
        - OAuth2 / OIDC Core
      security:
        - clientBasicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TokenCodeRequest"
                - $ref: "#/components/schemas/TokenRefreshRequest"
                - $ref: "#/components/schemas/TokenClientCredentialsRequest"
              discriminator:
                propertyName: grant_type
      responses:
        "200":
          description: A fresh token set, including a new refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSet"
        "400":
          description: invalid_request / invalid_grant / unsupported_grant_type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: invalid_client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /oauth2/userinfo:
    get:
      summary: OIDC UserInfo endpoint
      description: |
        Returns the profile claims for the presented access token: `sub` always, `email` with the `email` or `profile` scope, `phone_number` with `phone`.
      tags:
        - OAuth2 / OIDC Core
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The subject's scope-authorized claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserinfoResponse"
        "401":
          description: |
            invalid_token — the access token is missing, expired, or invalid.
            Carries a `WWW-Authenticate: Bearer error="invalid_token"` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    post:
      summary: OIDC UserInfo endpoint (POST variant)
      description: |
        Same as `GET`. The access token may also be sent as the `access_token` field of a form body.
      tags:
        - OAuth2 / OIDC Core
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  description:
                    The access token, when not sent in the Authorization header.
                  example: "eyJhbGciOiJSUzI1Ni..."
      responses:
        "200":
          description: The subject's scope-authorized claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserinfoResponse"
        "401":
          description:
            invalid_token — the access token is missing, expired, or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /oauth2/revoke:
    post:
      summary: OAuth token revocation endpoint
      description: |
        Ends the login the refresh token belongs to: its whole refresh family, for that application only. An access token is accepted and ignored. Always `200`, even for an unknown token.

        The client identifies itself with HTTP Basic (confidential) or the `client_id` form field (public). Neither returns `400 invalid_request`; a bad secret or unknown client returns `401 invalid_client`.
      tags:
        - OAuth2 / OIDC Core
      security:
        - clientBasicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "200":
          description: The token (if any) has been revoked. Empty body.
        "400":
          description:
            invalid_request — the `token` is missing, or neither Basic nor
            `client_id` was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description:
            invalid_client — unknown client, or a confidential client with a
            bad/missing secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  # ==========================================
  # GROUP 4: Authenticated User Profile
  # ==========================================

  # ==========================================
  # Native auth (/v1/user/auth/*)
  # Main-era request/response shapes; Cognito verified server-side, OUR tokens returned.
  # ==========================================
  # ==========================================
  # Sessions and sign-out
  # ==========================================

  /oauth2/logout:
    get:
      summary: RP-Initiated Logout (OpenID Connect RP-Initiated Logout 1.0 §2)
      description: |
        Signs this browser out: deletes every refresh family under its session, the session and its cookie, then redirects to `post_logout_redirect_uri`. When the identity provider has its own sign-out, the browser goes there first and comes back through `/oauth2/logout/done`.

        - Must be a top-level navigation; a `fetch` does not carry the `SameSite=Lax` session cookie.
        - `post_logout_redirect_uri` must exactly match one registered for the client. Otherwise it is ignored and the response is `200 Signed out.`; the sign-out still happens.
        - Access tokens already issued stay valid until they expire (up to an hour).
      tags:
        - OAuth2 / OIDC Core
      security: []
      parameters:
        - name: __Host-esp_session
          in: cookie
          required: false
          schema:
            type: string
          description:
            The session credential. The browser is identified by this cookie, not by the
            query parameters below, which are optional hints. Absent means there is no
            session to end and the request still succeeds (nothing to do).
        - name: client_id
          in: query
          required: false
          schema:
            type: string
          description:
            The client whose registered list the return URL is checked against. Optional when an `id_token_hint` is sent, which names the client itself; when both are sent and `client_id` is not the hint's audience, the return URL is ignored (RP-Initiated Logout 1.0 §2). The sign-out happens either way.
        - name: post_logout_redirect_uri
          in: query
          required: false
          schema:
            type: string
            format: uri
          description:
            Where to send the browser afterwards. Must exact-match one of the client's
            registered `post_logout_redirect_uris`.
        - name: id_token_hint
          in: query
          required: false
          schema:
            type: string
          description: |
            A previously issued ID token naming who is signing out. RECOMMENDED, not
            required. A hint that verifies and names a **different** subject ends nothing —
            ending a stranger's session on a stranger's say-so is the one outcome that must
            not happen. A hint that cannot be verified at all is ignored and the sign-out
            proceeds: omitting the parameter was always allowed, so refusing there would buy
            nothing and cost every sign-out whose token had merely aged past its hour.
            Expiry is deliberately not checked for the same reason. A verified hint also names the client when `client_id` is absent.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description:
            Opaque value echoed back on the redirect to `post_logout_redirect_uri`
            (RP-Initiated Logout 1.0 §2), so the RP can correlate the logout response with
            its request. Ignored when there is no validated destination to return to.
      responses:
        "302":
          description: |
            Redirect to the validated destination, or onward to the provider's end-session
            endpoint. Clears the session cookie.
        "200":
          description:
            Signed out, with nowhere validated to return to. Clears the session cookie.
        "405":
          description: Method not allowed.
    post:
      summary: RP-Initiated Logout (form POST)
      description: |
        Same as `GET`, sent as a form POST.
      tags:
        - OAuth2 / OIDC Core
      security: []
      responses:
        "302":
          description: As `GET`.
        "200":
          description: As `GET`.

  /oauth2/logout/done:
    get:
      summary: Return point for the upstream provider's sign-out
      description: |
        Where the identity provider returns the browser after its own sign-out. Redirects to the `post_logout_redirect_uri` saved in the `__Host-esp_logout_to` cookie, or answers `200 Signed out.` when there is none. This is the one sign-out URL registered with the provider; applications never call it.
      tags:
        - OAuth2 / OIDC Core
      security: []
      responses:
        "302":
          description: Redirect to the remembered destination, clearing the memo cookie.
        "200":
          description: |
            No memo, or one naming somewhere this server will not forward to: the sign-out
            is reported complete rather than inventing a destination.

  /v1/user/sessions:
    get:
      summary: The browsers this person is signed in on
      description: |
        Lists the person's signed-in user agents, each with the applications signed in on it. Requires the `account:sessions` scope.
      tags:
        - Sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's own sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id:
                          type: string
                          description: The session's public identifier. Exposed as `session_id` in the body; the path parameter stays `{sessionId}`, and the underlying OIDC token claim and stored attribute remain `sid`.
                        current:
                          type: boolean
                          description: True for the session this request's own token was minted under.
                        user_agent_type:
                          type: string
                          description: The readable rendering of user_agent, derived at render time — "Chrome on macOS" for a browser, "Android app" for a native client whose User-Agent names only an SDK. "Unknown" / "App" when it cannot be told.
                        user_agent_name:
                          type: string
                          description: The label the person gave this login at OTP initiate, when one was supplied. Absent on every other login path. A client showing a name should prefer this over user_agent_type — one is chosen, the other inferred.
                        user_agent: { type: string }
                        ip_address: { type: string }
                        provider: { type: string }
                        origin:
                          type: string
                          enum: [browser, app]
                          description: Whether this sign-in origin holds a cookie (browser, SSO possible) or none (app, never SSO). Absent reads as browser.
                        signed_in_at:
                          type: integer
                          format: int64
                          description: auth_time, epoch seconds. A fact, never moved by use.
                        last_seen_at:
                          type: integer
                          format: int64
                          description: Most recent activity of any kind — rendered as "last active".
                        expires_at:
                          type: integer
                          format: int64
                          description: The session's retention deadline and the table's TTL attribute; the row is swept once this passes with no activity. A cookie_expires_at in the past on a row still listed here is what "signed in, but this browser must sign in again" looks like — an app row simply has no cookie_expires_at.
                        cookie_expires_at:
                          type: integer
                          format: int64
                          description: When the browser will drop the cookie (browser rows only). A record of what we told the browser, not a control.
                        clients:
                          type: array
                          items:
                            type: object
                            properties:
                              client_id: { type: string }
                              created_at: { type: integer, format: int64 }
                              last_used: { type: integer, format: int64 }
              example:
                sessions:
                  - session_id: sess_9fA2
                    current: true
                    user_agent_type: Chrome on macOS
                    origin: browser
                    signed_in_at: 1725100000
                    last_seen_at: 1725190000
                    expires_at: 1759750000
                    cookie_expires_at: 1759750000
                    clients:
                      - { client_id: esp-account-dashboard, created_at: 1725100000, last_used: 1725190000 }
                  - session_id: sess_7bQ9
                    current: false
                    user_agent_type: Android app
                    user_agent_name: John's iPhone
                    origin: app
                    signed_in_at: 1725000000
                    last_seen_at: 1725300000
                    expires_at: 1759860000
                    clients:
                      - { client_id: user-pool-client, created_at: 1725000000, last_used: 1725300000 }
        "401":
          description: Missing, malformed, expired, or not an access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "403":
          description: The token was not granted `account:sessions`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
    delete:
      summary: Sign out everywhere
      description: |
        Signs the person out of every user agent, including this one, by deleting every session and refresh family. Requires the `account:sessions` scope.
      tags:
        - Sessions
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Everything ended.
        "401":
          description: Missing, malformed, expired, or not an access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "403":
          description: The token was not granted `account:sessions`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /v1/user/sessions/{sessionId}:
    delete:
      summary: End one browser's session
      description: |
        Signs one user agent out from anywhere by deleting its session and its refresh families. `204` on success; `404` when the caller has no such session, including one that belongs to someone else. Requires the `account:sessions` scope.
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          description: The session's public id, from `GET /v1/user/sessions`.
      responses:
        "204":
          description: The session was ended.
        "401":
          description: Missing, malformed, expired, or not an access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "403":
          description: The token was not granted `account:sessions`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "404":
          description: No such session for this user (the cross-user case included).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

  /v1/user/auth/token:
    post:
      summary: Password sign-in
      description: |
        Signs in with `username` and `password`, verified against the bundled Cognito pool, and returns an ESP User token set.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyTokenRequest"
      responses:
        "200":
          description: ESP User token set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSet"
        "400":
          description: "`Invalid request body`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            `Authentication failed` — wrong password, or no such account.
            `Signin failed. Account not verified — reset your password.` — correct password, account never verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/user/auth/token/refresh:
    post:
      summary: Refresh tokens
      description: |
        Exchanges a refresh token for a new token set. The refresh token rotates: store the new one, because replaying a spent one ends the login.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRefreshRequest"
      responses:
        "200":
          description: ESP User token set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/user/auth/signup:
    post:
      summary: Create an account
      description: |
        Creates an account with exactly one of `email` or `phone_number` plus a `password`, and sends a verification code to confirm at `signup/verify`.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacySignupRequest"
      responses:
        "201":
          description: Account created; verification required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  requires_verification:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example:
                      Code sent. Existing RainMaker users must signin or reset
                      password.
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/user/auth/signup/verify:
    post:
      summary: Confirm signup
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                email:
                  type: string
                phone_number:
                  type: string
                code:
                  type: string
                  description: Verification code Cognito delivered at signup.
      responses:
        "200":
          description: "`Verified successfully. You can now login.`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: |
            `Invalid code or RainMaker account already exists. Try signin or reset password.` — one answer for every failure: wrong, expired or empty code, an account that does not exist, and an account that is already confirmed. The product name appears only when the resolved provider is named RainMaker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/user/auth/password-recovery:
    post:
      summary: Start password recovery
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: The account email or phone number.
      responses:
        "200":
          description: Reset code sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: If your account exists, you will receive a code
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/user/auth/password-recovery/confirmation:
    post:
      summary: Confirm password recovery
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, code, new_password]
              properties:
                username:
                  type: string
                code:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/user/auth/password:
    post:
      summary: Change password
      description: |
        Changes the caller's password. Requires this issuer's access token and the current password. Other sessions stay signed in.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token, old_password, new_password]
              properties:
                access_token:
                  type: string
                  description: Access token issued by this service.
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Missing field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/user/auth/signout:
    post:
      summary: Sign out
      description: |
        Ends the login the refresh token belongs to (its refresh family), the same as `/oauth2/revoke`. `global: "true"` is refused with `400`; sign out each login with its own refresh token.
      tags:
        - User Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                global:
                  type: string
                  description:
                    Accepted for compatibility; `"true"` is rejected with `400`.
      responses:
        "200":
          description: Signed out.
        "400":
          description:
            Refresh token missing, or a global signout was requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description:
          The user's id, or `me` for the currently authenticated user.
        schema:
          type: string
    get:
      summary: Get user details
      description: |
        Returns a user's profile; `me` means the caller. The access token is sent as `Bearer` and verified in the handler (no API Gateway authorizer).
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ==========================================
  # Admin — OAuth Client Registry (admin)
  # ==========================================

  /v1/admin/clients:
    post:
      summary: Create OAuth client
      description: |
        Registers an OAuth client. `redirect_uris` are exact matches, `implicit` and `password` grants are refused, and public clients must use PKCE. A confidential client's secret is generated and returned in the response. Admin only.
      tags:
        - Admin Clients
      security:
        - CognitoAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreateRequest"
      responses:
        "201":
          description:
            Client created; client_secret present only for confidential, only
            here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      summary: List OAuth clients
      description: |
        Lists every client. `get_secret=true` includes each confidential client's secret, which is how a lost secret is recovered. Admin only.
      tags:
        - Admin Clients
      security:
        - CognitoAuthorizer: []
      parameters:
        - name: get_secret
          in: query
          required: false
          description:
            If true, include each confidential client's plaintext client_secret.
          schema:
            type: boolean
            default: false
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: The registered clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/clients/{client_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update OAuth client
      description: |
        Replaces a client's editable fields; omitted fields reset to their defaults. `client_id`, `client_type` and the secret cannot change. Same validation as create. Admin only.
      tags:
        - Admin Clients
      security:
        - CognitoAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateRequest"
      responses:
        "200":
          description: The updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete OAuth client
      description: |
        Deletes the client. It can no longer sign users in or get tokens; tokens already issued work until they expire. Admin only.
      tags:
        - Admin Clients
      security:
        - CognitoAuthorizer: []
      responses:
        "200":
          description: Client deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/credentials:
    post:
      summary: Get espuser-scoped AWS credentials (admin)
      description: |
        Returns short-lived AWS credentials limited to the espuser setup steps the dashboard runs: SNS SMS sandbox status, the SMS monthly spend limit, and Service Quotas reads and increase requests.
      tags:
        - Admin Creds
      security:
        - CognitoAuthorizer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredsRequest"
      responses:
        "200":
          description: Scoped credentials issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Failed to assume the admin-creds role

components:
  schemas:
    CredsRequest:
      type: object
      properties:
        session_suffix:
          type: string
          maxLength: 32
          pattern: "^[a-zA-Z0-9]*$"
          description:
            Optional alphanumeric suffix appended to the STS role session name,
            so concurrent admin sessions are distinguishable in CloudTrail.
          example: "dash01"
    CredsResponse:
      type: object
      required:
        - access_key
        - secret_key
        - session_token
      properties:
        access_key:
          type: string
          description: Temporary AWS access key ID.
        secret_key:
          type: string
          description: Temporary AWS secret access key.
        session_token:
          type: string
          description: Temporary AWS session token.
        expiration:
          type: integer
          nullable: true
          description:
            Unix timestamp at which the credentials expire, 1 hour from now.
          example: 1767225600
    OpenIDConfiguration:
      type: object
      description:
        OIDC provider metadata. The live document may include more fields.
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer:
          type: string
          format: uri
          description:
            This provider's issuer identifier (the deployment base URL).
          example: "https://auth.customer.com"
        authorization_endpoint:
          type: string
          format: uri
          example: "https://auth.customer.com/oauth2/authorize"
        token_endpoint:
          type: string
          format: uri
          example: "https://auth.customer.com/oauth2/token"
        jwks_uri:
          type: string
          format: uri
          description: URL of the JSON Web Key Set used to verify issued tokens.
          example: "https://auth.customer.com/.well-known/jwks.json"
        response_types_supported:
          type: array
          items:
            type: string
            enum: [code]
          example: ["code"]
        subject_types_supported:
          type: array
          items:
            type: string
            enum: [public]
          example: ["public"]
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum: [RS256]
          example: ["RS256"]

    AuthorizationServerMetadata:
      type: object
      description:
        OAuth 2.0 authorization server metadata. The live document may include
        more fields.
      required:
        - issuer
        - response_types_supported
        - authorization_endpoint
        - token_endpoint
      properties:
        issuer:
          type: string
          format: uri
          description: This authorization server's issuer identifier.
          example: "https://auth.customer.com"
        authorization_endpoint:
          type: string
          format: uri
          example: "https://auth.customer.com/oauth2/authorize"
        token_endpoint:
          type: string
          format: uri
          example: "https://auth.customer.com/oauth2/token"
        jwks_uri:
          type: string
          format: uri
          description: URL of the JSON Web Key Set used to verify issued tokens.
          example: "https://auth.customer.com/.well-known/jwks.json"
        response_types_supported:
          type: array
          items:
            type: string
            enum: [code]
          example: ["code"]
        grant_types_supported:
          type: array
          items:
            type: string
            enum: [authorization_code, refresh_token]
          example: ["authorization_code", "refresh_token"]
        code_challenge_methods_supported:
          type: array
          items:
            type: string
            enum: [S256]
          example: ["S256"]

    JWKS:
      type: object
      description: JSON Web Key Set. Public signing keys only.
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JWK"

    JWK:
      type: object
      description: A single RSA public signing key.
      required:
        - kty
        - kid
        - use
        - alg
        - n
        - e
      properties:
        kty:
          type: string
          enum: [RSA]
          description: Key type.
          example: "RSA"
        kid:
          type: string
          description: Key ID; matched against the JWT header `kid`.
          example: "2026-06-a"
        use:
          type: string
          enum: [sig]
          description: Public key use; `sig` for signature verification.
          example: "sig"
        alg:
          type: string
          enum: [RS256]
          description: Algorithm this key is bound to.
          example: "RS256"
        n:
          type: string
          description: RSA modulus, base64url-encoded.
          example: "0vx7agoebGcQSuuPiLJXZptN..."
        e:
          type: string
          description: RSA public exponent, base64url-encoded.
          example: "AQAB"

    LegacyTokenRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: The account email or phone number.
        password:
          type: string
          format: password

    LegacyRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token from this surface; spent once redeemed.

    LegacySignupRequest:
      type: object
      required: [password]
      properties:
        email:
          type: string
          description: Exactly one of email or phone_number.
        phone_number:
          type: string
          description: E.164; exactly one of email or phone_number.
        password:
          type: string
          format: password

    TokenSet:
      type: object
      description: The issued ESP User token set.
      properties:
        access_token:
          type: string
          description: The access token.
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
          description: Refresh token; rotated on each use.
        id_token:
          type: string
          description: Present only if `openid` was requested.

    OAuthError:
      type: object
      description:
        OAuth 2.0 error response. Distinct from the API's generic `{message}`
        errors.
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - invalid_target
            - invalid_token
          example: "invalid_grant"
        error_description:
          type: string
          description:
            Human-readable detail. Does not distinguish why the token was
            rejected.
          example: "The refresh token is invalid, expired, or revoked."

    TokenClientCredentialsRequest:
      type: object
      description: |
        A confidential client obtains an access token for **itself** (RFC 6749 §4.4).
        There is no resource owner, so the response carries **no refresh token** (the
        client re-authenticates by presenting its credentials again) and **no id token**
        (there is no human to describe).

        In the minted token `sub` is the `client_id` (RFC 9068 §2.2.1) and `aud` is the
        requested `resource` — the API the token will be spent at, not the caller.
        Rejected for public clients with `unauthorized_client`: a public client has no
        credentials to present.
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum: ["client_credentials"]
          example: "client_credentials"
        scope:
          type: string
          description: |
            Space-separated subset of the client's registered scopes. Omitted grants all
            of them — there is no user whose consent could narrow it further, so the
            registration is the only bound. An unregistered scope returns `invalid_scope`.
          example: "account.admin"
        resource:
          type: string
          format: uri
          description: |
            RFC 8707 resource indicator: the API this token is for, stamped into `aud`.
            Must appear in the client's `allowed_resources` or the request is rejected
            with `invalid_target`; a client with none registered may request none.

            **At most one.** Two `resource` values are rejected rather than producing a
            multi-audience token, so a leaked token is useful against exactly one API.

            Omitted leaves `aud` as the `client_id`, which is the shape a caller that does
            not use this extension sees.
          example: "https://api.accounts.espressif.com"

    TokenCodeRequest:
      type: object
      description: |
        Exchange a browser-login authorization code for tokens. `code_verifier`
        is required iff the code was issued with a PKCE challenge (always, for
        public clients); `client_id` and `redirect_uri` must match those used at
        `/oauth2/authorize`.
      required:
        - grant_type
        - code
        - client_id
        - redirect_uri
      properties:
        grant_type:
          type: string
          enum: ["authorization_code"]
          description: Must be `authorization_code`.
          example: "authorization_code"
        code:
          type: string
          description: The single-use authorization code from the redirect.
          example: "ac_7f2b9c..."
        code_verifier:
          type: string
          description:
            PKCE verifier whose S256 hash equals the challenge sent at
            authorize. Required iff the code was bound to a challenge.
          example: "dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"
        client_id:
          type: string
          description: Must equal the client that started the flow.
          example: "user-pool-client"
        redirect_uri:
          type: string
          description: Must equal the redirect_uri used at authorize.
          example: "com.example://callback"

    TokenRefreshRequest:
      type: object
      required:
        - grant_type
        - refresh_token
        - client_id
      properties:
        grant_type:
          type: string
          enum: ["refresh_token"]
          description: Must be `refresh_token`.
          example: "refresh_token"
        refresh_token:
          type: string
          description:
            The current refresh token; it is replaced with a new one on use.
          example: "a1b2c3d4.9f8e7d6c..."
        client_id:
          type: string
          description: The client the token was issued to. Required.
          example: "rm_mobile"

    UserinfoResponse:
      type: object
      description: |
        UserInfo claims. `sub` is always present; `email` / `phone_number`
        appear only when the access token's scope allows them and the user has them set.
      required:
        - sub
      properties:
        sub:
          type: string
          description: The user's immutable user id (the token subject).
          example: "9aXb7cD..."
        email:
          type: string
          description: Present only with `email` / `profile` scope.
          example: "user@example.com"
        phone_number:
          type: string
          description: Present only with `phone` scope.
          example: "+15551234567"

    RevokeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description:
            The refresh token to revoke. Only this one token is invalidated, not
            the other tokens from the same login. An access token here has no
            effect.
          example: "a1b2c3d4.9f8e7d6c..."
        token_type_hint:
          type: string
          description: Optional hint; ignored.
          enum: ["refresh_token", "access_token"]
          example: "refresh_token"
        client_id:
          type: string
          description:
            Public client identifier (RFC 6749 §3.2.1) when not using the Basic
            header. A confidential client authenticates via Basic instead.
          example: "user-pool-client"

    GetUserResponse:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          description:
            The user's opaque identifier, minted by this issuer (the token `sub`
            claim).
          example: "8f3e9c1a-2b4d-4f6e-9a8c-1d2e3f4a5b6c"
        email:
          type: string
          format: email
          description: User's email address, if signed up with email.
          example: "user@example.com"
        phone_number:
          type: string
          description:
            User's phone number in E.164 format, if signed up with phone.
          example: "+1234567890"

    Client:
      type: object
      description: |
        A registered OAuth/OIDC client as returned by List. `client_secret` is
        included only when the list request passed `get_secret=true` (confidential
        clients only).
      properties:
        client_id:
          type: string
          example: "rm_mobile"
        client_name:
          type: string
          example: "RainMaker Mobile"
        client_type:
          type: string
          enum: ["public", "confidential"]
        redirect_uris:
          type: array
          items:
            type: string
          description: |
            Exact-match callback URLs. Validated at registration: absolute, fragment-free,
            no wildcards; `https` must carry a host; plain `http` is accepted only for
            loopback (`localhost`, `127.0.0.1`, `::1`) per RFC 8252 s7.3; a private-use
            scheme (`com.example.app://cb`) must address something; and `javascript:`,
            `data:`, `vbscript:`, `file:`, `blob:`, `about:` are refused -- they name code
            or a local file rather than a destination.
        post_logout_redirect_uris:
          type: array
          description: |
            Where GET /oauth2/logout may return the browser afterwards. Validated with
            exactly the rules `redirect_uris` gets, for the same reason: an endpoint that
            forwards a browser anywhere on a caller's say-so is an open redirect wearing the
            issuer's own hostname, and validating only one of the two lists would make the
            weaker one the list an attacker uses.

            A logout naming an unregistered URI is still
            performed; the browser simply lands on the issuer's own page instead.
          items:
            type: string
          example: ["https://app.example.com/signed-out"]
        grant_types:
          type: array
          items:
            type: string
            enum: ["authorization_code", "refresh_token"]
          description: implicit and password grants are not allowed.
        scopes:
          type: array
          items:
            type: string
            enum: ["openid", "email", "profile", "phone", "account:sessions"]
          example: ["openid", "profile", "email", "phone"]
        require_pkce:
          type: boolean
          description: Always true for public clients.
        first_party:
          type: boolean
          description: Whether this client is one the account ships itself; only a first-party client may manage a user's own sessions.
        allowed_resources:
          type: array
          description:
            RFC 8707 resource identifiers this client may request an access token for.
            Absent means none, never any -- the parameter must enforce something for a
            client nobody configured.

            Each entry must be an absolute URI **with a host** and without a fragment,
            validated at write time. Requiring an authority is deliberately stricter than
            RFC 8707 s2, because a one-slash `https:/api.example.com` is a legal absolute
            URI with an empty host that would register happily and then never match the
            `https://api.example.com` a client actually sends. Non-authority forms such as
            `urn:` are rejected.
          items:
            type: string
            format: uri
        allowed_providers:
          type: array
          description:
            Identity providers this client offers at login. Absent means ALL of them --
            the reverse of allowed_resources, because a provider list is a menu and an
            absent menu cannot sensibly mean none.
          items:
            type: string
        client_secret:
          type: string
          description:
            Plaintext secret; present only when the list request set
            get_secret=true (confidential clients).
        created_at:
          type: integer
        updated_at:
          type: integer

    ClientCreateRequest:
      type: object
      required:
        - client_name
        - client_type
      properties:
        client_id:
          type: string
          description:
            Supply to pin a stable id (e.g. rm_mobile); omit to auto-generate
            one (rm_<random>).
        client_name:
          type: string
          description: Human-readable display name.
        client_type:
          type: string
          enum: ["public", "confidential"]
        redirect_uris:
          type: array
          description: |
            Exact-match callback URLs. Validated at registration: absolute, fragment-free,
            no wildcards; `https` must carry a host; plain `http` is accepted only for
            loopback (`localhost`, `127.0.0.1`, `::1`) per RFC 8252 s7.3; a private-use
            scheme (`com.example.app://cb`) must address something; and `javascript:`,
            `data:`, `vbscript:`, `file:`, `blob:`, `about:` are refused -- they name code
            or a local file rather than a destination.
          items:
            type: string
          default: []
        post_logout_redirect_uris:
          type: array
          description: |
            Where GET /oauth2/logout may return the browser afterwards. Validated with
            exactly the rules `redirect_uris` gets, for the same reason: an endpoint that
            forwards a browser anywhere on a caller's say-so is an open redirect wearing the
            issuer's own hostname, and validating only one of the two lists would make the
            weaker one the list an attacker uses.

            A logout naming an unregistered URI is still
            performed; the browser simply lands on the issuer's own page instead.
          items:
            type: string
          example: ["https://app.example.com/signed-out"]
        grant_types:
          type: array
          description: implicit/password are rejected.
          items:
            type: string
            enum: ["authorization_code", "refresh_token"]
          default: ["authorization_code", "refresh_token"]
        scopes:
          type: array
          description:
            Allowed scopes for this client. Not yet enforced (the authorize
            slice will validate requested ⊆ this list), so an empty list has no
            effect today.
          items:
            type: string
            enum: ["openid", "email", "profile", "phone", "account:sessions"]
          default: []
        require_pkce:
          type: boolean
          description:
            Always true for public clients (forced server-side); applies to
            confidential clients as sent.
          default: false
        first_party:
          type: boolean
          description:
            Mark this client as one the account ships itself. Only a first-party client may
            manage a user's own sessions; leave false for third-party integrations.
          default: false
        allowed_resources:
          type: array
          description:
            RFC 8707 resource identifiers this client may request an access token for.
            Absent means none, never any -- the parameter must enforce something for a
            client nobody configured.

            Each entry must be an absolute URI **with a host** and without a fragment,
            validated at write time. Requiring an authority is deliberately stricter than
            RFC 8707 s2, because a one-slash `https:/api.example.com` is a legal absolute
            URI with an empty host that would register happily and then never match the
            `https://api.example.com` a client actually sends. Non-authority forms such as
            `urn:` are rejected.
          items:
            type: string
            format: uri
        allowed_providers:
          type: array
          description:
            Identity providers this client offers at login. Absent means ALL of them --
            the reverse of allowed_resources, because a provider list is a menu and an
            absent menu cannot sensibly mean none.
          items:
            type: string

    ClientUpdateRequest:
      type: object
      description: |
        Full replacement of a client's mutable fields (client_id / client_type / secret are
        immutable). The body is the complete desired state; an omitted field resets to
        empty/default.
      required:
        - client_name
      properties:
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        post_logout_redirect_uris:
          type: array
          description: |
            Where GET /oauth2/logout may return the browser afterwards. Validated with
            exactly the rules `redirect_uris` gets, for the same reason: an endpoint that
            forwards a browser anywhere on a caller's say-so is an open redirect wearing the
            issuer's own hostname, and validating only one of the two lists would make the
            weaker one the list an attacker uses.

            A logout naming an unregistered URI is still
            performed; the browser simply lands on the issuer's own page instead.
          items:
            type: string
          example: ["https://app.example.com/signed-out"]
        grant_types:
          type: array
          items:
            type: string
            enum: ["authorization_code", "refresh_token"]
        scopes:
          type: array
          items:
            type: string
            enum: ["openid", "email", "profile", "phone", "account:sessions"]
        require_pkce:
          type: boolean
        first_party:
          type: boolean
          description:
            Whether this client is one the account ships itself. PUT replaces it, so omitting
            it resets to false.
        allowed_resources:
          type: array
          description:
            RFC 8707 resource identifiers this client may request an access token for.
            Absent means none, never any -- the parameter must enforce something for a
            client nobody configured.

            Each entry must be an absolute URI **with a host** and without a fragment,
            validated at write time. Requiring an authority is deliberately stricter than
            RFC 8707 s2, because a one-slash `https:/api.example.com` is a legal absolute
            URI with an empty host that would register happily and then never match the
            `https://api.example.com` a client actually sends. Non-authority forms such as
            `urn:` are rejected.
          items:
            type: string
            format: uri
        allowed_providers:
          type: array
          description:
            Identity providers this client offers at login. Absent means ALL of them --
            the reverse of allowed_resources, because a provider list is a menu and an
            absent menu cannot sensibly mean none.
          items:
            type: string

    ClientCreateResponse:
      type: object
      description: |
        Returned by Create. client_secret is present only for confidential clients;
        it is also retrievable later via List with get_secret=true.
      required:
        - client_id
        - client_type
      properties:
        client_id:
          type: string
          example: "rm_mobile"
        client_secret:
          type: string
          description: Plaintext secret (confidential clients only).
        client_type:
          type: string
          enum: ["public", "confidential"]

    Error:
      type: object
      properties:
        message:
          type: string
          description: Detailed error message
          example: "Invalid request"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Unauthorized - Invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Unauthorized"

    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Not found"

    Forbidden:
      description:
        Forbidden - User does not have permission to access the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Internal server error"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Too many requests"

  securitySchemes:
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      description: |
        Admin Cognito User Pool JWT, for the admin APIs (`/v1/admin/*`).
        End-user routes take an ESP User token instead — see `bearerAuth`.
      x-amazon-apigateway-authtype: cognito_user_pools
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An ESP User access token, sent as a Bearer token. The token is verified
        against the provider's published public keys.
    clientBasicAuth:
      type: http
      scheme: basic
      description: |
        OAuth client authentication (RFC 6749 §2.3.1) as HTTP Basic
        `base64(client_id:client_secret)`. A confidential client sends its secret;
        a public client sends its client_id with an empty secret.

security: []
