openapi: 3.0.0
info:
  title: ESP RainMaker Neo Platform API
  version: 0.1.0
  description: |
    REST API for the ESP RainMaker Neo platform - everything except
    sign-up and authentication, which live in the separate
    **ESP RainMaker Neo User API** (`User_Api_Swagger.yaml`).

    Covers what an app or admin dashboard does once a user is signed
    in: groups and sharing, node association, control surfaces
    (schedules, automations, triggers, time-series), admin operations
    (bulk node registration, voice-assistant integrations), and the
    credential exchange used for SigV4-signed requests.

    Each endpoint declares its security scheme:

    - `CognitoAuthorizer` - a bearer access token in the `Authorization`
      header, from the ESP User OIDC issuer for end users or the admin
      Cognito pool for admins. Used only by `/v1/user/credentials`, which
      also needs the paired `id_token` in the body.
    - `gvaAccessToken` - an ESP User `access_token` issued to the
      voice-assistant client during Google account linking, validated by the
      Lambda. Used only by `/v1/integrations/gva`.
    - `sigv4` - AWS SigV4 signing using the temporary credentials
      returned by `POST /v1/user/credentials`. Used by every other
      endpoint.

    Endpoints are organised by tag. End-user-facing surface is listed
    first (Group Management, Sharing, Node Association, control,
    telemetry, Matter, Notification Endpoints); admin-only surface
    follows (Node Administration, Integrations, File Management,
    Google Voice Assistant).
  termsOfService: http://swagger.io/terms/
  contact:
    email: esp-rainmaker-support@espressif.com
    url: https://rainmaker.espressif.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

# A `servers:` block lets Swagger UI (and the docusaurus-openapi-docs
# Try-it-out panel) populate a base URL. Replace `{deployment}` with
# your stack's API Gateway hostname; `{stage}` is the API Gateway stage,
# which every RMNG deployment creates as `prod`.
servers:
  - url: https://{deployment}/{stage}
    description: Your ESP RainMaker Neo deployment's API Gateway base URL
    variables:
      deployment:
        default: api.example.com
        description: Replace with your API Gateway hostname.
      stage:
        default: prod
        description: API Gateway stage name.

# Top-level tag declarations - each operation `tags:` field references
# one of the names below. Order here is the order rendered in
# Swagger UI sections and in the docs-site sidebar (when
# `groupPathsBy: tag` is enabled). End-user-facing groups first,
# admin/deployment groups after the comment.
tags:
  - name: User Credentials
    description:
      Exchange the login's token pair for temporary AWS credentials used to sign
      every other (sigv4) call. Mandatory step right after login.
  - name: Role Assumption
    description:
      Step up to credentials scoped to a specific group, or to the IoT-user role
      required to open MQTT WebSocket connections. Not needed for plain REST
      calls.
  - name: Group Management
    description:
      Create, list, update, and delete groups and subgroups; manage memberships.
  - name: Group Sharing
    description: Share an entire group with another user.
  - name: Subgroup Sharing
    description: Share a subgroup specifically.
  - name: Sharing Requests
    description: Accept, reject, and list pending share invitations.
  - name: Node Association
    description:
      Associate a physical node with a group; covers both classic and Matter
      flows.
  - name: Node Configuration
    description:
      Read the device-reported configuration (type, params, services) of a node.
  - name: Node Tags
    description: Read and update user-scoped tags on a node.
  - name: Group Automation
    description: Define and run automation rules at the group level.
  - name: Node Schedule
    description: Schedule parameter updates on a node.
  - name: Node Trigger
    description: Event-based triggers for nodes.
  - name: Node Timeseries
    description: Query historical and aggregated parameter data.
  - name: Matter Fabric
    description: Generate Matter NOCs and other Matter-specific operations.
  - name: Notification Endpoints
    description:
      Per-user operations called from end-user apps - register a delivery
      endpoint on an integration (push install, account-link, etc.).
  - name: Assisted Claiming
    description:
      Cloud-signed node onboarding - reserve a server-assigned node ID for a
      device MAC, then exchange a CSR for a certificate signed by the
      deployment's claiming CA. Present only on deployments that enable claiming
      (indicated by the rmng-claim-core AssistedClaiming output being present in
      the published outputs).
  # --- Admin surface below ---
  - name: Node Administration
    description:
      Admin-only - bulk node registration, single-node registration jobs.
  - name: File Management
    description:
      Admin-only - upload templates and CSV files used by registration jobs.
  - name: Integrations
    description: Admin-only - configure 3p integrations (Alexa Skill, etc.).
  - name: Google Voice Assistant
    description: Admin-only - configure the Google Voice Assistant integration.

paths:
  /v1/groups/{groupId}/node-assoc-requests:
    post:
      summary: Create a node association request
      description: |
        Initiates the process of associating a node with a user's group.
        Generates a request ID and challenge string that will be used in the verification step.

        For Matter-capable groups, the challenge is 32 bytes (64 hex characters) which serves
        as the CSR nonce for device NOC generation.

        For non-Matter groups, the challenge is a standard alphanumeric string.
      tags:
        - Node Association
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "201":
          description: Association initiated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiateResponse"
              examples:
                nonMatterGroup:
                  summary: Non-Matter group response (alphanumeric challenge)
                  value:
                    request_id: "abc123def456"
                    challenge: "xK9mPq2sT7vW4yB8"
                matterGroup:
                  summary:
                    Matter group response (32-byte hex challenge used as CSR
                    nonce)
                  value:
                    request_id: "abc123def456"
                    challenge: "A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4E5F6A1B2"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to store association data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Failed to store data"

  /v1/groups/{groupId}/node-assoc-requests/{requestId}/verify:
    post:
      summary: Verify node association
      description: |
        Verifies the node association. Two authentication methods are supported, and exactly
        one must be used (they are mutually exclusive):

        **Method 1: challenge_response (traditional flow)**
        - The node signs the SHA256 hash of the challenge using its private key.
        - Requires `node_id` to identify the node whose certificates will be used for verification.
        - Works for both Matter and non-Matter groups.
        - The node is immediately added to the group upon successful verification.
        - No NOC is generated - use nocsr_elements if NOC generation is needed.

        **Method 2: nocsr_elements (Matter attestation flow)**
        - The device provides NOCSRElements TLV containing CSR, nonce, and optional vendor_reserved1.
        - Only valid for Matter-capable groups.
        - Requires `attestation_challenge` and `attestation_signature`.
        - If vendor_reserved1 contains a nodeID with registered certificates, signature is verified.
        - For pure Matter nodes (no vendor_reserved1 or no certificates), a random node_id is generated.
        - The `node_id` field is optional/ignored - extracted from vendor_reserved1 or auto-generated.
        - Returns the device NOC (Node Operational Certificate) and Matter Node ID.
        - The node is NOT added to the group yet - call /confirm after device installs the NOC.

        **For non-Matter groups:**
        - Use challenge_response method only (nocsr_elements not supported).
        - The node is immediately added to the group upon successful verification.
        - Returns a success response.

        **For Matter-capable groups (two options):**
        - Option A: Use challenge_response to add node to group without NOC generation.
        - Option B: Use nocsr_elements to get a NOC, then call /confirm to complete association.
      tags:
        - Node Association
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
            examples:
              challengeResponseNonMatter:
                summary: "Non-Matter group: challenge_response flow"
                description: |
                  The node signs the SHA256 hash of the challenge using its private key.
                  Requires node_id. The node is immediately added to the group.
                value:
                  challenge_response: "304502210098f3e3b2a1c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f502207a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5"
                  node_id: "MySmartLight01"
              challengeResponseMatter:
                summary:
                  "Matter group: challenge_response flow (RainMaker device, no
                  NOC generation)"
                description: |
                  Same as non-Matter flow. The node is added to the group directly
                  without NOC generation. Use this when the device already has
                  operational credentials and only needs group membership.
                value:
                  challenge_response: "304502210098f3e3b2a1c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f502207a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5"
                  node_id: "MySmartLight01"
              nocsrElementsWithNodeId:
                summary:
                  "Matter group: nocsr_elements flow (device with registered
                  certificates)"
                description: |
                  The device provides NOCSRElements TLV containing CSR, CSR nonce,
                  and vendor_reserved1 (containing the nodeID/thing name).
                  The attestation signature is verified against the device's registered
                  certificates. Returns a device NOC. Call /confirm after the device
                  installs the NOC.
                value:
                  nocsr_elements: "1530012930820122300d06092a864886f70d01010105000382010f003082010a0282010100b5c2030201023020"
                  attestation_challenge: "0102030405060708090a0b0c0d0e0f10"
                  attestation_signature: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
              nocsrElementsPureMatter:
                summary:
                  "Matter group: nocsr_elements flow (pure Matter device, no
                  vendor_reserved1)"
                description: |
                  For pure Matter devices without registered certificates, vendor_reserved1
                  is absent. A random 16-character hex node_id (8 bytes) is generated by the server.
                  Returns a device NOC. Call /confirm after the device installs the NOC.
                value:
                  nocsr_elements: "1530012930820122300d06092a864886f70d01010105000382010f003082010a0282010100b5c203020102301a"
                  attestation_challenge: "0102030405060708090a0b0c0d0e0f10"
                  attestation_signature: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
      responses:
        "200":
          description: |
            Verification successful.
            For non-Matter groups: Node added to group.
            For Matter groups with challenge_response: Node added to group (no NOC).
            For Matter groups with nocsr_elements: Returns NOC for device to install, then call /confirm.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - $ref: "#/components/schemas/VerifyMatterResponse"
              examples:
                nonMatterChallengeResponse:
                  summary: "Non-Matter group: node added to group"
                  value:
                matterChallengeResponse:
                  summary:
                    "Matter group with challenge_response: node added to group
                    (no NOC)"
                  value:
                matterNOCSRElements:
                  summary:
                    "Matter group with nocsr_elements: returns NOC and Matter
                    Node ID"
                  value:
                    noc:
                      "-----BEGIN
                      CERTIFICATE-----\nMIIBpjCCAUygAwIBAgIIX...\n-----END
                      CERTIFICATE-----"
                    matter_node_id: "4E6F64653132330000000000"
                    node_id: "MySmartLight01"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidRequestId:
                  value:
                    message: "Invalid request ID"
                invalidBody:
                  value:
                    message: "Invalid request body"
                groupIdMismatch:
                  value:
                    message: "Group ID mismatch"
                missingCSR:
                  value:
                    message: "Missing CSR for Matter group"
        "401":
          description: Invalid challenge response or user ID mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidChallengeResponse:
                  value:
                    message: "Invalid challenge response"
                userIdMismatch:
                  value:
                    message: "User ID mismatch"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                certFetchError:
                  value:
                    message: "Failed to fetch certificates for thing"
                groupAddError:
                  value:
                    message: "Failed to add node to new group"

  /v1/groups/{groupId}/node-assoc-requests/{requestId}/confirm:
    post:
      summary: Confirm node association (Matter groups only)
      description: |
        Confirms the node association after the device has successfully installed the NOC.
        This is the final step in the Matter device association flow.

        **Flow for Matter groups:**
        1. Call /initiate to get request_id and challenge
        2. Call /verify with signed challenge and CSR to get the device NOC
        3. Device installs the NOC
        4. Call /confirm to finalize the association and add node to group

        This endpoint is only used for Matter-capable groups. For non-Matter groups,
        the node is added to the group during the /verify step.
      tags:
        - Node Association
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                capabilities:
                  type: array
                  items:
                    type: string
                  description:
                    List of capabilities to enable for the node (e.g., ["acc"])
            examples:
              withCapabilities:
                summary: "Confirm with capabilities"
                description: |
                  Confirms the node association and invokes capability lambdas for each requested capability.
                value:
                  capabilities: ["acc"]
              withoutCapabilities:
                summary: "Confirm without capabilities"
                description: |
                  Confirms the node association without invoking any capability lambdas.
                value: {}
      responses:
        "200":
          description: Node successfully added to the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidRequestId:
                  value:
                    message: "Invalid request ID"
                notVerified:
                  value:
                    message: "Request not in verified status"
                groupIdMismatch:
                  value:
                    message: "Group ID mismatch"
        "401":
          description: User ID mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "User ID mismatch"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Failed to confirm node association"

  /v1/assumed-roles:
    post:
      summary: Assume IoT user role
      description: |
        Assumes an IoT user role for the authenticated caller. The caller is identified
        via the SigV4-signed request; no AWS credentials need to be passed in the body.

        **Regular User Flow:**
        Returns credentials with IAM permissions scoped to all groups and subgroups the user has access to.

        **Admin User Flow:**
        Super admin users can use group and subgroup scoped APIs, `/v1/groups/{groupId}/assumed-roles` or `/v1/groups/{groupId}/subgroups/{subGroupId}/assumed-roles` variants instead.

        **MQTT client ID:** the returned credentials permit `iot:Connect` only with client id
        `user:<email|phone>:<session>` — the caller's own login username plus a per-session suffix.
        The bare `user:<email|phone>` form is rejected. See the ESP RainMaker Neo User MQTT API (MQTT_User) spec.
      tags:
        - Role Assumption
      security:
        - sigv4: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssumeRoleRequest"
            examples:
              Regular User:
                summary: Standard assume role for regular users
                value: {}
      responses:
        "200":
          description: Successful response with new credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssumeRoleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/assumed-roles:
    post:
      summary: Assume IoT user role scoped to a group (super admin only)
      description: |
        Assumes an IoT user role scoped to the specified group. The returned
        credentials are restricted to this group instead of all of the caller's groups.

        Requires the user to have `custom:super_admin` set to "true" in Cognito,
        and the specified group must exist.
      tags:
        - Role Assumption
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssumeRoleRequest"
      responses:
        "200":
          description: Successful response with new credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssumeRoleResponse"
        "400":
          description: Bad request - group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Group not found"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description:
            Forbidden - user is not a super admin but tried to use admin
            parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Admin privileges required"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/subgroups/{subGroupId}/assumed-roles:
    post:
      summary: Assume IoT user role scoped to a subgroup (super admin only)
      description: |
        Assumes an IoT user role scoped to the specified subgroup. The returned
        credentials are restricted to this subgroup only.

        Requires the user to have `custom:super_admin` set to "true" in Cognito,
        and the specified group and subgroup must exist.
      tags:
        - Role Assumption
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/SubGroupId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssumeRoleRequest"
      responses:
        "200":
          description: Successful response with new credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssumeRoleResponse"
        "400":
          description: Bad request - group not found or subgroup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                groupNotFound:
                  value:
                    message: "Group not found"
                subgroupNotFound:
                  value:
                    message: "Subgroup not found"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description:
            Forbidden - user is not a super admin but tried to use admin
            parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Admin privileges required"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/nodes/{nodeId}/assumed-roles:
    post:
      summary: Assume role for per-node S3/KVS access
      description: |
        Returns temporary credentials scoped to a single node for the requested
        services (S3 and/or KVS). The response contains ONLY the listed service
        permissions — no IoT/MQTT statements — keeping the STS session policy a
        constant size regardless of how many nodes the user can access.

        The caller is identified via the SigV4-signed request. Access is granted
        when the node belongs to the path group AND the caller has access to that
        group (full-group access, or a shared subgroup the node belongs to).
        Super admins may assume role for any node.
      tags:
        - Role Assumption
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssumeRolePerNodeRequest"
            examples:
              S3 only:
                summary: S3 credentials for one node
                value:
                  services: ["s3"]
              KVS only:
                summary: KVS viewer credentials for one node
                value:
                  services: ["kvs"]
              Both:
                summary: S3 and KVS credentials for one node
                value:
                  services: ["s3", "kvs"]
      responses:
        "200":
          description: Successful response with new credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssumeRoleResponse"
        "400":
          description:
            Bad request - missing/invalid services or unsupported service value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                servicesRequired:
                  value:
                    message: "services is required"
                unsupportedService:
                  value:
                    message: "unsupported service: mqtt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden - caller does not have access to this node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "User does not have access to this node"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/user/credentials:
    post:
      summary: Generate AWS credentials for the authenticated user
      description: |
        Exchanges the caller's token pair for temporary AWS credentials
        (access key id, secret access key, session token) with an expiry.

        Needs **both** tokens: `Authorization: Bearer <access_token>` plus
        `id_token` in the body, from one sign-in — an end-user pair minted by
        the ESP User OIDC issuer, or an admin pair from the admin Cognito
        pool. Both halves are verified against the issuer the access token
        names and must carry the same authentication-event id, or the request
        is rejected with `403`. The `id_token` is what the Identity Pool
        federates.

        For both users and admins.
      tags:
        - User Credentials
      security:
        - CognitoAuthorizer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description:
                    ID token from the same sign-in as the access token in the
                    Authorization header.
              required:
                - id_token
      responses:
        "200":
          description: Successful response with AWS credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCredsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description:
            The `id_token` does not belong to the authenticated caller, or comes
            from a different sign-in than the access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIStatusMessage"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # ASSISTED CLAIMING
  # ----------------------------------------------------------------------

  /v1/claim/initiate:
    post:
      # Deployed only when assisted claiming is enabled. Machine-readable marker
      # for doc tooling; availability = presence of the rmng-claim-core
      # AssistedClaiming output in the published outputs.
      x-feature-flag: assisted-claiming
      summary: Reserve a node ID for a device
      description: |
        Assigns a cloud-generated node ID to a device MAC address, creating the
        reservation when none exists. The node ID is minted before any
        certificate exists, so certificate identity is server-determined.

        Idempotent per {MAC, caller}: a repeat call returns the existing node
        ID with `200` instead of `201`, and does not count against the caller's
        quota. The request `mac_addr` is never echoed back.

        Available only on deployments with assisted claiming enabled; check for
        the rmng-claim-core `AssistedClaiming` output in the published outputs
        (absent when the claim group is not deployed). When it is not deployed
        these routes do not exist, so a request is rejected at the API Gateway
        rather than reaching the service. The `404` below is the service's own
        response when claiming is inactive.
      tags:
        - Assisted Claiming
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInitiateRequest"
      responses:
        "200":
          description: Existing reservation returned (idempotent repeat)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimInitiateResponse"
        "201":
          description: New reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimInitiateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Per-caller node quota reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/claim/verify:
    post:
      # Deployed only when assisted claiming is enabled. Machine-readable marker
      # for doc tooling; availability = presence of the rmng-claim-core
      # AssistedClaiming output in the published outputs.
      x-feature-flag: assisted-claiming
      summary: Exchange a CSR for a signed certificate
      description: |
        Exchanges a device-generated CSR for a certificate signed by the
        deployment's claiming CA, and binds it to the node's IoT Thing.

        The CSR contributes only its public key; its subject is discarded and
        the certificate Common Name is rebuilt from the reservation, so the
        caller cannot influence the identity it receives. `capabilities` must
        be re-supplied on a re-claim, since they are applied to the new
        certificate; tags are never accepted from the request.

        Available only on deployments with assisted claiming enabled; check for
        the rmng-claim-core `AssistedClaiming` output in the published outputs
        (absent when the claim group is not deployed). When it is not deployed
        these routes do not exist, so a request is rejected at the API Gateway
        rather than reaching the service. The `404` below is the service's own
        response when claiming is inactive.
      tags:
        - Assisted Claiming
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimVerifyRequest"
      responses:
        "201":
          description: Certificate issued and bound to the node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimVerifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No reservation for this caller and device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # GROUP MANAGEMENT
  # ----------------------------------------------------------------------

  /v1/groups:
    post:
      summary: Create a new group
      description: Creates a new group and associates the current user with it
      tags:
        - Group Management
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      summary: List groups for the user
      description: |
        Retrieves a list of groups of current user.
      tags:
        - Group Management
      security:
        - sigv4: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGroupsResponse"
              examples:
                nonMatterGroups:
                  summary: Groups without Matter capability
                  value:
                    groups:
                      - group_id: "grp_abc123"
                        group_name: "My Home"
                        access_type: "secondary"
                        node_ids:
                          - "MySmartLight01"
                          - "MySmartPlug02"
                        subgroups:
                          - subgroup_id: "sub_xyz789"
                            subgroup_name: "Living Room"
                            node_ids:
                              - "MySmartLight01"
                matterEnabledGroups:
                  summary: Groups with Matter capability
                  value:
                    groups:
                      - group_id: "grp_abc123"
                        group_name: "My Home"
                        access_type: "primary"
                        node_ids:
                          - "MySmartLight01"
                          - "MySmartPlug02"
                        subgroups:
                          - subgroup_id: "sub_xyz789"
                            subgroup_name: "Living Room"
                            node_ids:
                              - "MySmartLight01"
                      - group_id: "grp_matter456"
                        group_name: "Matter Home"
                        access_type: "primary"
                        node_ids:
                          - "MatterDevice01"
                        subgroups: []
                        matter:
                          fabric_id: "6162633132330000"
                          root_ca:
                            "-----BEGIN
                            CERTIFICATE-----\nMIIBpjCCAUygAwIBAgIIX...\n-----END
                            CERTIFICATE-----"
                          ipk: "0123456789ABCDEF0123456789ABCDEF"
                          group_cat_id_admin: "01000001"
                          group_cat_id_operate: "06000001"
                groupsWithCapabilities:
                  summary: Groups with node capabilities (e.g., ACC)
                  value:
                    groups:
                      - group_id: "grp_abc123"
                        group_name: "Living Room"
                        access_type: "primary"
                        node_ids:
                          - "node1"
                          - "node2"
                        node_details:
                          node1:
                            capabilities: ["rmng", "matter", "acc"]
                            capability_details:
                              acc:
                                endpoint_id: "de152ff2-f070-4d0e-94da-770828b1770f"
                              matter:
                                matter_node_id: "B2C3D4E5F6071829"
                          node2:
                            capabilities: ["matter"]
                            capability_details:
                              matter:
                                matter_node_id: "B2C3D4E5F6071829"
                        subgroups:
                          - subgroup_id: "sub1"
                            subgroup_name: "Corner Lights"
                            node_ids:
                              - "node1"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/subgroups:
    post:
      summary: Create a new subgroup
      description: Creates a new subgroup within the specified group
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubgroupRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSubgroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}:
    patch:
      summary: Update group information
      description: Updates the information of an existing group
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete a group
      description: |
        Deletes an empty group. The group must have no nodes and no
        subgroups; otherwise the request is rejected with 409. Remove all
        nodes and delete all subgroups first, then delete the group.
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Successful deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIStatusMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Group is not empty (still has nodes or subgroups)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIStatusMessage"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/subgroups/{subGroupId}:
    patch:
      summary: Update subgroup information
      description: Updates the information of an existing subgroup
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/SubGroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubgroupRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete a subgroup
      description: |
        Deletes an empty subgroup. The subgroup must have no nodes;
        otherwise the request is rejected with 409. Remove all nodes from
        the subgroup first, then delete it.
        - Removes the subgroup from the database.
        - Removes associated user-subgroup mappings.
        - Does NOT delete the nodes.
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
          description: The ID of the group containing the subgroup
        - in: path
          name: subGroupId
          required: true
          schema:
            type: string
          description: The ID of the subgroup to delete
      responses:
        "200":
          description: Successful deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Subgroup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Subgroup is not empty (still has nodes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/nodes/{nodeId}:
    delete:
      summary: Remove a node from a group (disassociation)
      description:
        Removes a node from the specified group. Requires the caller to be the
        sole primary user of the group. Not allowed for Matter-capable nodes.
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node successfully removed from group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupEditResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/subgroups/{subGroupId}/nodes/{nodeId}:
    put:
      summary: Add a node to a subgroup
      description: Adds a node to a specified subgroup
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/SubGroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupEditResponse"

    delete:
      summary: Remove a node from a subgroup
      description: |
        Removes a node from a specific subgroup while keeping it in the main group.
        The node must already be in the subgroup for this operation to succeed.
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/SubGroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node successfully removed from subgroup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupEditResponse"
        "500":
          description: Failed to remove node from subgroup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ----------------------------------------------------------------------
  # LIST GROUP USERS
  # ----------------------------------------------------------------------
  /v1/groups/{groupId}/users:
    get:
      summary: List users in a group
      description: |
        Returns users who have access to the specified group, along with
        their email, phone number, and access type. The listing scope depends
        on the caller's access level:
        - **Primary Access**: Sees all users (primary, secondary, and subentity users)
        - **Secondary Access**: Sees only primary users (for discovering group owners)
        - **Subentity Access**: Denied (requires group-level access)

        Useful for discovering user IDs before issuing unshare (DELETE) requests.
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGroupUsersResponse"
              examples:
                primaryCallerSeesAll:
                  summary:
                    Primary caller sees all users (primary, secondary,
                    subentity)
                  value:
                    users:
                      - user_id: "user-abc-123"
                        email: "owner@example.com"
                        access_type: "primary"
                      - user_id: "user-def-456"
                        email: "guest@example.com"
                        phone_number: "+1234567890"
                        access_type: "secondary"
                      - user_id: "user-ghi-789"
                        email: "subgroup-user@example.com"
                        access_type: "subgroup"
                        subgroups:
                          - "subgrp-001"
                secondaryCallerSeesOnlyPrimary:
                  summary: Secondary caller sees only primary users
                  value:
                    users:
                      - user_id: "user-abc-123"
                        email: "owner@example.com"
                        access_type: "primary"
        "400":
          description: Missing group ID or caller has no group-level access
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/subgroups/{subGroupId}/users:
    get:
      summary: List users in a subgroup
      description: |
        Returns the users who have access to the specified subgroup, along
        with their email, phone number, and access type. Every returned
        entry's `subgroups` is scoped to just this subgroup, regardless of
        whether the user's actual access is group-wide or subgroup-specific.

        The listing scope is determined by the caller's access level:
        - Primary callers see all users (primary, secondary, and subgroup users with access to this subgroup).
        - Secondary and subgroup-only callers see only the primary owners.
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/SubGroupId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGroupUsersResponse"
              examples:
                fullListing:
                  summary: Primary caller sees all users
                  value:
                    users:
                      - user_id: "user-abc-123"
                        email: "owner@example.com"
                        access_type: "primary"
                      - user_id: "user-ghi-789"
                        email: "subgroup-user@example.com"
                        access_type: "subgroup"
                        subgroups:
                          - "subgrp-001"
                primaryOwnersOnly:
                  summary: Subgroup-only caller sees only primary owners
                  value:
                    users:
                      - user_id: "user-abc-123"
                        email: "owner@example.com"
                        access_type: "primary"
        "400":
          description: Missing group ID or missing subgroup ID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # REMOVE MEMBER (Kick user or User leaving)
  # ----------------------------------------------------------------------
  /v1/groups/{groupId}/users/{userId}:
    delete:
      summary: Remove member from group
      description: |
        Removes an active member from the group.
        - If called by an **Admin**: Acts as "Kicking" the user.
        - If called by the **User themselves** (via 'me' alias): Acts as "Leaving" the group.
        - A Primary user can remove a Secondary user from the group. He can also remove other Primary users from the group.
        - The last remaining Primary user cannot be removed; the group must always have at least one Primary. Use remove node from group instead.
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user to remove (or 'me').
      responses:
        "200":
          description: Member successfully removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Member not found in this group
        "403":
          description: You do not have permission to remove this member
        "409":
          description: Cannot remove the last primary user from the group

  /v1/groups/{groupId}/subgroups/{subGroupId}/users/{userId}:
    delete:
      summary: Remove member from subgroup
      description: |
        Removes an active member from the subgroup.
        - If called by an **Admin**: Acts as "Kicking" the user.
        - If called by the **User themselves** (via 'me' alias): Acts as "Leaving" the group.
      tags:
        - Group Management
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/SubGroupId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user to remove (or 'me').
      responses:
        "200":
          description: Member successfully removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Member not found in this group
        "403":
          description: You do not have permission to remove this member

  /v1/groups/{groupId}/matter-nocs:
    post:
      summary: Generate Matter NOC for user
      description: |
        Generates a Node Operational Certificate (NOC) for the current user in a Matter-enabled group.
        Each phone app installation must retain its own ECDSA P-256 operational key and provide a
        Certificate Signing Request (CSR) for that key. The NOC is signed by the group's Root
        CA and uses a user Matter Node ID derived from the authenticated user, fabric, and key.
      tags:
        - Matter Fabric
      security:
        - sigv4: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
          description: The ID of the group (must have Matter capability)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterNOCRequest"
      responses:
        "200":
          description: NOC generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterNOCResponse"
        "400":
          description:
            Invalid request (missing CSR or group doesn't have Matter
            capability)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/capabilities:
    post:
      summary: Enable capabilities on an existing group
      description: |
        Enables the capabilities listed in the request body on an existing group.
        Only the group's primary owner may change capabilities. Each requested
        capability must be known and not already enabled on the group.

        Enabling the "matter" capability turns the group into a Matter fabric,
        generating the fabric's Root CA, IPK and CAT IDs (returned in the `matter`
        field).
      tags:
        - Matter Fabric
      security:
        - sigv4: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
          description: The ID of the group to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupCapabilitiesRequest"
      responses:
        "200":
          description: Capabilities enabled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddGroupCapabilitiesResponse"
        "400":
          description:
            Missing or unknown capabilities, or group not found / not accessible
            / not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A requested capability is already enabled on the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/nodes/{nodeId}/config:
    get:
      summary: Get node configuration
      description: |
        Retrieves the complete configuration data for a node.
        This endpoint returns the entire config object stored in the node_config table.
        For RainMaker devices, config is written only by the device firmware. PUT is
        allowed only for pure Matter nodes (see below); DELETE is not supported.
      tags:
        - Node Configuration
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: |
            Returned when the node has no config stored, or for PUT/DELETE
            (see below).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update node configuration (pure Matter nodes only)
      description: |
        Writes the configuration for a pure Matter node. Pure Matter nodes have no
        RainMaker firmware to publish their own config, so the app is the only source
        of it and supplies a complete Matter `NodeConfig` (`data_model: "matter"` with
        `endpoints`), which is stored verbatim.

        This is permitted only for pure Matter nodes - those tagged with the `matter`
        capability and not the `rmng` capability. It is rejected for RainMaker devices
        (including Matter-fabric-joined RainMaker devices), whose config is written only
        by the device firmware.
      tags:
        - Node Configuration
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeConfig"
            example:
              data_model: "matter"
              info:
                name: "Living Room Light"
                type: "matter"
                fw_version: "1.0"
                model: "0x010D"
              endpoints:
                "0x0":
                  dt: "0x0016"
                  c:
                    s:
                      "0x1d": {}
                      "0x28": {}
                      "0x1f": {}
                      "0x3e": {}
                "0x1":
                  dt: "0x010D"
                  c:
                    s:
                      "0x3": {}
                      "0x4": {}
                      "0x6":
                        a: ["0x0"]
                      "0x8":
                        a: ["0x0"]
                      "0x300":
                        a: ["0x7", "0x8", "0x0f"]
                      "0x1d": {}
      responses:
        "200":
          description: Config stored successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The node is not a pure Matter node, or the caller lacks access to it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "config write is only allowed for pure Matter nodes"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete node configuration (Not Allowed)
      description: |
        This operation is not allowed for the config service.
        Node configurations can only be deleted by the device itself.
      tags:
        - Node Configuration
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "500":
          description: Operation not permitted for this service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "DELETE operation not allowed for config service"

  /v1/groups/{groupId}/sharing-requests:
    post:
      summary: Send group sharing-requests
      description: |
        Creates a new sharing request for a user to join the group. The invitee
        is named by `username` — the email address or E.164 phone number they
        sign in with. The user will see this in their 'sharing-requests' inbox.
      tags:
        - Group Sharing
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSharingRequestRequest"
      responses:
        "201":
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                type: object
                required: [request_id, message]
                properties:
                  request_id:
                    type: string
                    format: uuid
                  message:
                    type: string
              example:
                request_id: 1c9b2f4e-6a3d-4c8b-9e2f-7d5a1b3c4d5e
                message:
                  Invite sent if the user is registered with ESP RainMaker Neo
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/subgroups/{subGroupId}/sharing-requests:
    post:
      summary: Send subgroup sharing-requests
      description: |
        Creates a new sharing request for a user to join the subgroup. The
        invitee is named by `username` — the email address or E.164 phone
        number they sign in with.
      tags:
        - Subgroup Sharing
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/SubGroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSharingRequestRequest"
      responses:
        "201":
          description: |
            Request accepted. The response is identical whether or not the
            username belongs to a registered user: same message, and a
            request_id that is real for a registered invitee and a decoy UUID
            otherwise, so the outcome does not reveal whether an account exists.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, message]
                properties:
                  request_id:
                    type: string
                    format: uuid
                  message:
                    type: string
              example:
                request_id: 1c9b2f4e-6a3d-4c8b-9e2f-7d5a1b3c4d5e
                message:
                  Invite sent if the user is registered with ESP RainMaker Neo
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/sharing-requests/received:
    get:
      summary: List received sharing requests
      description:
        Retrieves a list of requests where groups are asking the user to join
        (Pending Invitations). For the current user, use the 'me' alias.
      tags:
        - Sharing Requests
      security:
        - sigv4: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSharingRequestsResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # 1. ACCEPT Action
  /v1/sharing-requests/{requestId}/accept:
    post:
      summary: Accept sharing request
      description: >
        Accepts the invitation. This triggers the 'join' workflow, adds the user
        to the group, and may send notifications.
      tags:
        - Sharing Requests
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      # No complex body needed usually, unless you have metadata
      responses:
        "200":
          description: Request accepted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIStatusMessage"
              example:
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # 2. REJECT Action
  /v1/sharing-requests/{requestId}/reject:
    post:
      summary: Reject sharing request
      description: Declines the invitation and marks the request as rejected.
      tags:
        - Sharing Requests
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Request rejected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIStatusMessage"
              example:
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # INTEGRATIONS (non-admin) — apps call this to discover the integration_id
  # to register a delivery endpoint against. Unlike the admin list, this
  # returns only the public id+type per integration; no credentials.
  # ----------------------------------------------------------------------
  /v1/integrations:
    get:
      summary: List integrations (non-admin)
      description: |
        Returns the `integration_id` / `integration_type` of every configured
        integration. Any authenticated user may call this — it is the
        non-admin counterpart of `GET /v1/admin/integrations` and exposes no
        credentials or other configuration.

        Apps use the returned `integration_id` when registering a delivery
        endpoint via `PUT /v1/integrations/{integrationId}/endpoints`.
      tags:
        - Notification Endpoints
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/IntegrationTypeQueryOptional"
      responses:
        "200":
          description: Successfully retrieved integrations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPublicIntegrationsResponse"
              example:
                integrations:
                  - integration_id: "apns_com.company.app"
                    integration_type: "apns"
                  - integration_id: "apns_sandbox_com.company.app"
                    integration_type: "apns_sandbox"
                  - integration_id: "gcm_your-fcm-project-id"
                    integration_type: "gcm"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # ENDPOINTS — user-facing registration of delivery endpoints. A single user
  # can have multiple endpoints per integration (e.g. multiple GCM devices,
  # multiple linked Amazon accounts). PUT registers a new endpoint and returns
  # its server-derived endpoint_id; DELETE addresses one specific endpoint.
  # ----------------------------------------------------------------------
  # NOTE (not rendered): For Alexa and GVA integrations, endpoint
  # registration happens internally as part of the account-link OAuth flow
  # — public callers do not PUT to this endpoint for those types. Webhook
  # integrations have no public surface today; the `webhook_mock` platform
  # exercises this path in itest only (test/itest/test_notifications.py).
  /v1/integrations/{integrationId}/endpoints:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    put:
      summary: Register a delivery endpoint on this integration
      description: |
        Registers a delivery endpoint for the calling user on the given
        integration. The server derives an `endpoint_id` per integration
        type and returns it in the response.
        Callers must persist the returned `endpoint_id` to later address
        the endpoint (e.g. for DELETE).
      tags:
        - Notification Endpoints
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterEndpointRequest"
            examples:
              APNS:
                summary: APNS push registration (iOS)
                value:
                  delivery_credentials:
                    app_token: "<apns-device-token>"
                  locale: "en_US"
              GCM:
                summary: GCM push registration (Android)
                value:
                  delivery_credentials:
                    app_token: "<fcm-registration-token>"
                  locale: "en_US"
      responses:
        "200":
          description: Endpoint registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterEndpointResponse"
              example:
                status: "success"
                endpoint_id: "arn:aws:sns:us-east-1:123456789012:endpoint/APNS/RainMaker/abc-123"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/integrations/{integrationId}/endpoints/{endpointId}:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
      - in: path
        name: endpointId
        required: true
        schema:
          type: string
        description: |
          The per-endpoint identifier returned by `PUT /v1/integrations/{integrationId}/endpoints`.
    delete:
      summary: Unregister one specific endpoint
      description: |
        Removes the named endpoint for the calling user on the given
        integration and cleans up the underlying delivery registration
      tags:
        - Notification Endpoints
      security:
        - sigv4: []
      responses:
        "200":
          description: Endpoint successfully unregistered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # TIMESERIES: RAW DATA (Time-series points)
  # ----------------------------------------------------------------------
  /v1/groups/{groupId}/nodes/{nodeId}/timeseries/raw:
    get:
      summary: Retrieve raw timeseries data
      description: |
        Retrieves raw data points for a specific parameter within a time range.
      tags:
        - Node Timeseries
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
        - in: query
          name: key
          required: true
          schema:
            type: string
          description: |
            Data point key — within-node identifier. Default data model:
            `<device id>.<param id>` (e.g., `Sensor.Temperature`).
            Matter data model: the full dotted key chain
            `0x<endpoint>.c.s.0x<cluster>.a.0x<attribute>`
            (e.g., `0x1.c.s.0x402.a.0x0`).
        - in: query
          name: data_type
          required: true
          schema:
            type: string
          description: Data type (e.g., float, int).
        - in: query
          name: start_time
          required: true
          schema:
            type: integer
            format: int64
          description: Start timestamp in milliseconds.
        - in: query
          name: end_time
          required: false
          schema:
            type: integer
            format: int64
          description: End timestamp in milliseconds (defaults to now).
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartKey"
      responses:
        "200":
          description: |
            List of raw data points. If the request is made with no query
            parameters at all, a self-describing usage document
            (`TimeseriesServiceInfoResponse`) is returned instead.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TimeseriesRawDataResponse"
                  - $ref: "#/components/schemas/TimeseriesServiceInfoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # TIMESERIES: LATEST DATA (Snapshot)
  # ----------------------------------------------------------------------
  /v1/groups/{groupId}/nodes/{nodeId}/timeseries/latest:
    get:
      summary: Retrieve latest data point
      description: Retrieves the single most recent data point for a parameter.
      tags:
        - Node Timeseries
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
        - in: query
          name: key
          required: true
          schema:
            type: string
          description: Data point key.
        - in: query
          name: data_type
          required: true
          schema:
            type: string
          description: Data type (e.g., float, int).
      responses:
        "200":
          description: |
            The latest data point. If the request is made with no query
            parameters at all, a self-describing usage document
            (`TimeseriesServiceInfoResponse`) is returned instead.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TimeseriesLatestDataResponse"
                  - $ref: "#/components/schemas/TimeseriesServiceInfoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # TIMESERIES: AGGREGATES (Stats)
  # ----------------------------------------------------------------------
  /v1/groups/{groupId}/nodes/{nodeId}/timeseries/aggregates:
    get:
      summary: Retrieve aggregated data
      description: |
        Retrieves statistical aggregates (min, max, avg, sum) for a parameter.
        Supports query by specific date or date range. Range queries are
        paginated.
      tags:
        - Node Timeseries
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
        - in: query
          name: key
          required: true
          schema:
            type: string
          description: Data point key.
        - in: query
          name: data_type
          required: true
          schema:
            type: string
          description: Data type (e.g., float, int).
        - in: query
          name: window
          required: true
          schema:
            type: string
            enum: [hourly, daily, weekly, monthly]
          description: The aggregation window/bucket size.

        # Date Filters (Grouped logically)
        - in: query
          name: date
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}(T\d{2})?$'
          description: Specific date/hour to fetch (historical).
        - in: query
          name: start_date
          schema:
            type: string
          description: Range start date.
        - in: query
          name: end_date
          schema:
            type: string
          description: Range end date.
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartKey"

      responses:
        "200":
          description: |
            Aggregated statistics. Without `date`/`start_date`/`end_date` the
            live rollup for the requested `window` is returned; with `date` a
            single historical window is returned; with `start_date`/`end_date`
            a paginated historical range is returned. If the request is made
            with no query parameters at all, a self-describing usage document
            (`TimeseriesServiceInfoResponse`) is returned instead.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TimeseriesAggregatesResponse"
                  - $ref: "#/components/schemas/TimeseriesServiceInfoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/nodes/{nodeId}/schedules:
    get:
      summary: Get node schedules
      description: |
        Retrieves the schedule configuration for a node.
        Returns an empty object if no schedule is configured.
      tags:
        - Node Schedule
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSchedulesPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Create/Update node schedules
      description: |
        Creates or replaces the schedule configuration for a node.
        The schedule data should contain an array of schedules, each with triggers and actions.
        The device will be notified of the schedule update.
      tags:
        - Node Schedule
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeSchedulesPayload"
      responses:
        "200":
          description: Schedules updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete node schedules
      description: |
        Deletes the schedule configuration for a node.
        The device will be notified of the schedule deletion.
      tags:
        - Node Schedule
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Schedules deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/nodes:
    post:
      summary: Register a single node
      description: |
        Synchronously registers a single node using a provided certificate string.
        The certificate is used to create a thing in AWS IoT Core
        Returns the created node ID immediately.
      tags:
        - Node Administration
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSingleNodeRequest"
      responses:
        "201":
          description: Node successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterSingleNodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/nodes/registration-jobs:
    get:
      summary: List bulk node registration jobs
      description: |
        Lists all bulk node registration jobs, ordered by creation time
        (newest first). Paginated: server-side default page size is 20.
      tags:
        - Node Administration
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartKey"
        - in: query
          name: status
          schema:
            type: string
            enum: [requested, started, data_loaded, completed]
          description: Filter jobs by status
      responses:
        "200":
          description: List of registration jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRegistrationJobsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Bulk register nodes via S3
      description: |
        Initiates an asynchronous job to register multiple nodes from a CSV file stored in S3.
        Returns a job ID to track the registration progress.
      tags:
        - Node Administration
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBulkNodesRequest"
      responses:
        "202": # 202 Accepted indicates the request is valid and queued for processing
          description: Bulk registration job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterBulkNodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/nodes/registration-jobs/{requestId}:
    get:
      summary: Get bulk node registration status
      description: |
        Retrieves the status of a bulk node registration request by request ID.
        Returns the current status, counts, and metadata for the request.
      tags:
        - Node Administration
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterNodeStatusResponse"
        "404":
          description: |
            Registration job not found. Returned when the request_id
            does not exist OR when it belongs to an update job
            (cross-flow scoping: an update job_id queried on this path
            looks like a 404 rather than leaking the update row).
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/nodes/registration-jobs/{requestId}/failed-nodes:
    get:
      summary: List per-node failures for a registration job
      description: |
        Paginated list of per-node failure detail (node_id, code, reason,
        recorded_at) for the given registration job. Use this when the
        job's aggregate `failed_count` is non-zero and you need to know
        which nodes failed and why.

        Returns 200 with `failed_nodes: []` when the job exists but has
        zero failures; returns 404 when the job doesn't exist or belongs
        to a different flow.

        Failures are written in a single batch at end-of-job, so polling
        this endpoint mid-run returns an empty list. The accompanying
        job status's `status=completed` indicates the failure detail is
        final.
      tags:
        - Node Administration
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartKey"
      responses:
        "200":
          description: Page of failed-node rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFailedNodesResponse"
        "404":
          description: Registration job not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/nodes/update-jobs:
    post:
      summary: Bulk update nodes via S3
      description: |
        Initiates an asynchronous job to update already-registered nodes
        from a CSV file stored in S3. Use this for two related operations
        on existing nodes:

        - Metadata updates (admin groups, tags, plus any extra CSV
          columns treated as `key:value` tags via the registration
          convention).
        - Cert update: when a CSV row has a non-empty `certs` column the
          node's cloud-side cert is replaced (register new, attach,
          deactivate the old). This is operator correction for a
          mistakenly-registered PEM — it does not push the new cert to
          the device.

        Symmetric with `POST .../registration-jobs`: returns
        `202 Accepted` with a `request_id`, kicks off the shared Fargate
        task, status visible via `GET .../update-jobs/{requestId}` and
        `GET .../update-jobs/{requestId}/failed-nodes`.
      tags:
        - Node Administration
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateNodesRequest"
      responses:
        "202":
          description: Bulk update job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateNodesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/nodes/update-jobs/{requestId}:
    get:
      summary: Get bulk node update status
      description: |
        Retrieves the status of a bulk node update request by request ID.
        Same response shape as the registration-jobs status endpoint —
        the `job_type` field discriminates.
      tags:
        - Node Administration
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterNodeStatusResponse"
        "404":
          description: |
            Update job not found. Returned when the request_id does not
            exist OR when it belongs to a registration job (cross-flow
            scoping mirror of the registration-jobs endpoint).
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/nodes/update-jobs/{requestId}/failed-nodes:
    get:
      summary: List per-node failures for an update job
      description: |
        Paginated list of per-node failure detail for the given update
        job. Same shape and semantics as the registration-jobs
        equivalent.
      tags:
        - Node Administration
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/PageSize"
