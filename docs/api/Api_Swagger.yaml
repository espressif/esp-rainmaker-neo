      responses:
        "200":
          description: Integration deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/iot-event-mode:
    get:
      summary: Get the current IoT-rule action mode for event-handler lambdas
      description: |
        Returns the action currently attached to `node_disconnected_rule` and
        `node_to_cloud_rule` — either `direct` (IoT rule invokes the lambda
        directly) or `sqs` (IoT rule writes to an SQS queue that the lambda
        consumes in batches).
        Both modes are pre-provisioned at deploy time; this endpoint reports
        which one is currently active. Only super admin users can access this
        endpoint.
      tags:
        - Node Administration
      security:
        - sigv4: []
      responses:
        "200":
          description: Current IoT-rule action mode for both rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IotEventModeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Flip the IoT-rule action mode for event-handler lambdas
      description: |
        Replaces the action on `node_disconnected_rule` and `node_to_cloud_rule`
        with either the Lambda-direct action or the SQS action. Both rules
        flip together in one call.
        The change takes effect immediately and does not require a redeploy.
        SQL, SQL version, description, disabled flag, and error_action on
        each rule are preserved across the flip.
        Only super admin users can access this endpoint.
      tags:
        - Node Administration
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IotEventModeRequest"
      responses:
        "200":
          description: Post-flip IoT-rule action mode for both rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IotEventModeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/claiming/config:
    post:
      x-feature-flag: assisted-claiming
      summary: Set the assisted-claiming configuration
      description: |
        Stores the claiming configuration - the claiming `mode`, the per-claimant
        quota, the shared X.509 subject, and the CA/leaf validities. This is the
        whole feature's runtime configuration; it is set here rather than at
        deploy time. Every field is optional; omitted fields fall back to
        built-in defaults, and an omitted `mode` leaves claiming off. The `mode`
        and quota take effect on subsequent claims immediately; the subject and
        leaf validity take effect on subsequent certificates; the CA fields apply
        only at the next mint (`POST /v1/admin/claiming/ca`).

        Available only on deployments with assisted claiming enabled. Only super
        admin users can access this endpoint.
      tags:
        - Assisted Claiming
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimConfig"
      responses:
        "200":
          description: Configuration stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      x-feature-flag: assisted-claiming
      summary: Read the assisted-claiming configuration
      description: |
        Returns the stored claiming configuration and whether the CA has been
        minted. Only super admin users can access this endpoint.
      tags:
        - Assisted Claiming
      security:
        - sigv4: []
      responses:
        "200":
          description: Current configuration and CA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/claiming/ca:
    post:
      x-feature-flag: assisted-claiming
      summary: Mint or rotate the assisted-claiming CA
      description: |
        Signs and publishes the claiming CA with the KMS signing key, using the
        stored configuration (or defaults). Mint-once: the first call mints and
        a repeat reports the existing CA unchanged with `200`. Pass
        `{"force": true}` to rotate - replacing the published CA, which leaves
        every certificate already issued by the previous CA unverifiable against
        it. There is no delete.

        This is the step that turns claiming on after the claim stacks are
        deployed. Only super admin users can access this endpoint.
      tags:
        - Assisted Claiming
      security:
        - sigv4: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimCaMintRequest"
      responses:
        "200":
          description: CA already present (unchanged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCaResponse"
        "201":
          description: CA minted or rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      x-feature-flag: assisted-claiming
      summary: Return the published assisted-claiming CA certificate
      description: |
        Returns the CA certificate PEM once minted. Only super admin users can
        access this endpoint.
      tags:
        - Assisted Claiming
      security:
        - sigv4: []
      responses:
        "200":
          description: The CA certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCaResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The CA has not been minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/files/upload-urls:
    post:
      summary: Create upload URL
      description: |
        Gets a pre-signed URL for uploading a file to S3. Currently supports: node certificate uploads, push text message configuration uploads.
      tags:
        - File Management
      security:
        - sigv4: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_type:
                  type: string
                  enum: [node_cert, push_text_config]
                  description: Type of file to upload.
                file_name:
                  type: string
                  description: Optional custom file name.
              required:
                - file_type
      responses:
        "201":
          description: Upload session created (URL generated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFileUploadUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/integrations/gva:
    post:
      summary: Google Voice Assistant webhook
      description: |
        Handles Google Assistant Smart Home API requests. Processes device synchronization,
        state queries, command execution, and disconnection intents. Requires OAuth access
        token in Authorization header for user authentication.
      tags:
        - Google Voice Assistant
      # authorization_type is NONE (src/user/gva_action/core.py); the Lambda
      # validates the access token itself.
      security:
        - gvaAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GVARequest"
            examples:
              sync:
                value:
                  requestId: "ff36a3cc-ec34-11e6-b1a0-64510650abcf"
                  inputs:
                    - intent: "action.devices.SYNC"
              query:
                value:
                  requestId: "ff36a3cc-ec34-11e6-b1a0-64510650abcf"
                  inputs:
                    - intent: "action.devices.QUERY"
                      payload:
                        devices:
                          - id: "123"
                            customData:
                              nodeId: "node123"
                              groupId: "group456"
              execute:
                value:
                  requestId: "ff36a3cc-ec34-11e6-b1a0-64510650abcf"
                  inputs:
                    - intent: "action.devices.EXECUTE"
                      payload:
                        commands:
                          - devices:
                              - id: "123"
                                customData:
                                  nodeId: "node123"
                                  groupId: "group456"
                            execution:
                              - command: "action.devices.commands.OnOff"
                                params:
                                  on: true
      responses:
        "200":
          description: Successful GVA response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GVAResponse"
              examples:
                sync:
                  value:
                    requestId: "ff36a3cc-ec34-11e6-b1a0-64510650abcf"
                    payload:
                      agentUserId: "user123"
                      devices:
                        - id: "123"
                          type: "action.devices.types.LIGHT"
                          traits:
                            - "action.devices.traits.OnOff"
                          name:
                            name: "Living Room Light"
                          willReportState: true
                query:
                  value:
                    requestId: "ff36a3cc-ec34-11e6-b1a0-64510650abcf"
                    payload:
                      devices:
                        "123":
                          on: true
                          online: true
                execute:
                  value:
                    requestId: "ff36a3cc-ec34-11e6-b1a0-64510650abcf"
                    payload:
                      commands:
                        - ids:
                            - "123"
                          status: "SUCCESS"
                          states:
                            on: true
        "400":
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "invalid request format"
        "401":
          description: Unauthorized - Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "internal server error"

  # ----------------------------------------------------------------------
  # FILE TEMPLATES (Formats/Schemas)
  # ----------------------------------------------------------------------
  /v1/admin/file-templates/{templateType}:
    get:
      summary: Get file template
      description: |
        Gets the format of a file. Currently only supports push text configuration file format. Returns the default structure/template for the specified file type.
      tags:
        - File Management
      security:
        - sigv4: []
      parameters:
        - in: path
          name: templateType
          required: true
          schema:
            type: string
            enum: [push_text_config]
          description: The ID/Type of the template to retrieve.
      responses:
        "200":
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTextConfig"
        "404":
          description: Template type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ----------------------------------------------------------------------
  # NODE TAGS (User)
  # ----------------------------------------------------------------------
  /v1/groups/{groupId}/nodes/{nodeId}/tags:
    get:
      summary: Get user tags for a node
      description: |
        Returns the user-defined tags for a specific node within the caller's group.
        The caller must have access to the specified group.
      tags:
        - Node Tags
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: User tags retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    additionalProperties: true
                    description: User-defined tags as key-value pairs
              example:
                user:
                  location: "living room"
                  alias: "main light"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update user tags for a node
      description: |
        Creates or updates user-defined tags for a specific node.
        The caller must have access to the specified group.
        Set a tag value to null to delete it.
      tags:
        - Node Tags
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user
              properties:
                user:
                  type: object
                  additionalProperties: true
                  description:
                    User tags to set. Values can be strings or null (to delete).
            example:
              user:
                location: "living room"
                old_tag: null
      responses:
        "200":
          description: Tags updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # NODE TRIGGER
  # ----------------------------------------------------------------------
  /v1/groups/{groupId}/nodes/{nodeId}/triggers:
    get:
      summary: Get node triggers
      description: |
        Retrieves the trigger configuration for a node. Triggers are node-side
        conditions that can feed automations (referenced by IDs of the form
        `<nodeID>~<automationID>~<triggerIndex>`).
        Returns `{"triggers": []}` when no triggers are configured.
      tags:
        - Node Trigger
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeTriggerPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Create/Update node triggers
      description: |
        Creates or replaces the trigger configuration for the node. The payload
        must contain a `triggers` array; every entry must have a unique string `id`.
        Writing triggers also bumps the node's trigger version and notifies the
        device over MQTT.
      tags:
        - Node Trigger
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeTriggerPayload"
      responses:
        "200":
          description: Triggers updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete node triggers
      description: |
        Removes the trigger configuration from the node and notifies the device.
      tags:
        - Node Trigger
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Triggers deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # GROUP SERVICES — GENERIC DISPATCH
  # ----------------------------------------------------------------------
  # The group service endpoint is a generic dispatcher keyed by {serviceName}.
  # Currently the only registered group service is "automation", documented
  # separately below. Any new group service registered in the service
  # registry is automatically exposed under the same path.

  # ----------------------------------------------------------------------
  # GROUP AUTOMATIONS
  # ----------------------------------------------------------------------
  /v1/groups/{groupId}/service/automations:
    get:
      summary: List automations for a group
      description: |
        Returns every automation configured for the group.
      tags:
        - Group Automation
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAutomationsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a new automation
      description: |
        Creates a new automation in the group. The server generates a
        3-character automation ID (first character alphabetic) and returns it.
      tags:
        - Group Automation
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationPayload"
      responses:
        "200":
          description: Automation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationWriteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete all automations for a group
      description: |
        Removes every automation belonging to the group in a single call.
      tags:
        - Group Automation
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: All automations deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/groups/{groupId}/service/automations/{automationId}:
    get:
      summary: Get an automation by ID
      description: Retrieves a single automation belonging to the group.
      tags:
        - Group Automation
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/AutomationId"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Automation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update an automation by ID
      description: |
        Updates an existing automation at the given ID, replacing it with the
        supplied definition.
      tags:
        - Group Automation
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/AutomationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationPayload"
      responses:
        "200":
          description: Automation saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete an automation by ID
      description: Removes a single automation from the group.
      tags:
        - Group Automation
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/AutomationId"
      responses:
        "200":
          description: Automation deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Automation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # NODE TAGS (Admin)
  # ----------------------------------------------------------------------
  /v1/admin/nodes/{nodeId}/tags:
    get:
      summary: Get all tags for a node (admin)
      description: |
        Returns all tags (admin, device, and user) for a specific node.
        Only super admin users can access this endpoint.
      tags:
        - Node Tags
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: All tags retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin:
                    type: object
                    additionalProperties: true
                    description: Admin-defined tags
                  device:
                    type: object
                    additionalProperties: true
                    description: Device-reported tags (read-only)
                  user:
                    type: object
                    additionalProperties: true
                    description: User-defined tags
              example:
                admin:
                  deployment: "beta"
                device:
                  fw_version: "1.2.3"
                user:
                  location: "living room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update admin and/or user tags for a node (admin)
      description: |
        Creates or updates admin and/or user tags for a specific node.
        Only super admin users can access this endpoint.
        Admin can write both admin and user tags. Set a tag value to null to delete it.
      tags:
        - Node Tags
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/NodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin:
                  type: object
                  additionalProperties: true
                  description:
                    Admin tags to set. Values can be strings or null (to
                    delete).
                user:
                  type: object
                  additionalProperties: true
                  description:
                    User tags to set. Values can be strings or null (to delete).
            example:
              admin:
                deployment: "beta"
                old_flag: null
              user:
                location: "kitchen"
      responses:
        "200":
          description: Tags updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    IntegrationTypeQuery:
      in: query
      name: integration_type
      required: true
      schema:
        type: string
        enum: [apns, apns_sandbox, gcm, alexa, gva]
      description: |
        Integration type for `POST /v1/admin/integrations`.

    IntegrationTypeQueryOptional:
      in: query
      name: integration_type
      required: false
      schema:
        type: string
        enum: [apns, apns_sandbox, gcm, alexa, gva, webhook]
      description: |
        Optional integration type filter. If omitted, all configured
        integrations across all types are returned.

    IntegrationId:
      in: path
      name: integrationId
      required: true
      schema:
        type: string
      description: |
        Opaque server-assigned identifier for one configured integration.
        Returned by `POST /v1/admin/integrations`.

    GroupId:
      in: path
      name: groupId
      required: true
      schema:
        type: string
      description: The unique identifier of the group.

    SubGroupId:
      in: path
      name: subGroupId
      required: true
      schema:
        type: string
      description: The unique identifier of the subgroup.

    AccessTypeQueryOptional:
      in: query
      name: accessType
      required: false
      schema:
        type: string
        enum: [all, primary]
      description: |
        Scopes the subgroup user listing. `all` returns the full membership
        (primary access only); `primary` returns just the group's primary
        owners (available to any subgroup member). If omitted, defaults
        based on the caller's own access level. Case-insensitive.

    NodeId:
      in: path
      name: nodeId
      required: true
      schema:
        type: string
      description: The unique identifier of the node.

    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
      description: |
        The unique identifier of the user, as returned by
        `GET /v1/groups/{groupId}/users`. User names (email / phone) are not
        accepted in the path — they are the share-side identifier only, and
        keeping them out of URLs keeps them out of access and CDN logs.

    RequestId:
      in: path
      name: requestId
      required: true
      schema:
        type: string
      description: The unique identifier of the request.

    AutomationId:
      in: path
      name: automationId
      required: true
      schema:
        type: string
      description: |
        The unique identifier of the automation within the group.
        Server-generated IDs are 3 characters long; the first character is
        alphabetic and the remaining characters are lowercase alphanumeric.

    PageSize:
      in: query
      name: page_size
      schema:
        type: integer
        minimum: 1
        default: 20
      description: |
        Maximum number of items to return in a single page. When omitted
        or invalid, the server applies an endpoint-specific default.

    StartKey:
      in: query
      name: start_key
      schema:
        type: string
      description: |
        Pagination cursor. Pass the `next_key` value from a previous
        response to fetch the next page. Omit on the first request.

  schemas:
    AssumeRoleRequest:
      type: object
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
          description: Tags to be associated with the assumed role session

    AssumeRolePerNodeRequest:
      type: object
      required:
        - services
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
          description: Tags to be associated with the assumed role session
        services:
          type: array
          minItems: 1
          items:
            type: string
            enum: [s3, kvs]
          description: |
            Services to scope the returned credentials to, for the single node in the path.
            - "s3": S3 permissions scoped to node-data/{nodeId}/* for that node.
            - "kvs": KVS viewer permissions scoped to channel/rmng-v1-{nodeId}/* for that node.
            The response contains ONLY the listed service permissions — no IoT/MQTT statements.

    AssumeRoleResponse:
      type: object
      required:
        - access_key
        - secret_key
        - session_token
      properties:
        access_key:
          type: string
          description: New AWS access key ID
        secret_key:
          type: string
          description: New AWS secret access key
        session_token:
          type: string
          description: New AWS session token
        expiration:
          type: integer
          format: int64
          nullable: true
          description: Expiration time of the credentials as Unix timestamp
        message:
          type: string

    UserCredsResponse:
      type: object
      properties:
        access_key_id:
          type: string
          description: AWS access key ID
        secret_access_key:
          type: string
          description: AWS secret access key
        session_token:
          type: string
          description: AWS session token
        expiration:
          type: integer
          format: int64
          description: Credential expiration time as Unix timestamp
        message:
          type: string

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    APIStatusMessage:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Error:
      type: object
      description: |
        Standard API error response.
      properties:
        message:
          type: string
          description: Human-readable error description.
      required:
        - message
      example:
        message: "Invalid request ID"

    ClaimInitiateRequest:
      type: object
      required:
        - mac_addr
      properties:
        mac_addr:
          type: string
          description: |
            Device MAC address. Separators (`:`, `-`, `.`) are stripped and the
            value upper-cased; the normalized result must be 12 or 16
            hexadecimal characters.
          example: "AA:BB:CC:DD:EE:FF"

    ClaimInitiateResponse:
      type: object
      properties:
        node_id:
          type: string
          description: |
            Cloud-assigned node ID - a canonical RFC 4122 version-4 UUID
            (hyphenated lowercase), and also the IoT Thing name, MQTT client ID,
            and certificate Common Name. The device must adopt this before
            installing its certificate. If the node later joins a Matter fabric,
            its Matter operational Node ID is derived from this value; the node ID
            is not itself a Matter Node ID.
          example: "1b4e28ba-2fa1-4d3b-a3f5-ce6f8a9b0c2d"

    ClaimVerifyRequest:
      type: object
      required:
        - mac_addr
        - csr
      properties:
        mac_addr:
          type: string
          description: Device MAC address, normalized as for the initiate call.
          example: "AA:BB:CC:DD:EE:FF"
        csr:
          type: string
          description: |
            PEM-encoded PKCS#10 certificate signing request. Must be ECDSA
            P-256, at most 8 KB, and carry a valid self-signature. Only its
            public key is used; the subject is discarded.
          example:
            "-----BEGIN CERTIFICATE REQUEST-----\n...\n-----END CERTIFICATE
            REQUEST-----"
        capabilities:
          type: array
          items:
            type: string
          description: |
            Optional capabilities to apply to the issued certificate's policy
            (e.g. ["s3"]). Must be re-supplied on a re-claim, since they are
            applied to the new certificate.
          example: ["s3"]

    ClaimVerifyResponse:
      type: object
      properties:
        node_id:
          type: string
          description: The reserved node ID the certificate was issued for.
          example: "1b4e28ba-2fa1-4d3b-a3f5-ce6f8a9b0c2d"
        certificate:
          type: string
          description: PEM-encoded device certificate signed by the claiming CA.
        ca_certificate:
          type: string
          description: PEM-encoded claiming CA certificate - the chain to trust.

    ClaimSubject:
      type: object
      description: |
        Shared X.509 subject applied to the CA and every leaf certificate. All
        fields optional; the leaf Common Name is always the node ID and is never
        taken from here.
      properties:
        country:
          type: string
          description: Country (C) - a two-letter ISO 3166 code.
          example: "IN"
        state:
          type: string
          description: State or Province (ST).
          example: "Maharashtra"
        locality:
          type: string
          description: Locality (L).
          example: "Pune"
        organization:
          type: string
          description: Organization (O).
          example: "Espressif Systems"
        organizational_unit:
          type: string
          description: Organizational Unit (OU).
          example: "RainMaker"
        email:
          type: string
          description: emailAddress RDN.
          example: "rainmaker@espressif.com"

    ClaimConfig:
      type: object
      description: |
        Assisted-claiming configuration. This single document is the whole
        feature's runtime configuration — the claiming variant, the per-claimant
        quota, and the certificate identity/validity. Every field is optional; an
        omitted field uses its built-in default, and an omitted `mode` leaves
        claiming configured off (the claim routes fail closed).
      properties:
        mode:
          type: string
          description: |
            Claiming variant. Empty/omitted means claiming is configured off.
            Must be an implemented variant when set.
          enum:
            - user_authenticated
          example: "user_authenticated"
        max_nodes_per_claimant:
          type: integer
          description: |
            Per-caller lifetime node reservation quota for the user_authenticated
            variant. 0 (or omitted) uses the built-in default (20). Must not be
            negative.
          example: 20
        subject:
          $ref: "#/components/schemas/ClaimSubject"
        ca_common_name:
          type: string
          description: |
            CA certificate Common Name. Default: derived from the signing key's
            account and region.
          example: "Espressif RainMaker Claiming CA"
        ca_validity_years:
          type: integer
          description: "CA lifetime in years. Default: leaf validity + 20."
          example: 30
        leaf_validity_years:
          type: integer
          description:
            "Device (leaf) certificate lifetime in years. Default: 100."
          example: 10

    ClaimConfigResponse:
      type: object
      properties:
        config:
          $ref: "#/components/schemas/ClaimConfig"
        ca_minted:
          type: boolean
          description: Whether the CA certificate has been minted yet.

    ClaimCaMintRequest:
      type: object
      properties:
        force:
          type: boolean
          description: |
            Rotate an existing CA by overwriting it. Omitted/false is mint-once
            (an existing CA is left unchanged). Rotation leaves certificates
            issued by the previous CA unverifiable against the published one.
          example: false

    ClaimCaResponse:
      type: object
      properties:
        minted:
          type: boolean
          description: True when this call minted (or rotated) the CA.
        common_name:
          type: string
          description: The CA certificate Common Name.
          example: "Espressif RainMaker Claiming CA"
        ca_certificate:
          type: string
          description: PEM-encoded claiming CA certificate.

    CreateGroupRequest:
      type: object
      properties:
        group_name:
          type: string
          description: The name of the group to create
        capabilities:
          type: array
          items:
            type: string
            enum: [matter]
          description:
            Optional list of capabilities to enable for this group (e.g.,
            ["matter"])

    CreateGroupResponse:
      type: object
      properties:
        group_id:
          type: string
          description: The unique identifier for the created group
        matter:
          $ref: "#/components/schemas/MatterCapabilityResponse"
        message:
          type: string

    AddGroupCapabilitiesRequest:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          description: Capabilities to enable on the group (e.g. ["matter"])
          minItems: 1
          items:
            type: string
          example: ["matter"]

    AddGroupCapabilitiesResponse:
      type: object
      properties:
        matter:
          $ref: "#/components/schemas/MatterCapabilityResponse"

