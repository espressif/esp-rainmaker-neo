          description: Current action mode of `node_disconnected_rule`.
        publish_input:
          type: string
          enum: [direct, sqs]
          description: Current action mode of `node_to_cloud_rule`.

    UpdateAppPlatformRequest:
      type: object
      properties:
        authentication_key:
          type: string
          description:
            APNS token-based authentication key (.p8 key content) - required for
            APNS
        key_id:
          type: string
          description:
            APNS signing key ID from Apple Developer account - required for APNS
        team_id:
          type: string
          description:
            APNS team ID from Apple Developer account - required for APNS
        bundle_id:
          type: string
          description: APNS bundle identifier - required for APNS
        api_key:
          type: string
          description: GCM API key (JSON service account) - required for GCM

    AppPlatformInfo:
      type: object
      properties:
        platform:
          type: string
          description: The platform type (APNS, APNS_SANDBOX, GCM, etc.)
        platform_app_name:
          type: string
          description: The application name for this platform
        message:
          type: string
      example:
        platform: "APNS"
        platform_app_name: "RainMaker"

    RegisterNodeStatusResponse:
      type: object
      properties:
        request_id:
          type: string
          description: The request ID of the bulk node registration job
        user_id:
          type: string
          description: The user who initiated the request
        job_type:
          type: string
          enum: [register, update]
          description: |
            Which bulk-job flow this row belongs to. Rows created before
