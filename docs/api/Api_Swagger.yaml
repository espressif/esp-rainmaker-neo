                  authentication_key:
                    "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
                  key_id: "<10 char Apple Key ID>"
                  team_id: "<10 char Apple Team ID>"
                  bundle_id: "com.company.app"
              GCM:
                summary: Rotate GCM service account
                description: |
                  Provide a new service-account JSON. `project_id` must
                  match the existing integration — otherwise the request
                  is rejected. Same shape as the POST body.
