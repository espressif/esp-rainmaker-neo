        total_nodes:
          type: integer
          description: Total number of nodes in the request
        success_count:
          type: integer
          description: Number of nodes successfully registered
        failed_count:
          type: integer
          description: Number of nodes that failed to register
        created_at:
          type: integer
          description: Request Creation timestamp (epoch seconds)
        last_updated_at:
          type: integer
          description: Last updated timestamp (epoch seconds)
        status:
          type: string
          description:
            Current status of the request (requested, started, completed)
        message:
          type: string
          description: Status or error message
        admin_group_names:
          type: array
          items:
            type: string
          description: Admin group names assigned by the job
        admin_parent_group_name:
          type: string
          description: Parent group name for admin groups
        tags:
          type: array
          items:
            type: string
          description: Tags applied by the job (key:value format)
        cert_file_s3_path:
          type: string
          description:
            S3 path to the certificate CSV file used for bulk registration
        failed_file_s3_path:
          type: string
          description: |
            S3 path of the re-uploadable, cert-bearing CSV of failed rows,
            written by the job at completion. Present only when the job
            finished with at least one failure (and the S3 write succeeded).
            This key is itself a valid `cert_file_s3_path` for a retry job.
        failed_file_download_url:
          type: string
          description: |
            Short-lived presigned GET URL for `failed_file_s3_path`,
            regenerated on every status call. Fetch the CSV directly from
            S3 with this URL (bypasses the API response payload limit).
            Present only when `failed_file_s3_path` is set.

    ListRegistrationJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/RegisterNodeStatusResponse"
          description: List of registration jobs
        page_total:
          type: integer
          description: Number of jobs in the current page
        next_key:
          type: string
          description:
            Pagination token for the next page of results (absent if no more
            pages)
        message:
          type: string
      example:
        jobs:
          - request_id: "abc123"
            status: "completed"
            total_nodes: 50
            success_count: 50
            failed_count: 0
            created_at: 1704067200
            last_updated_at: 1704067260
        page_total: 1
        next_key: "eyJyZXF1ZXN0X2lkIjp7InZhbHVlIjoiYWJjMTIzIiwidHlwZSI6IlMifSwiZ3NpX3BrIjp7InZhbHVlIjoiQUxMIiwidHlwZSI6IlMifSwiY3JlYXRlZF9hdCI6eyJ2YWx1ZSI6IjE3MDQwNjcyMDAiLCJ0eXBlIjoiTiJ9fQ"

    TimeseriesServiceInfoResponse:
      type: object
      properties:
        service:
          type: string
          enum: [timeseries]
          description: Service name
        parameters:
          type: object
          additionalProperties: true
          description: Description of available query parameters
        raw_data:
          type: object
          additionalProperties: true
          description: Parameters specific to raw data queries
        aggregates:
          type: object
          additionalProperties: true
          description: Parameters specific to aggregates queries
        examples:
          type: object
          additionalProperties: true
          description: Example API calls for different query types
        message:
          type: string
      example:
        service: "timeseries"
        parameters:
          key:
            "Data point key (required) — e.g. `Sensor.Temperature` or
            `0x1.c.s.0x402.a.0x0`"
          data_type: "Data type (required)"
          type: "Data type: raw (default), latest, aggregates"

    TimeseriesRawDataResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TimeseriesDataPoint"
          description: Array of raw timeseries data points
        page_total:
          type: integer
          description: Number of items in the current page
        next_key:
          type: string
          description:
            Pagination token for the next page of results (absent if no more
            pages)
        message:
          type: string
      example:
        data:
          - key: "temperature"
            dt: "float"
            ts: 1640995200000
            value: 23.5
            tz: "UTC"
            cumulative: false
        page_total: 1
        next_key: "eyJub2RlX3BhcmFtX2R0Ijp7InZhbHVlIjoiYWJjLnRlbXBlcmF0dXJlLmZsb2F0IiwidHlwZSI6IlMifSwidHMiOnsidmFsdWUiOiIxNjQwOTk1MjAwMDAwIiwidHlwZSI6Ik4ifX0"

    TimeseriesLatestDataResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/TimeseriesDataPoint"
          description: The single latest data point object
        message:
          type: string
      required:
        - data
      example:
        data:
          key: "temperature"
          dt: "float"
          ts: 1640995200000
          value: 23.5
          tz: "UTC"
          cumulative: false

    TimeseriesAggregatesResponse:
      type: object
      properties:
        aggregates:
          type: array
          items:
            $ref: "#/components/schemas/TimeseriesAggregateData"
          description: Array of aggregated timeseries data
        page_total:
          type: integer
          description: Number of items in the current page (range queries only)
        next_key:
          type: string
          description:
            Pagination token for the next page of results (absent if no more
            pages)
        query_info:
          type: object
          properties:
            parameter:
              type: string
              description: Full parameter identifier
            window_type:
              type: string
              description: Window type used for aggregation
            start_date:
              type: string
              description: Start date for range queries
            end_date:
              type: string
              description: End date for range queries
            message:
              type: string
              description: Informational message if no data available
          description: Query information and metadata
        message:
          type: string
      example:
        aggregates:
          - parameter: "node123.temperature.float"
            is_cumulative: false
            windows:
              hourly:
                count: 24
                sum: 564.0
                min: 20.5
                max: 26.8
                average: 23.5
        page_total: 1
        next_key: "eyJub2RlX3BhcmFtX2R0Ijp7InZhbHVlIjoibm9kZTEyMy50ZW1wZXJhdHVyZS5mbG9hdCIsInR5cGUiOiJTIn0sImludGVydmFsX2tleSI6eyJ2YWx1ZSI6ImRhaWx5IzIwMjUtMDEtMTUiLCJ0eXBlIjoiUyJ9fQ"

    TimeseriesDataPoint:
      type: object
      properties:
        key:
          type: string
          description: Parameter key
          example: "temperature"
        dt:
          type: string
          description: Data type
          example: "float"
        ts:
          type: integer
          format: int64
          description: Timestamp in milliseconds
          example: 1640995200000
        value:
          oneOf:
            - type: number
            - type: integer
            - type: boolean
            - type: string
          description: Parameter value (type depends on data_type)
          example: 23.5
        tz:
          type: string
          description:
            Timezone identifier (IANA name, e.g. "UTC", "Asia/Kolkata")
          example: "UTC"
        cumulative:
          type: boolean
          description: Whether this parameter is cumulative
          example: false
        message:
          type: string
      required:
        - key
        - dt
        - ts
        - value
        - cumulative

    TimeseriesAggregateData:
      type: object
      properties:
        parameter:
          type: string
          description: Full parameter identifier (nodeId.paramName.dataType)
          example: "node123.temperature.float"
        is_cumulative:
          type: boolean
          description: Whether this parameter is cumulative
          example: false
        windows:
          type: object
          description:
            Aggregated data for different time windows (for current aggregates)
          properties:
            hourly:
              $ref: "#/components/schemas/TimeseriesWindowAggregates"
            daily:
              $ref: "#/components/schemas/TimeseriesWindowAggregates"
            weekly:
              $ref: "#/components/schemas/TimeseriesWindowAggregates"
            monthly:
              $ref: "#/components/schemas/TimeseriesWindowAggregates"
          additionalProperties: false
        window_type:
          type: string
          enum: [hourly, daily, weekly, monthly]
          description: Window type for historical aggregates
          example: "daily"
        date:
          type: string
          description: Date for historical aggregates
          example: "2024-01-15"
        count:
          type: integer
          description: Number of data points in the aggregate
          example: 24
        sum:
          type: number
          description: Sum of all values
          example: 564.0
        min:
          type: number
          description: Minimum value
          example: 20.5
        max:
          type: number
          description: Maximum value
          example: 26.8
        average:
          type: number
          description: Average value
          example: 23.5
        first_value:
          oneOf:
            - type: number
            - type: integer
            - type: boolean
            - type: string
          description: First value in the time window
          example: 22.0
        last_value:
          oneOf:
            - type: number
            - type: integer
            - type: boolean
            - type: string
          description: Last value in the time window
          example: 24.0
        cumulative_value:
          type: number
          description: Cumulative value (for cumulative parameters)
          example: 564.0
        window_start:
          type: string
          format: date-time
          description: Start time of the aggregation window
          example: "2024-01-15T00:00:00Z"
        window_end:
          type: string
          format: date-time
          description: End time of the aggregation window
          example: "2024-01-16T00:00:00Z"
        status:
          type: string
          enum: [completed, processing, error]
          description: Status of the aggregation
          example: "completed"
        message:
          type: string
          description: Message when no data is available
          example: "No historical data available for this window"

    TimeseriesWindowAggregates:
      type: object
      properties:
        count:
          type: integer
          description: Number of data points
          example: 24
        sum:
          type: number
          description: Sum of all values
          example: 564.0
        min:
          type: number
          description: Minimum value
          example: 20.5
        max:
          type: number
          description: Maximum value
          example: 26.8
        average:
          type: number
          description: Average value
          example: 23.5
        first_value:
          oneOf:
            - type: number
            - type: integer
            - type: boolean
            - type: string
          description: First value in the time window
          example: 22.0
        last_value:
          oneOf:
            - type: number
            - type: integer
            - type: boolean
            - type: string
          description: Last value in the time window
          example: 24.0
        cumulative_value:
          type: number
          description: Cumulative value (for cumulative parameters)
          example: 564.0
        window_start:
          type: integer
          format: int64
          description: Start timestamp of the window
          example: 1640995200
        window_end:
          type: integer
          format: int64
          description: End timestamp of the window
          example: 1641081600
        status:
          type: string
          enum: [completed, processing, error]
          description: Status of the aggregation
          example: "completed"
        message:
          type: string

    # --- Single Node Schemas ---
    RegisterSingleNodeRequest:
      type: object
      required: [cert]
      properties:
        cert:
          type: string
          description: The PEM-encoded certificate for the node.
        checksum:
          type: string
          pattern: "^[a-fA-F0-9]{32}$"
          description: MD5 checksum of the certificate.
        ca_cert:
          type: string
          description: The PEM-encoded CA certificate (optional).
        ca_checksum:
          type: string
          pattern: "^[a-fA-F0-9]{32}$"
          description: MD5 checksum of `ca_cert` (optional).
        admin_group_names:
          type: array
          items:
            type: string
          description: List of group names to add the node to.
        admin_parent_group_name:
          type: string
          description:
            Name of the parent group under which admin groups should be created.
        tags:
          type: array
          items:
            type: string
          description: List of tags to associate with the node.
        capabilities:
          type: array
          items:
            type: string
            enum: [s3, kvs]
          description: |
            Optional list of device capabilities to enable during registration.
            - "s3": Attaches DeviceFilePolicy for S3 file access via IoT Credential Provider.
            - "kvs": Attaches DeviceVideoPolicy for KVS streaming via IoT Credential Provider.
            If omitted, only the DefaultThingPolicy (MQTT/shadow) is attached.

    RegisterSingleNodeResponse:
      type: object
      required:
        - node_id
      properties:
        node_id:
          type: string
          description: The ID of the newly created node.
        message:
          type: string

    # --- Bulk Node Schemas ---
    RegisterBulkNodesRequest:
      type: object
      required: [cert_file_s3_path]
      properties:
        cert_file_s3_path:
          type: string
          description: S3 path to the CSV file (must start with 's3://').
        admin_group_names:
          type: array
          items:
            type: string
          description: List of group names to add ALL nodes to.
        admin_parent_group_name:
          type: string
          description:
            Name of the parent group under which admin groups should be created.
        tags:
          type: array
          items:
            type: string
          description: List of tags to associate with ALL nodes.
        capabilities:
          type: array
          items:
            type: string
            enum: [s3, kvs]
          description: |
            Optional list of device capabilities to enable for ALL nodes.
            - "s3": Attaches DeviceFilePolicy for S3 file access via IoT Credential Provider.
            - "kvs": Attaches DeviceVideoPolicy for KVS streaming via IoT Credential Provider.
            If omitted, only the DefaultThingPolicy (MQTT/shadow) is attached.

    RegisterBulkNodesResponse:
      type: object
      required:
        - request_id
        - message
      properties:
        request_id:
          type: string
          description: The unique ID used to track this bulk operation.
        message:
          type: string

    BulkUpdateNodesRequest:
      type: object
      required: [cert_file_s3_path]
      properties:
        cert_file_s3_path:
          type: string
          description: |
            S3 path to the CSV file (must start with `s3://`). The CSV
            must contain a `node_id` column. A `certs` column is
            optional per row — non-empty triggers a cloud-side cert
            replacement for that node. Any other column is treated as a
            `column:value` tag, same convention as registration.
        admin_group_names:
          type: array
          items:
            type: string
          description: List of admin group names to add ALL nodes to.
        admin_parent_group_name:
          type: string
          description:
            Name of the parent group under which admin groups should be created.
        tags:
          type: array
          items:
            type: string
          description: List of tags (`key:value`) to apply to ALL nodes.

    BulkUpdateNodesResponse:
      type: object
      required:
        - status
        - request_id
      properties:
        status:
          type: string
          enum: [success, error]
        request_id:
          type: string
          description: The unique ID used to track this bulk operation.
        message:
          type: string

    NodeRegFailedNodeEntry:
      type: object
      properties:
        request_id:
          type: string
          description: ID of the bulk job this failure belongs to.
        node_id:
          type: string
          description: |
            Cert CommonName when the cert parsed successfully, otherwise
            the `node_id` column from the input CSV (the operator-
            supplied identifier, so the round trip to retry-csv is
            consistent).
        code:
          type: string
          enum: [DUPLICATE_NODEID, INVALID_CERT, SERVER_ERROR, UNKNOWN]
          description: |
            Coarse failure classification. Lets dashboards filter and
            bucket failures without parsing free text. Mapped from the
            error chain by `utils.ClassifyFailure` at the time the
            failure was recorded.
        reason:
          type: string
          description: |
            Full wrapped error chain joined with `": "` — captures the
            root cause, not just the top-level wrapper message.
        recorded_at:
          type: integer
          description: Unix seconds when the failure was recorded.
        expires_at:
          type: integer
          description: |
            TTL attribute. DynamoDB auto-deletes the row after this time
            (defaults to `recorded_at + 90 days`).

    ListFailedNodesResponse:
      type: object
      properties:
        request_id:
          type: string
        failed_nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeRegFailedNodeEntry"
        page_total:
          type: integer
          description: Number of rows in the current page.
        next_key:
          type: string
          description:
            Pagination token for the next page (absent if no more pages).

    GVARequest:
      type: object
      required:
        - requestId
        - inputs
      properties:
        requestId:
          type: string
          description: Unique identifier for the request
          example: "ff36a3cc-ec34-11e6-b1a0-64510650abcf"
        inputs:
          type: array
          items:
            type: object
            required:
              - intent
            properties:
              intent:
                type: string
                enum:
                  - "action.devices.SYNC"
                  - "action.devices.QUERY"
                  - "action.devices.EXECUTE"
                  - "action.devices.DISCONNECT"
                description: The intent type from Google Assistant
              payload:
                type: object
                additionalProperties: true
                description: Intent-specific payload data

    GVAResponse:
      type: object
      required:
        - requestId
        - payload
      properties:
        requestId:
          type: string
          description: Echo of the request ID from the request
          example: "ff36a3cc-ec34-11e6-b1a0-64510650abcf"
        payload:
          type: object
          additionalProperties: true
          description:
            Intent-specific response payload (SyncPayload, QueryPayload,
            ExecutePayload, or DisconnectPayload)

    GVACfgRequest:
      description: |
        Google Cloud service-account JSON for HomeGraph. Shape mirrors GCM
        (`PushGcmConfigRequest`) — both endpoints accept the same standard
        Google service-account key file. The full document is stored
        verbatim in SSM.
      allOf:
        - $ref: "#/components/schemas/GoogleServiceAccountConfig"

    GoogleServiceAccountConfig:
      type: object
      description: |
        Standard Google Cloud service-account key file. Used by both GCM
        (Firebase) and GVA (HomeGraph) integrations. Every field is
        required and stored verbatim.
      required:
        - type
        - project_id
        - private_key_id
        - private_key
        - client_email
        - client_id
        - auth_uri
        - token_uri
        - auth_provider_x509_cert_url
        - client_x509_cert_url
        - universe_domain
      properties:
        type:
          type: string
          enum: [service_account]
        project_id:
          type: string
        private_key_id:
          type: string
        private_key:
          type: string
        client_email:
          type: string
        client_id:
          type: string
        auth_uri:
          type: string
        token_uri:
          type: string
        auth_provider_x509_cert_url:
          type: string
        client_x509_cert_url:
          type: string
        universe_domain:
          type: string

    GoogleServiceAccountResponse:
      type: object
      description: |
        Read-side projection of `GoogleServiceAccountConfig`: every stored
        field except the write-only `private_key`, which never leaves the
        backend. `private_key_id` remains so admins can tell which key is
        configured.
      properties:
        type:
          type: string
          enum: [service_account]
        project_id:
          type: string
        private_key_id:
          type: string
        client_email:
          type: string
        client_id:
          type: string
        auth_uri:
          type: string
        token_uri:
          type: string
        auth_provider_x509_cert_url:
          type: string
        client_x509_cert_url:
          type: string
        universe_domain:
          type: string

    GVACfgResponse:
      type: object
      properties:
        project_id:
          type: string
          description: The stored project ID
        redirect_uris:
          type: array
          items:
            type: string
          description: Calculated OAuth redirect URIs
        message:
          type: string

    GVACfgGetResponse:
      description: |
        Stored service-account fields plus the calculated `redirect_uris`.
        The write-only `private_key` is never returned.
      allOf:
        - $ref: "#/components/schemas/GoogleServiceAccountResponse"
        - type: object
          properties:
            redirect_uris:
              type: array
              items:
                type: string

    GVACfgDeleteResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    NodeConfig:
      type: object
      description: |
        Full node configuration as reported by the device firmware. Mirrors
        the `NodeCfg` struct defined in the backend (data model, devices,
        services, and Matter endpoints).
      properties:
        data_model:
          type: string
          description: |
            "default" for RainMaker-native nodes, "matter" for Matter nodes.
          example: "default"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/NodeConfigDevice"
        endpoints:
          type: object
          description: Matter endpoints, keyed by endpoint ID.
          additionalProperties:
            $ref: "#/components/schemas/MatterEndpoint"
        services:
          type: array
          items:
            $ref: "#/components/schemas/NodeConfigService"
        info:
          $ref: "#/components/schemas/NodeConfigInfo"
        message:
          type: string
      required:
        - info

    NodeConfigDevice:
      type: object
      required: [name, type, params]
      properties:
        name:
          type: string
        type:
          type: string
          description:
            "Device type (e.g., esp.device.switch, esp.device.lightbulb)."
        primary:
          type: string
          description: Name of the primary parameter.
        params:
          type: array
          items:
            $ref: "#/components/schemas/NodeConfigDeviceParam"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/NodeConfigAttr"
        message:
          type: string

    NodeConfigDeviceParam:
      type: object
      required: [name, type, data_type]
      properties:
        name:
          type: string
        type:
          type: string
          description: "Parameter type (e.g., esp.param.name, esp.param.power)."
        data_type:
          type: string
          description: "bool, int, float, string, or array."
        properties:
          type: array
          items:
            type: string
          description:
            "One or more of: read, write, persist, time_series, indexed."
        bounds:
          $ref: "#/components/schemas/NodeConfigParamBounds"
        ui_type:
          type: string
          description:
            "UI hint (e.g., esp.ui.slider, esp.ui.toggle, esp.ui.hidden)."
        message:
          type: string

    NodeConfigParamBounds:
      type: object
      properties:
        min:
          type: integer
        max:
          type: integer
        step:
          type: integer
        message:
          type: string

    NodeConfigAttr:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          description: Attribute value (any JSON type).
        message:
          type: string

    NodeConfigService:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          description:
            "Service type (e.g., esp.service.time, esp.service.system)."
        primary:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/NodeConfigDeviceParam"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/NodeConfigAttr"
        message:
          type: string

    NodeConfigInfo:
      type: object
      required: [fw_version]
      properties:
        name:
          type: string
        type:
          type: string
        fw_version:
          type: string
        model:
          type: string
        message:
          type: string

    MatterEndpoint:
      type: object
      required: [c]
      properties:
        dt:
          type: string
          description: Matter device type.
        c:
          $ref: "#/components/schemas/MatterEndpointClusters"
        message:
          type: string

    MatterEndpointClusters:
      type: object
      properties:
        s:
          type: object
          description: Server clusters, keyed by cluster ID.
          additionalProperties:
            $ref: "#/components/schemas/MatterServerCluster"
        c:
          type: object
          description: Client clusters, keyed by cluster ID.
          additionalProperties:
            $ref: "#/components/schemas/MatterClientCluster"
        message:
          type: string

    MatterServerCluster:
      type: object
      description: >-
        Matter server cluster. `i` (indexed) and `ts` (timeseries) are
        independent property sets and may overlap — an attribute that is both
        indexed and timeseries appears in both arrays. `v` holds config-only
        attribute values (reported in node config only, never in state). `a`
        lists the remaining plain attribute IDs and is omitted when empty.
      properties:
        a:
          type: array
          items:
            type: string
          description:
            Plain attribute IDs — not indexed, timeseries, or config-only.
            Omitted when empty.
        e:
          type: array
          items:
            type: string
          description: Event IDs.
        c:
          type: array
          items:
            type: string
          description: Accepted command IDs.
        i:
          type: array
          items:
            type: string
          description: Indexed attribute IDs.
        ts:
          type: array
          items:
            type: string
          description: Time-series attribute IDs.
        v:
          type: object
          additionalProperties: true
          description: >-
            Config-only attribute values, keyed by attribute ID. These
            attributes appear in node config only and are never reported in
            shadow params/state.
          example:
            "0x10": 42
        message:
          type: string

    MatterClientCluster:
      type: object
      properties:
        c:
          type: array
          items:
            type: string
          description: Generated command IDs.
        message:
          type: string

    NodeSchedulesPayload:
      type: object
      description: |
        The schedule service payload. Follows the ESP RainMaker built-in
        Schedules specification — this is the exact structure the device
        parses. The cloud stores and forwards it unchanged.
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        message:
          type: string
      example:
        schedules:
          - id: "s1"
            name: "Morning Lights"
            enabled: true
            triggers:
              - m: 420
                d: 62
            action:
              Light:
                Power: true
                Brightness: 80
            validity:
              start: 1704067200
              end: 1735689600
          # Matter node: action mirrors the parameter-control payload —
          # endpoint -> c -> s -> cluster -> c -> { command hex: TLV hex }.
          # Here Endpoint 0x1, OnOff cluster 0x6, On command 0x1. A command
          # with no fields is the empty TLV struct, encoded as "0x1518".
          - id: "s2"
            name: "MatterMorning"
            enabled: true
            triggers:
              - m: 420
                d: 62
            action:
              "0x1":
                c:
                  s:
                    "0x6":
                      c:
                        "0x1": "0x1518"

    Schedule:
      type: object
      description: |
        A single schedule entry. The firmware uses `name` as an NVS key and
        requires it to be 16 characters or fewer. Additional keys (including
        `id`) are ignored by the device but stored by the cloud.
      required:
        - name
        - triggers
        - action
      properties:
        id:
          type: string
          description: |
            Cloud-side identifier. Opaque; the device ignores this field.
        name:
          type: string
          maxLength: 16
          description:
            Unique schedule name (also used as an NVS key on the device).
        enabled:
          type: boolean
          description: Whether the schedule is active.
        triggers:
          type: array
          description: One or more triggers that fire the schedule.
          items:
            $ref: "#/components/schemas/ScheduleTrigger"
        action:
          type: object
          additionalProperties: true
          description: |
            Node parameter-update payload applied when the schedule fires.
            Default data model: `{ <DeviceId>: { <ParamId>: <value>, ... }, ... }`.
            Matter data model: parameter-control payload
            `{ "0x<endpoint>": { "c": { "s": { "0x<cluster>": { "c": { "0x<command>": "<TLV hex>" } } } } } }`.
          example:
            Light:
              Power: true
              Brightness: 80
        validity:
          $ref: "#/components/schemas/ScheduleValidity"
        message:
          type: string

    ScheduleTrigger:
      type: object
      description: |
        Schedule trigger. The trigger kind is discriminated by which keys are
        present — there is no explicit `type` field:

        - **One-shot relative:** `rsec` (seconds after current time).
        - **Date-based:** `m` (minutes since midnight) plus at least one of
          `d` (day-of-week bitmask) / `dd` (day-of-month).
        - **Solar:** `lat` + `lon` plus exactly one of `sr` / `ss` (offset in
          minutes from sunrise/sunset). May also include `d`/`dd`/`mm`/`yy`.
      properties:
        rsec:
          type: integer
          description: Seconds after current time (one-shot relative trigger).
        m:
          type: integer
          minimum: 0
          maximum: 1439
          description: Minutes since midnight (date-based trigger).
        d:
          type: integer
          description: |
            Bitmask of days of week (bits 7..1 = Sun/Sat/.../Tue/Mon).
            Example: `5` (0b0000101) = Mon + Wed.
        dd:
          type: integer
          minimum: 1
          maximum: 31
          description: Day of the month.
        mm:
          type: integer
          description: |
            Bitmask of months (bits 12..1 = Dec/Nov/.../Feb/Jan).
            Example: `15` (0b000000001111) = Jan–Apr.
        yy:
          type: integer
          description: Specific calendar year.
        lat:
          type: number
          description: Latitude in decimal degrees (solar trigger).
        lon:
          type: number
          description: Longitude in decimal degrees (solar trigger).
        sr:
          type: integer
          description: Offset in minutes from sunrise (solar trigger).
        ss:
          type: integer
          description: Offset in minutes from sunset (solar trigger).
        message:
          type: string

    ScheduleValidity:
      type: object
      description: Optional validity window for the schedule.
      properties:
        start:
          type: integer
          format: int64
          description: Start of validity window, UNIX timestamp in seconds.
        end:
          type: integer
          format: int64
          description: End of validity window, UNIX timestamp in seconds.
        message:
          type: string

    NodeTriggerPayload:
      type: object
      required:
        - triggers
      properties:
        triggers:
          type: array
          description: |
            List of node-side triggers. Every entry must have a unique string `id`.
            `id` values are referenced from group automations in the form
            `<nodeID>~<automationID>~<triggerIndex>`.
          items:
            $ref: "#/components/schemas/NodeTrigger"
        message:
          type: string
      example:
        triggers:
          - id: "t1"
            type: "param"
            path: "Light.Power"
            operator: "=="
            value: true
          - id: "t2"
            type: "param"
            path: "0x1.c.s.0x6.a.0x0"
            operator: "=="
            value: true

    NodeTrigger:
      type: object
      required:
        - id
      description: |
        A node-side trigger definition. The server enforces only the presence
        and uniqueness of `id`; any additional fields are passed through to the
        device and interpreted by the firmware.
      properties:
        id:
          type: string
          description: Unique trigger identifier within this node.
        message:
          type: string
      additionalProperties: true

    AutomationStatus:
      type: string
      description: |
        Whether the automation is active. Disabled automations are stored but do
        not execute actions when their conditions are met.
      enum:
        - enabled
        - disabled
      default: enabled
      example: enabled

    Automation:
      type: object
      description: A single automation configured for a group.
      allOf:
        - type: object
          properties:
            id:
              type: string
              description: Automation identifier unique within the group.
              example: "a1b"
        - $ref: "#/components/schemas/AutomationPayload"
      example:
        id: "a1b"
        name: "Turn on porch light at sunset"
        description: "Triggered when ambient light falls below threshold"
        status: enabled
        conditions:
          and:
            - "nodeA~a1b~0"
        actions:
          targets:
            - node: "nodeB"
              path: "Light.Power"
              value: true
            - node: "nodeC"
              path: "0x1.c.s.0x6.a.0x0"
              value: true
            - node: "nodeC"
              path: "0x1.c.s.0x6.c.0x1"
              value: "150c000000"

    ListAutomationsResponse:
      type: object
      description: |
        Wrapper response for `GET /v1/groups/{groupId}/service/automations`.
        The `automations` array is always present; it is empty when no
        automations are configured for the group.
      required:
        - automations
      properties:
        automations:
          type: array
          items:
            $ref: "#/components/schemas/Automation"

    AutomationPayload:
      type: object
      description: |
        The user-supplied automation definition. Triggers referenced in
        `conditions.and` / `conditions.or` must exist as node triggers (see
        [NodeTriggerPayload](#components/schemas/NodeTriggerPayload)).
        Set `status` to `disabled` to pause the automation without deleting it.
      properties:
        status:
          $ref: "#/components/schemas/AutomationStatus"
        name:
          type: string
          description: Human-readable name of the automation.
        description:
          type: string
          description: Optional description of the automation.
        conditions:
          $ref: "#/components/schemas/AutomationConditions"
        actions:
          $ref: "#/components/schemas/AutomationActions"
      example:
        status: enabled
        name: "Turn on porch light at sunset"
        description: "Triggered when ambient light falls below threshold"
        conditions:
          and:
            - "nodeA~a1b~0"
        actions:
          targets:
            - node: "nodeB"
              path: "Light.Power"
              value: true
            - node: "nodeC"
              path: "0x1.c.s.0x6.a.0x0"
              value: true
            - node: "nodeC"
              path: "0x1.c.s.0x8.c.0x4"
              value: "042bff"

    AutomationConditions:
      type: object
      description: |
        Boolean combination of trigger IDs that fires the automation.
        Trigger IDs use the format `<nodeID>~<automationID>~<triggerIndex>`.
      properties:
        and:
          type: array
          items:
            type: string
          description:
            All listed trigger IDs must fire for the automation to run.
        or:
          type: array
          items:
            type: string
          description: Any one of the listed trigger IDs fires the automation.
        message:
          type: string

    AutomationActions:
      type: object
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/AutomationActionTarget"
        message:
          type: string

    AutomationActionTarget:
      type: object
      description: |
        A single action performed when the automation fires — sets the data point
        at `path` under `node` to `value`.
      example:
        node: "nodeB"
        path: "Light.Power"
        value: true
      properties:
        node:
          type: string
          description:
            Target node ID. Used for cleanup when the node is removed.
        path:
          type: string
          description: |
            Within-node data point path.
            Default data model: `<device id>.<param id>` (e.g. `Light.Power`).
            Matter data model: the full dotted key chain into the desired shadow
            `0x<endpoint>.c.s.0x<cluster>.<a|c>.0x<attribute|command>`, where the
            `a`/`c` segment selects an attribute write or a command invoke
            (e.g. `0x1.c.s.0x6.a.0x0`, `0x1.c.s.0x6.c.0x1`).
        value:
          description: |
            Value to set for the parameter. Type depends on the parameter
            (boolean, number, string, or object).
          oneOf:
            - type: boolean
            - type: number
            - type: integer
            - type: string
            - type: object
              additionalProperties: true
        message:
          type: string

    AutomationWriteResponse:
      type: object
      properties:
        automation_id:
          type: string
          description: ID of the created or updated automation.
          example: "a1b"
        message:
          type: string
      required:
        - automation_id

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: |
        Not found - the resource does not exist, or the feature is not enabled
        on this deployment. For username lookups the message is deliberately
        generic — it does not reveal whether an address is registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Unauthorized - Invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description:
        Forbidden - User does not have permission to access the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: awsSigv4
    CognitoAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      description: |
        Bearer access token — ESP User OIDC for end users, admin Cognito pool
        for admins. Used only by `POST /v1/user/credentials`, which also needs
        the paired `id_token` in the body.
      x-amazon-apigateway-authtype: cognito_user_pools
    gvaAccessToken:
      type: apiKey
      name: Authorization
      in: header
      description: |
        ESP User `access_token` as `Bearer <access_token>`, issued to the
        voice-assistant client during Google account linking. Validated by the
        Lambda, not by an API Gateway authorizer.
    cognitoAuth:
      type: oauth2
      description: |
        Cognito User Pool OAuth2 with tiered scopes. Server-side authorization
        verifies the `custom:super_admin` claim for `super_admin`-scoped operations.
      flows:
        implicit:
          authorizationUrl: https://example.com/oauth2/authorize
          scopes:
            admin: Admin tier
            user: End-user tier

security:
  - sigv4: []
