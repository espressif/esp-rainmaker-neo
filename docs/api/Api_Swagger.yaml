      required:
        - integrations
      properties:
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/PublicIntegrationSummary"
          description: |
            Array of configured integrations as the non-admin id+type summary
            (no credentials). Returned by `GET /v1/integrations`.

    PushApnsConfigRequest:
      type: object
      required:
        - authentication_key
        - key_id
        - team_id
        - bundle_id
      properties:
        authentication_key:
          type: string
          description: APNS token-based auth key (.p8 key file contents).
        key_id:
          type: string
          description: APNS signing key ID from Apple Developer account.
        team_id:
          type: string
          description: APNS team ID from Apple Developer account.
        bundle_id:
          type: string
          description: APNS bundle identifier (used to derive `integration_id`).
        apns_sandbox:
          type: boolean
          default: false
          description: |
            If true, the integration is created against the APNS sandbox
            (development) environment. Use `integration_type=apns_sandbox`
            in the query parameter to make this explicit.

    PushApnsConfigResponse:
      type: object
      required:
        - integration_id
        - integration_type
        - key_id
        - team_id
        - bundle_id
      properties:
        integration_id:
          type: string
          example: "apns_com.company.app"
        integration_type:
          type: string
          enum: [apns, apns_sandbox]
        key_id:
          type: string
        team_id:
          type: string
        bundle_id:
          type: string

    PushGcmConfigRequest:
      description: |
        Google Cloud service-account JSON for Firebase Cloud Messaging.
        Shape mirrors GVA (`GVACfgRequest`) — both endpoints accept the
        same standard Google service-account key file. `project_id`
        becomes the derived `integration_id` suffix.
      allOf:
        - $ref: "#/components/schemas/GoogleServiceAccountConfig"

    PushGcmConfigResponse:
      description: |
        Full GCM integration detail: the stored Google service-account
        fields (mirrors `GVACfgGetResponse`) minus the write-only
        `private_key`, which is never returned.
      allOf:
        - type: object
          required:
            - integration_id
            - integration_type
          properties:
            integration_id:
              type: string
              example: "gcm_my-firebase-project"
            integration_type:
              type: string
              enum: [gcm]
        - $ref: "#/components/schemas/GoogleServiceAccountResponse"

    AlexaCfgRequest:
      type: object
      required:
        - redirect_uris
        - client_id
        - client_secret
        - skill_id
      properties:
        redirect_uris:
          type: array
          items:
            type: string
          description:
            List of redirect URIs to register on the voice-assistant OIDC client
            client
        client_id:
          type: string
          description: Alexa Skill client ID to store in SSM Parameter Store
        client_secret:
          type: string
          description: Alexa Skill client secret to store in SSM Parameter Store
        skill_id:
          type: string
          description:
            Alexa Skill ID to add as a trigger to the Alexa Skill Lambda
            function
        manufacturer_name:
          type: string
          description: |
            Brand advertised in the Alexa discovery response, which Works With Alexa
            review requires to be a real manufacturer. Optional: omit it to leave the
            stored brand untouched (so a credentials-only update does not reset an
            OEM's branding), or send it empty to restore the default brand
            ("Espressif"). A manufacturer reported by the device itself
            (`info.manufacturer` in its node config) takes precedence over this value.
          example: "Espressif"

    AlexaCfgResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    AlexaCfgGetResponse:
      type: object
      properties:
        client_id:
          type: string
          description: Alexa Skill client ID
        skill_id:
          type: string
          description: Alexa Skill ID
        redirect_uris:
          type: array
          items:
            type: string
          description:
            OAuth redirect URIs registered on the voice-assistant OIDC client
        manufacturer_name:
          type: string
          description:
            Brand currently advertised in discovery — the configured value, or
            the default brand when the deployment has set none. Never empty.
          example: "Espressif"
        message:
          type: string

    GetFileUploadUrlResponse:
      type: object
      required:
        - upload_url
        - s3_path
      properties:
        upload_url:
          type: string
          description: Pre-signed URL for uploading the file to S3
