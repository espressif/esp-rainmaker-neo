        "500":
          $ref: "#/components/responses/InternalServerError"

  # ----------------------------------------------------------------------
  # ADMIN — unified integration tree. All integration types (push,
  # smart-home, webhook) share the same paths; `integration_type` is a
  # query parameter on POST/list and a property of the integration record
  # on read.
  # ----------------------------------------------------------------------
  # NOTE (not rendered): Alexa and GVA integrations are registered
  # internally during deployment setup and are not normally created via
  # this public API. Webhook integrations are not yet fully supported.
  /v1/admin/integrations:
    post:
      summary: Register an integration
      description: |
        Registers a new integration. The `integration_type` query parameter
        selects the body shape (see `IntegrationConfigRequest`). Returns
        the assigned `integration_id` which subsequent operations (GET /
        PUT / DELETE / endpoint registration) address by.

        Super-admin only.
      tags:
        - Integrations
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/IntegrationTypeQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationConfigRequest"
            examples:
              APNS:
                summary: APNS (iOS production)
                value:
                  authentication_key:
                    "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
                  key_id: "<10 char Apple Key ID>"
                  team_id: "<10 char Apple Team ID>"
                  bundle_id: "com.company.app"
              APNS_SANDBOX:
                summary: APNS (iOS sandbox)
                value:
                  authentication_key:
                    "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
                  key_id: "<10 char Apple Key ID>"
                  team_id: "<10 char Apple Team ID>"
                  bundle_id: "com.company.app"
              GCM:
                summary:
                  GCM (Android) — Google service-account JSON, same shape as GVA
                value:
                  type: "service_account"
                  project_id: "your-fcm-project-id"
                  private_key_id: "abc123def456"
                  private_key:
                    "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE
                    KEY-----\n"
                  client_email: "firebase-adminsdk-xyzyour-fcm-project-id.iam.gserviceaccount.com"
                  client_id: "104567890123456789012"
                  auth_uri: "https://accounts.google.com/o/oauth2/auth"
                  token_uri: "https://oauth2.googleapis.com/token"
                  auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs"
                  client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-xyz%40your-fcm-project-id.iam.gserviceaccount.com"
                  universe_domain: "googleapis.com"
              Alexa:
                summary: Alexa skill
                value:
                  client_id: "amzn1.application-oa2-client.<client-id>"
                  client_secret: "amzn1.oa2-cs.v1.<client-secret>"
                  skill_id: "amzn1.ask.skill.<skill-id>"
                  manufacturer_name: "Espressif"
                  redirect_uris:
                    - "https://pitangui.amazon.com/api/skill/link/<skill-link-id>"
                    - "https://layla.amazon.com/api/skill/link/<skill-link-id>"
                    - "https://alexa.amazon.co.jp/api/skill/link/<skill-link-id>"
              GVA:
                summary: Google Voice Assistant
                value:
                  type: "service_account"
                  project_id: "your-gva-project-id"
                  private_key_id: "abc123def456789"
                  private_key:
                    "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE
                    KEY-----\n"
                  client_email: "homegraph-sa@your-gva-project-id.iam.gserviceaccount.com"
                  client_id: "104567890123456789012"
                  auth_uri: "https://accounts.google.com/o/oauth2/auth"
                  token_uri: "https://oauth2.googleapis.com/token"
                  auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs"
                  client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/homegraph-sa%40your-gva-project-id.iam.gserviceaccount.com"
                  universe_domain: "googleapis.com"
      responses:
        "201":
          description: Integration successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterIntegrationResponse"
              example:
                integration_id: "apns_com.company.app"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      summary: List integrations
      description: |
        Returns all configured integrations, optionally filtered by
        `integration_type`. Super-admin only.
      tags:
        - Integrations
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/IntegrationTypeQueryOptional"
