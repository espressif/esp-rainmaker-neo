                  type: "service_account"
                  project_id: "your-fcm-project-id"
                  private_key_id: "rotated_xyz789"
                  private_key:
                    "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE
                    KEY-----\n"
                  client_email: "firebase-adminsdk-xyz@your-prod-12345.iam.gserviceaccount.com"
                  client_id: "104567890123456789012"
                  auth_uri: "https://accounts.google.com/o/oauth2/auth"
                  token_uri: "https://oauth2.googleapis.com/token"
                  auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs"
                  client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-xyz%40your-fcm-project-id.iam.gserviceaccount.com"
                  universe_domain: "googleapis.com"
              Alexa:
                summary: Rotate Alexa client secret
                value:
                  client_id: "amzn1.application-oa2-client.6b3c8e2a4f5d4b9c8a7e2f1d3b5a8c6e"
                  client_secret: "amzn1.oa2-cs.v1.<client-secret>"
                  skill_id: "amzn1.ask.skill.f5e4d3c2-b1a0-9876-5432-1fedcba98765"
                  redirect_uris:
                    - "https://pitangui.amazon.com/api/skill/link/<skill-link-id>"
                    - "https://layla.amazon.com/api/skill/link/<skill-link-id>"
                    - "https://alexa.amazon.co.jp/api/skill/link/<skill-link-id>"
              GVA:
                summary: Rotate GVA service-account key
                description: |
                  Provide a new HomeGraph service-account JSON. `project_id`
                  must match the existing integration; rotating typically
                  means a new `private_key_id` + `private_key` for the same
                  `client_email`.
                value:
                  type: "service_account"
                  project_id: "your-gva-project-id"
                  private_key_id: "rotated_xyz987"
                  private_key:
                    "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE
                    KEY-----\n"
                  client_email: "homegraph-sa@your-gva-prod.iam.gserviceaccount.com"
                  client_id: "104567890123456789012"
                  auth_uri: "https://accounts.google.com/o/oauth2/auth"
                  token_uri: "https://oauth2.googleapis.com/token"
                  auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs"
                  client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/homegraph-sa%40your-gva-project-id.iam.gserviceaccount.com"
                  universe_domain: "googleapis.com"
      responses:
