        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/nodes/{nodeId}/groups:
    get:
      summary: Get node's group and subgroups
      description: |
        Returns the group and subgroups that a node belongs to.
        If the node is not in any group, returns an empty group and empty sub_groups array.
        Only super admin users can call this endpoint.
      tags:
        - Node Administration
      security:
        - sigv4: []
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: Node group info retrieved successfully
