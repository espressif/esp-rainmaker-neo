          description: The ARN of the created SNS platform application
        platform_name:
          type: string
          description:
            The name of the platform application (bundle ID for APNS, project ID
            for GCM)
        app_platform_id:
          type: string
          description: |
            The unique identifier for the application platform.
            Format: `{platform_type}` or `{platform_type}_{platform_app_name}`
