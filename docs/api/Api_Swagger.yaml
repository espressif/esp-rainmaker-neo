    RegisterEndpointRequest:
      type: object
      required:
        - delivery_credentials
      properties:
        delivery_credentials:
          type: object
          description: |
            Credentials used to deliver notifications to this user on this
            integration. Shape depends on `integrationType`:
            `{ "app_token": "..." }` for push integrations (apns,
            apns_sandbox, gcm and their mock variants), or an OAuth bundle
            (`{ "access_token", "refresh_token", "expires_at" }`) for
            account-link integrations (alexa, gva) and webhook integrations.
          properties:
            app_token:
              type: string
              description: |
                Raw push token issued by the OS (APNS / GCM). Required for
                push integrations; absent otherwise.
            access_token:
              type: string
              description:
                OAuth access token. Account-link / webhook integrations only.
            refresh_token:
              type: string
              description:
                OAuth refresh token. Account-link / webhook integrations only.
            expires_at:
              type: integer
              description: Unix timestamp at which `access_token` expires.
        locale:
          type: string
          description: "Locale code (e.g., en_US)"
          example: "en_US"

    RegisterEndpointResponse:
      type: object
      required:
        - status
        - endpoint_id
      properties:
        status:
          type: string
          enum: [success]
        endpoint_id:
          type: string
          description:
            Opaque identifier for the registered endpoint. Today the (user_id,
            integration_id) pair is 1:1 so endpoint_id equals integration_id,
            but callers should treat it as opaque so the contract survives the
            eventual move to multi-endpoint per user.

    GroupEditResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    GetNodeResponse:
      type: object
      properties:
        node_id:
          type: string
          description: ID of the node
        config:
          type: object
          additionalProperties: true
          description:
            Node configuration object containing device-specific settings
        message:
          type: string

    InitiateResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Unique identifier for this association request
        challenge:
          type: string
          description: |
            Challenge string that must be signed by the node.
            For Matter-capable groups: 64 uppercase hex characters (32 bytes) to be used as CSR nonce.
            For non-Matter groups: Alphanumeric challenge string.
        message:
          type: string
      required:
        - request_id
        - challenge
      example:
        request_id: "abc123def456"
        challenge: "A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4E5F6A1B2C3D4E5F6A1B2"

    VerifyRequest:
      type: object
      description: |
        Two authentication methods are supported (mutually exclusive - exactly one must be used):

        **Method 1: challenge_response** - Traditional signature verification.
        Requires `challenge_response` and `node_id`. Works for both Matter and non-Matter groups.
        The node is immediately added to the group. No NOC is generated.

        **Method 2: nocsr_elements** - Matter attestation with NOC generation.
        Requires `nocsr_elements`, `attestation_challenge`, and `attestation_signature`.
        Only valid for Matter-capable groups. Returns a device NOC. Call /confirm after
        the device installs the NOC.
      properties:
        challenge_response:
          type: string
          description: |
            Hex-encoded signature of the SHA256 hash of the challenge, signed by the node's private key.
            **Mutually exclusive with nocsr_elements** - exactly one must be provided.
        node_id:
          type: string
          description: |
            The ID of the node to be associated.
            **Required when using challenge_response.**
            **Optional/ignored when using nocsr_elements** - the node_id is extracted from
            vendor_reserved1 or auto-generated for pure Matter nodes (16-character hex string, 8 bytes).
        nocsr_elements:
          type: string
          description: |
            Hex-encoded NOCSRElements TLV structure for Matter attestation verification.
            **Only valid for Matter-capable groups.**
            **Mutually exclusive with challenge_response** - exactly one must be provided.

            Contains CSR (extracted for NOC generation), CSRNonce, and optional vendor_reserved
            fields. The CSRNonce must match the challenge from the /initiate step.

            If vendor_reserved1 contains a nodeID (thing name), the attestation signature
            will be verified against registered certificates for that node. If no certificates
            are found, or if vendor_reserved1 is not present, the device is treated as a
            pure Matter node and a random 16-character hex node_id (8 bytes) is generated.

            The TLV structure format:
            - Tag 0x01: CSR (DER-encoded Certificate Signing Request)
            - Tag 0x02: CSRNonce (must match the 32-byte challenge from /initiate)
            - Tag 0x03: vendor_reserved1 (optional, contains nodeID/thing name)
            - Tag 0x04: vendor_reserved2 (optional)
            - Tag 0x05: vendor_reserved3 (optional)
          example: "1530010102..."
        attestation_challenge:
          type: string
          description: |
            Hex-encoded 16-byte attestation challenge from PASE/CASE session.
            **Required when nocsr_elements is provided.**
            Used together with NOCSRElements to compute the TBS (to-be-signed):
            SHA256(NOCSRElements || AttestationChallenge).
          example: "0102030405060708090a0b0c0d0e0f10"
        attestation_signature:
          type: string
          description: |
            Hex-encoded 64-byte ECDSA signature in raw r||s format (32 bytes r, 32 bytes s).
            This is the signature over SHA256(NOCSRElements || AttestationChallenge).
            **Required when nocsr_elements is provided.**

            For devices with registered certificates (nodeID found in vendor_reserved1),
            this signature is verified against the device's DAC public key.
            For pure Matter devices (no vendor_reserved1 or no certificates), signature
            verification is skipped.
          example: "abcd1234...64byteshex"

    VerifyMatterResponse:
      type: object
      description: Response for Matter group verification (includes device NOC)
      properties:
        noc:
          type: string
          description: PEM-encoded Node Operational Certificate for the device
          example:
            "-----BEGIN CERTIFICATE-----\nMIIBpjCCAUygAwIBAgIIX...\n-----END
            CERTIFICATE-----"
        matter_node_id:
          type: string
          description: |
            16-character hex string representing the device's Matter Node ID within this fabric.
            Derived from the node_id (thing name) using ASCII-to-hex encoding.
          example: "4E6F64653132330000000000"
        node_id:
          type: string
          description: |
            RainMaker node ID (thing name). For pure Matter nodes without vendor_reserved1,
            this is a randomly generated 16-character (8-byte) hex string. For RainMaker
            devices with vendor_reserved1, this matches the device's thing name.
          example: "MySmartLight01"
        message:
          type: string
      required:
        - noc
        - matter_node_id
        - node_id

    IntegrationConfigRequest:
      description: |
        Configuration body for registering or updating an integration. The
        variant used is selected by the `integration_type` query parameter
        (on POST) or by the integration's stored type (on PUT).
      oneOf:
        - $ref: "#/components/schemas/PushApnsConfigRequest"
        - $ref: "#/components/schemas/PushGcmConfigRequest"
        - $ref: "#/components/schemas/AlexaCfgRequest"
        - $ref: "#/components/schemas/GVACfgRequest"

    IntegrationConfigResponse:
      description: |
        Response body for `GET /v1/admin/integrations/{integrationId}`.
        Shape matches the integration's type.
      oneOf:
        - $ref: "#/components/schemas/PushApnsConfigResponse"
        - $ref: "#/components/schemas/PushGcmConfigResponse"
        - $ref: "#/components/schemas/AlexaCfgGetResponse"
        - $ref: "#/components/schemas/GVACfgGetResponse"

    RegisterIntegrationResponse:
      type: object
      required:
        - integration_id
      properties:
        integration_id:
          type: string
          description: |
            Opaque identifier for the newly registered integration. Pass
            back as the `integrationId` path parameter on subsequent
            operations.

    ListIntegrationsResponse:
      type: object
      required:
        - integrations
      properties:
        integrations:
