asyncapi: 3.1.0
info:
  title: ESP RainMaker Neo Bridge MQTT API
  version: "0.8.0"
  description: |
    MQTT API definitions for the **Bridge** add-on of the ESP RainMaker Neo
    platform.

    A bridge is a RainMaker node that fronts one or more non-IP child devices
    (Zigbee, Matter-bridge, etc.). Children are represented as their own AWS IoT
    Things named `<parent>--<suffix>`; the bridge publishes and subscribes on
    their behalf. This spec documents the MQTT surface that is **specific to the
    bridge feature**:

    - the bridge-only control-plane channel for child-Thing lifecycle
      (`addChild` / `removeChild`) and its `bridgeAck` reply;
    - the bridge-namespace channels onto which a child's cloud→device traffic is
      rewritten, so one bridge covers all of its children with two wildcard
      subscriptions regardless of how many children it has;
    - how a bridge rides the **core** node topics (config / shadow / timeseries /
      notification) on behalf of its children.

    The bridge is a fully optional add-on. `MQTT_Node.yaml` documents the
    canonical node topics and owns every payload schema shared with a direct
    device; this spec depends one-way on those definitions, references them by
    name, and does not restate them.

  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  contact:
    email: esp-rainmaker-support@espressif.com
    url: https://rainmaker.espressif.com

servers:
  production:
    host: "{iot-endpoint}-ats.iot.{region}.amazonaws.com"
    protocol: mqtt
    description: AWS IoT Core endpoint (region-specific, TLS mutual auth)
    security:
      - $ref: "#/components/securitySchemes/X509"

# ──────────────────────────────────────────────────────────────────────────────
# OPERATIONS
# ──────────────────────────────────────────────────────────────────────────────
operations:
  # ── Bridge control plane (bridge-only) ────────────────────────────────────
  publishBridgeToCloud:
    action: send
    channel:
      $ref: "#/channels/bridgeToCloud"
    summary: Bridge publishes child-lifecycle control events (addChild / removeChild)
    description: |
      Dedicated control-plane channel for child-Thing lifecycle. Replies arrive
      on the bridge's own `fromCloud` channel as a `bridgeAck` event
      (`subscribeBridgeAck`).

  subscribeBridgeAck:
    action: receive
    channel:
      $ref: "#/channels/bridgeFromCloud"
    summary: Bridge receives the bridgeAck reply to addChild / removeChild
    description: |
      The cloud replies to a control-plane request as a `bridgeAck` event on the
      bridge's **own** `fromCloud` topic
      (`rainmaker/nodes/{parentNodeId}/from_cloud`) — the same core channel a
      node uses for cloud responses.

  subscribeBridgeChildFromCloud:
    action: receive
    channel:
      $ref: "#/channels/bridgeChildFromCloud"
    summary: Bridge receives a child's cloud→device traffic on the bridge namespace
    description: |
      Every publish to `rainmaker/nodes/{child}/from_cloud` is rewritten onto
      the bridge namespace, so a single wildcard subscription on the bridge
      covers all of its children. The payload is republished unchanged and is
      identical to the core `fromCloud` channel.

  subscribeBridgeChildUserParams:
    action: receive
    channel:
      $ref: "#/channels/bridgeChildUserParams"
    summary: Bridge receives a child's unicast parameter control on the bridge namespace
    description: |
      Every publish to
      `rainmaker/nodes/{child}/user/params-{groupInfoStr}/params` is rewritten
      onto the bridge namespace. The payload is republished unchanged and is
      identical to the core `userParams` channel.

  # ── Bridge riding core node topics on behalf of children ───────────────────
  publishChildConfig:
    action: send
    channel:
      $ref: "#/channels/toCloud"
    summary: Bridge publishes its own and its children's setNodeConfig on the core to_cloud
    description: |
      A bridge publishes `setNodeConfig` for itself and for each child on the
      **core** `rainmaker/nodes/{nodeId}/to_cloud` channel, with `{nodeId}` set
      to the bridge or to a child Thing. The payload schema is identical to a
      direct device's — bridge-ness is carried in Thing attributes, never in the
      config. See `toCloudMessage` in `MQTT_Node.yaml`.

  publishChildShadowUpdate:
    action: send
    channel:
      $ref: "#/channels/childNamedShadowUpdate"
    summary: Bridge publishes a child's named shadow on the core canonical topic
    description: |
      A bridge publishes its children's shadow updates directly on the core
      canonical topic with `{nodeId}` set to the child Thing. The model is
      **fire-and-forget at QoS 1**: bridges do **not** subscribe to
      `/update/accepted` or `/update/rejected` for children, which is what keeps
      the per-bridge subscription count independent of the number of children.

  publishChildTimeseries:
    action: send
    channel:
      $ref: "#/channels/childTimeseries"
    summary: Bridge publishes a child's timeseries on the core canonical topic
    description: |
      A bridge publishes its children's timeseries directly on the core
      canonical topic with `{nodeId}` set to the child Thing. Server-side
      ingestion is identical to a direct device's.

  publishChildTimeseriesBatch:
    action: send
    channel:
      $ref: "#/channels/childTimeseriesBatch"
    summary: Bridge publishes a child's batched timeseries on the core canonical topic
    description: |
      Batched form of `publishChildTimeseries`, with `{nodeId}` set to the child
      Thing.

  publishChildNotification:
    action: send
    channel:
      $ref: "#/channels/childNotification"
    summary: Bridge publishes a child's notification on the core canonical topic
    description: |
      A bridge publishes its children's notifications directly on the core
      canonical topic with `{nodeId}` set to the child Thing.

  publishChildIndexedShadowUpdate:
    action: send
    channel:
      $ref: "#/channels/childIndexedShadowUpdate"
    summary: Bridge reports a child's online state on the core indexed shadow
    description: |
      A child holds no MQTT connection of its own, so AWS IoT presence events
      never fire for it. Its user-facing online state comes from the bridge
      writing `online` to the child's `iparams` shadow as it observes the child
      on the bridge-side protocol.

      The cloud writes this topic too: when the **bridge** disconnects, every
      one of its children is marked `online: false`. There is no symmetric
      behaviour on connect — after reconnecting, the bridge must reconfirm each
      child's reachability and re-report `online: true` itself.

# ──────────────────────────────────────────────────────────────────────────────
# CHANNELS
# ──────────────────────────────────────────────────────────────────────────────
channels:
  # ── Bridge namespace (bridge-only) ────────────────────────────────────────
  bridgeToCloud:
    address: "rainmaker/bridges/{parentNodeId}/to_cloud"
    description: |
      **[Bridge → Cloud]** Dedicated control-plane channel for child-Thing
      lifecycle (`addChild`, `removeChild`).

      A bridge can only publish on its own control plane: the publishing client
      ID is checked against the `{parentNodeId}` segment and a mismatch is
      dropped.

      The basic-ingest variant
      `$aws/rules/bridge_to_cloud_rule/rainmaker/bridges/{parentNodeId}/to_cloud`
      is also accepted, and must name `bridge_to_cloud_rule`. Basic ingest skips
      the broker and reaches only the rule named in the path, so addressing
      `node_to_cloud_rule` here would silently drop the request.

      Replies are published back on the bridge's own `fromCloud` channel
      (`rainmaker/nodes/{parentNodeId}/from_cloud`) as a `bridgeAck` event.
    parameters:
      parentNodeId:
        $ref: "#/components/parameters/parentNodeId"
    messages:
      bridgeControl:
        $ref: "#/components/messages/bridgeToCloudMessage"

  bridgeFromCloud:
    address: "rainmaker/nodes/{parentNodeId}/from_cloud"
    description: |
      **[Cloud → Bridge]** The bridge's own core `fromCloud` channel. In
      addition to the standard cloud responses (see `fromCloudMessage` in
      `MQTT_Node.yaml`), this is where the `bridgeAck` reply to an `addChild` /
      `removeChild` request arrives.
    parameters:
      parentNodeId:
        $ref: "#/components/parameters/parentNodeId"
    messages:
      bridgeAck:
        $ref: "#/components/messages/bridgeAckMessage"

  bridgeChildFromCloud:
    address: "rainmaker/bridges/{parentNodeId}/children/{childNodeId}/from_cloud"
    description: |
      **[Cloud → Bridge]** A child's `from_cloud` traffic, rewritten onto the
      bridge namespace so the bridge can pick up every child's cloud→device
      messages with one wildcard subscription:
      `rainmaker/bridges/{self}/children/+/from_cloud`.

      The payload is republished unchanged, so its shape is identical to the
      core `fromCloud` channel.
    parameters:
      parentNodeId:
        $ref: "#/components/parameters/parentNodeId"
      childNodeId:
        $ref: "#/components/parameters/childNodeId"
    messages:
      cloudEvent:
        $ref: "#/components/messages/childFromCloudMessage"

  bridgeChildUserParams:
    address: "rainmaker/bridges/{parentNodeId}/children/{childNodeId}/user/params-{groupInfoStr}/params"
    description: |
      **[Cloud → Bridge]** A child's unicast parameter-control traffic,
      rewritten onto the bridge namespace. The bridge picks every child's
      commands up with one wildcard subscription:
      `rainmaker/bridges/{self}/children/+/user/+/params`.

      The wildcard over the shadow-name segment is deliberate: a child's unicast
      shadow name changes whenever its subgroup set changes, and the wildcard
      lets the existing subscription keep matching without any
      subscribe/unsubscribe churn.

      The payload is republished unchanged, so its shape is identical to the
      core `userParams` channel.
    parameters:
      parentNodeId:
        $ref: "#/components/parameters/parentNodeId"
      childNodeId:
        $ref: "#/components/parameters/childNodeId"
      groupInfoStr:
        $ref: "#/components/parameters/groupInfoStr"
    messages:
      paramControl:
        $ref: "#/components/messages/childParamControlMessage"

  # ── Core node topics ridden by the bridge (canonical addresses) ────────────
  # These are core-owned topics, defined in MQTT_Node.yaml and used by every
  # node. They are restated here only to document the bridge-specific publisher
  # and authorization; the payload schemas stay in the core spec.
  toCloud:
    address: "rainmaker/nodes/{nodeId}/to_cloud"
    description: |
      **[Bridge → Cloud]** Core node→cloud channel. A bridge publishes its own
      and its children's `setNodeConfig` here; `{nodeId}` is the bridge or a
      child Thing. Payload schema is the core `toCloudMessage`
      (`MQTT_Node.yaml`), unchanged for a child.

      Child-Thing lifecycle (`addChild` / `removeChild`) is **not** carried
      here — it has its own `bridgeToCloud` control plane.

      Basic-ingest variant
      `$aws/rules/node_to_cloud_rule/rainmaker/nodes/{nodeId}/to_cloud` is
      granted for children too. The rule is the **core** one: a child's publish
      is ingested by exactly the same rule as a direct device's.
    parameters:
      nodeId:
        $ref: "#/components/parameters/nodeId"
    messages:
      childConfig:
        $ref: "#/components/messages/childToCloudMessage"

  childNamedShadowUpdate:
    address: "$aws/things/{nodeId}/shadow/name/params-{groupInfoStr}/update"
    description: |
      **[Bridge → AWS IoT Shadow]** Core named shadow update, published by the
      bridge on behalf of a child with `{nodeId}` set to the child Thing.
      Fire-and-forget at QoS 1 — the bridge does NOT subscribe to
      `/update/accepted` or `/update/rejected` for children. Payload schema is
      the core `namedShadowUpdateMessage` (`MQTT_Node.yaml`).

      Deleting a child's stale shadow after a group or subgroup move is **not**
      a bridge operation. The cloud migrates the shadow as part of the group
      flow, so there is no bridge-published shadow delete.
    parameters:
      nodeId:
        $ref: "#/components/parameters/nodeId"
      groupInfoStr:
        $ref: "#/components/parameters/groupInfoStr"
    messages:
      childShadow:
        $ref: "#/components/messages/childNamedShadowUpdateMessage"

  childIndexedShadowUpdate:
    address: "$aws/things/{nodeId}/shadow/name/iparams/update"
    description: |
      **[Bridge → AWS IoT Shadow]** Core indexed shadow update, published by the
      bridge on behalf of a child with `{nodeId}` set to the child Thing. This
      is where a child's `online` flag lives, because AWS IoT presence never
      fires for a child.

      After reconnecting, a bridge must reconfirm each child and re-report
      `online: true` per child; nothing restores it automatically. That is a
      burst proportional to the number of children, so spread the publishes
      rather than sending them back to back. Payload schema is the core
      `indexedShadowUpdateMessage` (`MQTT_Node.yaml`).
    parameters:
      nodeId:
        $ref: "#/components/parameters/nodeId"
    messages:
      childIndexedShadow:
        $ref: "#/components/messages/childIndexedShadowUpdateMessage"

  childTimeseries:
    address: "rainmaker/nodes/{nodeId}/ts/{groupInfoStr}"
    description: |
      **[Bridge → Cloud]** Core timeseries channel, published by the bridge on
      behalf of a child with `{nodeId}` set to the child Thing. Server-side
      ingestion is identical to a direct device's. Payload schema is the core
      `timeseriesMessage` (`MQTT_Node.yaml`). Basic-ingest variant
      `$aws/rules/node_ts_rule/rainmaker/nodes/{nodeId}/ts/{groupInfoStr}`.
    parameters:
      nodeId:
        $ref: "#/components/parameters/nodeId"
      groupInfoStr:
        $ref: "#/components/parameters/groupInfoStr"
    messages:
      tsData:
        $ref: "#/components/messages/childTimeseriesMessage"

  childTimeseriesBatch:
    address: "rainmaker/nodes/{nodeId}/ts/{groupInfoStr}/batch"
    description: |
      **[Bridge → Cloud]** Core batched timeseries channel, published by the
      bridge on behalf of a child with `{nodeId}` set to the child Thing.
      Payload schema is the core `timeseriesBatchMessage` (`MQTT_Node.yaml`),
      including its 1-100 points-per-message guidance. Basic-ingest variant
      `$aws/rules/node_ts_batch_rule/rainmaker/nodes/{nodeId}/ts/{groupInfoStr}/batch`.
    parameters:
      nodeId:
        $ref: "#/components/parameters/nodeId"
      groupInfoStr:
        $ref: "#/components/parameters/groupInfoStr"
    messages:
      tsBatchData:
        $ref: "#/components/messages/childTimeseriesBatchMessage"

  childNotification:
    address: "rainmaker/nodes/{nodeId}/notify/{groupInfoStr}"
    description: |
      **[Bridge → Cloud]** Core notification channel, published by the bridge on
      behalf of a child with `{nodeId}` set to the child Thing. Payload schema
      is the core `notificationMessage` (`MQTT_Node.yaml`). Basic-ingest variant
      `$aws/rules/node_notify_rule/rainmaker/nodes/{nodeId}/notify/{groupInfoStr}`.
    parameters:
      nodeId:
        $ref: "#/components/parameters/nodeId"
      groupInfoStr:
        $ref: "#/components/parameters/groupInfoStr"
    messages:
      notifyData:
        $ref: "#/components/messages/childNotificationMessage"

# ──────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ──────────────────────────────────────────────────────────────────────────────
components:
  messages:
    # ── bridge to_cloud (bridge-only control plane) ─────────────────────────
    bridgeToCloudMessage:
      name: BridgeToCloud
      summary: Bridge-only child-Thing lifecycle control event
      description: |
        Bridges publish child-lifecycle requests on
        `rainmaker/bridges/{parentNodeId}/to_cloud`. The cloud dispatches on the
        `event` array and replies as a `bridgeAck` event on the bridge's own
        `fromCloud` channel (`rainmaker/nodes/{parentNodeId}/from_cloud`).

        Send **exactly one** of `addChild` / `removeChild` per publish:
        `bridgeAck` is a single object, so only the first is honoured and the
        rest are ignored.
      payload:
        type: object
        required:
          - event
        properties:
          event:
            type: array
            description: Array of event names to request
            items:
              type: string
              enum:
                - addChild
                - removeChild
          addChild:
            type: object
            description: Request server-side creation of a bridged child Thing.
            required:
              - request_id
              - child_suffix
              - child_local_id
            properties:
              request_id:
                type: string
                description: Client-chosen correlation ID; echoed in bridgeAck.
                example: "8b51c2a4"
              child_suffix:
                type: string
                description: |
                  Suffix appended after `--` to form the child thing name. Must
                  match `^[a-zA-Z0-9_]{1,32}$`. Hyphens are excluded so that no
                  `--` can appear inside the suffix itself.
                example: "child_A"
              child_local_id:
                type: string
                description: |
                  Bridge-side protocol identifier (Zigbee EUI-64, etc.) used to
                  make a re-add after a bridge restart idempotent.
                example: "0x00158D00012345AB"
          removeChild:
            type: object
            description: Request server-side removal of a bridged child.
            required:
              - request_id
              - child_node_id
            properties:
              request_id:
                type: string
                example: "9c52d3b5"
              child_node_id:
                type: string
                description: |
                  Full child `node_id` (`<parent>--<suffix>`). Must be prefixed
                  with the publisher's own `node_id`; foreign children are
                  rejected with `child_not_owned`.
                example: "bridge-hub-001--child_A"
      examples:
        - name: Add child
          summary: Bridge requests creation of a new child Thing
          payload:
            event:
              - addChild
            addChild:
              request_id: "8b51c2a4"
              child_suffix: "child_A"
              child_local_id: "0x00158D00012345AB"
        - name: Remove child
          summary: Bridge requests removal of an existing child Thing
          payload:
            event:
              - removeChild
            removeChild:
              request_id: "9c52d3b5"
              child_node_id: "bridge-hub-001--child_A"

    # ── bridgeAck (reply on the bridge's own from_cloud) ─────────────────────
    bridgeAckMessage:
      name: BridgeAck
      summary: Response to an addChild / removeChild request
      description: |
        Response to an `addChild` or `removeChild` request published on the
        bridge control-plane channel (`bridgeToCloud`). Arrives on the bridge's
        own `fromCloud` (`rainmaker/nodes/{parentNodeId}/from_cloud`) as a
        `bridgeAck` event, alongside the standard core `fromCloud` events.
      payload:
        type: object
        required:
          - event
        properties:
          event:
            type: array
            items:
              type: string
              enum:
                - bridgeAck
          bridgeAck:
            type: object
            required:
              - request_id
              - status
            properties:
              request_id:
                type: string
                description: Correlation ID echoed from the request.
                example: "8b51c2a4"
              status:
                type: string
                enum: ["success", "error"]
              error:
                type: string
                description: Error code (only when status is "error").
                enum:
                  - invalid_payload
                  - invalid_suffix
                  - missing_child_local_id
                  - child_suffix_in_use
                  - child_not_owned
                  - bridge_not_associated
                  - thing_create_failed
                  - db_write_failed
                  - group_assoc_failed
                  - group_disassoc_failed
                  - teardown_failed
                  - internal_error
                example: "child_suffix_in_use"
              child_node_id:
                type: string
                description: |
                  Assigned/affected child `node_id` (`<parent>--<suffix>`).
                  Returned for both addChild and removeChild on success.
                example: "bridge-hub-001--child_A"
              idempotent:
                type: boolean
                description: |
                  Present on successes that changed nothing: an addChild
                  matching a child that already exists with the same
                  `child_local_id`, or a removeChild for a child that is already
                  gone.
                example: true
      examples:
        - name: Add child ack
          summary: Cloud confirms child creation on the bridge's from_cloud
          payload:
            event:
              - bridgeAck
            bridgeAck:
              request_id: "8b51c2a4"
              status: "success"
              child_node_id: "bridge-hub-001--child_A"

    # ── core-schema pass-throughs ────────────────────────────────────────────
    # Channels the bridge rides or receives on whose payload is byte-identical
    # to a core message. Named after the core message they mirror so the two
    # specs stay greppable against each other; the authoritative schema and its
    # examples stay in MQTT_Node.yaml and are not duplicated here.
    childToCloudMessage:
      name: ToCloud
      summary: A node→cloud event, published by the bridge for itself or a child
      description: |
        Identical to the core `toCloudMessage` (`MQTT_Node.yaml`) — refer to it
        for the `setNodeConfig` payload and its examples, for both the default
        and the Matter data models. A child's config is byte-for-byte a direct
        device's: the parent link is recorded in the child's Thing attributes,
        never in the config payload.
      payload:
        $ref: "#/components/schemas/passthroughPayload"

    childNamedShadowUpdateMessage:
      name: NamedShadowUpdate
      summary: A named shadow update, published by the bridge for itself or a child
      description: |
        Identical to the core `namedShadowUpdateMessage` (`MQTT_Node.yaml`) —
        refer to it for the `state.reported.params` payload and its examples,
        for both the default and the Matter data models. For a child, the bridge
        sets `online` from protocol-side reachability.
      payload:
        $ref: "#/components/schemas/passthroughPayload"

    childIndexedShadowUpdateMessage:
      name: IndexedShadowUpdate
      summary: A child's indexed-shadow update, carrying its online state
      description: |
        Identical to the core `indexedShadowUpdateMessage` (`MQTT_Node.yaml`).
        For a child this is the authoritative source of `online`, since AWS IoT
        presence never fires for a device that holds no MQTT connection.
      payload:
        $ref: "#/components/schemas/passthroughPayload"
      examples:
        - name: Child online
          summary: Bridge reports a child reachable on the protocol side
          payload:
            state:
              reported:
                online: true

    childFromCloudMessage:
      name: FromCloud
      summary: A child's cloud→device message, rewritten onto the bridge namespace
      description: |
        Identical to the core `fromCloudMessage` (`MQTT_Node.yaml`) — the
        rewrite republishes the payload unchanged.
      payload:
        $ref: "#/components/schemas/passthroughPayload"

    childParamControlMessage:
      name: ParamControl
      summary: A child's unicast parameter control, rewritten onto the bridge namespace
      description: |
        Identical to the core `paramControlMessage` (`MQTT_Node.yaml`) — the
        rewrite republishes the payload unchanged.
      payload:
        $ref: "#/components/schemas/passthroughPayload"

    childTimeseriesMessage:
      name: Timeseries
      summary: A child's timeseries point, published by the bridge
      description: |
        Identical to the core `timeseriesMessage` (`MQTT_Node.yaml`). Ingestion
        resolves the child from the topic exactly as it does a direct device.
      payload:
        $ref: "#/components/schemas/passthroughPayload"

    childTimeseriesBatchMessage:
      name: TimeseriesBatch
      summary: A child's batched timeseries points, published by the bridge
      description: |
        Identical to the core `timeseriesBatchMessage` (`MQTT_Node.yaml`),
        including the 1-100 independently queryable points per message.
      payload:
        $ref: "#/components/schemas/passthroughPayload"

    childNotificationMessage:
      name: Notification
      summary: A child's notification, published by the bridge
      description: |
        Identical to the core `notificationMessage` (`MQTT_Node.yaml`).
      payload:
        $ref: "#/components/schemas/passthroughPayload"

  schemas:
    # Passthrough payload for channels whose real schema lives in the core spec.
    passthroughPayload:
      type: object
      description: |
        See the referenced core message schema in `MQTT_Node.yaml` for the
        authoritative payload definition and examples.
      additionalProperties: true

  parameters:
    nodeId:
      description:
        Node identifier (Thing Name / MQTT Client ID). For bridge-ridden core
        topics this is the bridge or a child Thing.
      examples:
        - "bridge-hub-001"
        - "bridge-hub-001--child_A"

    parentNodeId:
      description: |
        Bridge thing name (the parent in a `<parent>--<suffix>` child
        relationship). Bridge thing names are guaranteed by registration not to
        contain `--`.
      examples:
        - "bridge-hub-001"

    childNodeId:
      description: |
        Bridged child thing name, of the form `<parent>--<suffix>`, where
        `<suffix>` matches `^[a-zA-Z0-9_]{1,32}$`.
      examples:
        - "bridge-hub-001--child_A"

    groupInfoStr:
      description: |
        Group info string: `<group_id>[-<sub1>-<sub2>-…]` with subgroups sorted
        alphabetically. Empty string if unassociated. See `MQTT_Node.yaml`.
      examples:
        - "a1bc2d"
        - "a1bc2d-sg1-sg2"
        - ""

  securitySchemes:
    X509:
      type: X509
      description: |
        X.509 certificate-based mutual TLS authentication with AWS IoT Core. A
        bridge authenticates with its own certificate, and its policy extends
        the standard device grants to Things named `<self>--*` — that is, to its
        own children and to nothing else. A bridge can neither read nor write
        traffic addressed to another bridge's children.
