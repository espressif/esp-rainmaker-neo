# Ruff's default rule set, and every selected rule blocks CI. A rule joins `select` only once the tree passes it; report one that is not gated yet with `ruff check --select <rule>`.

# esp-cloud-common is another repo's code, and CI lints without the submodule checked out.
extend-exclude = ["src/esp-cloud-common"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Sphinx configs inherit their settings by star import.
"docs/**/conf*.py" = ["F403", "F405"]
