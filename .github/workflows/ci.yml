name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pushes to the same PR are pointless work; a push to main is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Kept in lockstep with go.mod and deployment/docker/Dockerfile. A ginkgo CLI newer
  # than the library it drives produces confusing failures — bump all together.
  GINKGO_VERSION: v2.28.3
  GOMEGA_VERSION: v1.40.0
  GOCOVER_COBERTURA_VERSION: v1.5.0
  # Matches deployment/docker/Dockerfile's NODE_VERSION: Node 24 bundles the npm
  # major that resolved the committed package-lock.json.
  NODE_VERSION: "24"
  # The Lambda runtime target (see deployment/docker/Dockerfile).
  PYTHON_VERSION: "3.12"

jobs:
  # Single diff computed once and shared via needs:/outputs
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python_cdk: ${{ steps.filter.outputs.python_cdk }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      api_docs: ${{ steps.filter.outputs.api_docs }}
      mqtt: ${{ steps.filter.outputs.mqtt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against base
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "python_cdk=true" >> "$GITHUB_OUTPUT"
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
            echo "api_docs=true" >> "$GITHUB_OUTPUT"
            echo "mqtt=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # merge-base, not the base tip: unrelated commits landing on main
          # while the PR is open must not re-trigger every job.
          base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          # Pathspecs are git wildmatch, where '*' already crosses '/', so
          # '*.go' covers top-level files too — '**/*.go' would miss them.
          check() { git diff --quiet "$base" -- "$@" && echo false || echo true; }
          echo "go=$(check '*.go' go.mod go.sum go.work go.work.sum Makefile src/esp-cloud-common)" >> "$GITHUB_OUTPUT"
          echo "python_cdk=$(check '*.py' requirements.txt cdk.json Stackfile.yaml deployment/docker/Dockerfile Makefile)" >> "$GITHUB_OUTPUT"
          echo "dashboard=$(check 'dashboard/**')" >> "$GITHUB_OUTPUT"
          echo "api_docs=$(check 'docs/api/**')" >> "$GITHUB_OUTPUT"
          echo "mqtt=$(check docs/api/MQTT_*.yaml docs/api/Push_*.yaml)" >> "$GITHUB_OUTPUT"

  # Ginkgo across all three go.work modules. `make test` delegates to each
  # submodule's own `make test` (TEST_SUBMODULES) because ginkgo's package
  # discovery stops at Go module boundaries.
  unittest:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install test tooling
        run: |
          go install github.com/onsi/ginkgo/v2/ginkgo@${GINKGO_VERSION}
          go install github.com/onsi/gomega/...@${GOMEGA_VERSION}
          go install github.com/boumenot/gocover-cobertura@${GOCOVER_COBERTURA_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage/coverage.xml
            build/tests/
          if-no-files-found: ignore

  # Static analysis via the rmng-lint tooling. Non-blocking, same as GitLab's go_lint.
  go_lint:
    name: Go lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  # govulncheck, scanned per module because it does not cross go.work boundaries.
  # Blocking, same as GitLab's go_vulncheck.
  vulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vulncheck

  # The only gate on Python and CDK changes. Synth needs no AWS credentials —
  # there are no from_lookup calls and CDK_PUBLISH makes the templates
  # region-agnostic. DASHBOARD_SKIP avoids requiring built frontend assets; the
  # dashboard job below covers those.
  cdk_synth:
    name: CDK synth
    needs: changes
    if: needs.changes.outputs.python_cdk == 'true'
    runs-on: ubuntu-latest
    env:
      CDK_PUBLISH: "true"
      DASHBOARD_SKIP: "1"
      AWS_REGION: ap-south-1
      CDK_DEFAULT_REGION: ap-south-1
      RMNG_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: make go_build
      - name: Synth every app
        run: |
          CDK_OUTDIR=cdk.out.rmng    python3 cdk/apps/rmng.py
          CDK_OUTDIR=cdk.out.espuser python3 cdk/apps/espuser.py
          CDK_OUTDIR=cdk.out.alexa   python3 cdk/apps/alexa.py
      - name: Upload cloud assemblies
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-assemblies
          path: cdk.out.*
          retention-days: 7

  # Nothing else builds or tests the frontend. `make admin-dashboard-build` is
  # reused for the npm ci + build so the build invocation stays in one place.
  dashboard:
    name: Admin dashboard
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build
        working-directory: .
        run: make admin-dashboard-build
      - run: npm run typecheck
      - run: npm test
      # eslint --max-warnings 0 plus the en/zh i18n key-parity check.
      - run: npm run lint

  # SPDX licence header gate on the files the change adds.
  #
  # fetch-depth: 0 so the merge-base with the base branch exists locally. On a push to
  # main there is no base branch, so the previous commit is the comparison point.
  license_headers:
    name: Licence headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check added files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # A branch's first push (or a force-push) reports an all-zero or unreachable
          # "before" SHA; fall back to the parent commit rather than failing the gate.
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            base="HEAD~1"
          fi
          echo "Comparing against $base"
          python3 scripts/check_license_headers.py --added-since "$base"

  # Schema validation for the published API definitions.
  api_docs:
    name: API definitions
    needs: changes
    if: needs.changes.outputs.api_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate OpenAPI
        run: |
          npx --yes @apidevtools/swagger-cli validate docs/api/Api_Swagger.yaml
          npx --yes @apidevtools/swagger-cli validate docs/api/User_Api_Swagger.yaml
      # A bare `npx --yes @asyncapi/cli` resolves @asyncapi/generator@3.4.0, which
      # pins @asyncapi/generator-hooks@0.1.1 — a version never published to npm —
      # so the install dies with ETARGET. Installing into a scratch package.json
      # lets an npm override pull the hooks package back to a version that exists.
      - name: Validate AsyncAPI
        if: needs.changes.outputs.mqtt == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          npm init --yes >/dev/null
          npm pkg set overrides.@asyncapi/generator-hooks=0.1.0
          npm install --no-save @asyncapi/cli@6.0.0
          for spec in MQTT_Node MQTT_User Push_User; do
            npx @asyncapi/cli validate "$GITHUB_WORKSPACE/docs/api/$spec.yaml"
          done

  # Working-tree secret scan, configured by .gitleaks.toml.
  #
  # `gitleaks dir`, not `gitleaks git`: this scans the checked-out files only. A
  # history scan would fail on any branch that still carries the pre-publish
  # commit record. History coverage is GitHub secret scanning + push protection.
  #
  # The binary is downloaded rather than using gitleaks/gitleaks-action, which
  # requires a GITLEAKS_LICENSE for organization-owned repos. The version is
  # pinned so the gate is deterministic; bump it deliberately.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks dir . --no-banner --redact

  # Dependency advisories for the two ecosystems govulncheck does not cover.
  deps_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Production dependencies only. The dev tree currently carries a critical
      # and a high advisory in the vite / vitest / vite-node / @vitest/mocker
      # chain, which ships to nobody — a full-tree audit would be red on every
      # run until vitest is bumped, so this is scoped rather than silenced.
      # Widen it to the full tree once that bump lands.
      - name: npm audit (dashboard, prod deps)
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
