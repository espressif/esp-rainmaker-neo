name: Other issue
description: Anything that isn't a bug report or feature request
labels: ["Type: Question"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Answers checklist
      options:
        - label: I have checked the documentation and existing issues first.
          required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe your question or issue. For usage questions, consider Discussions instead.
    validations:
      required: true
