openapi: 3.0.3
info:
  title: MCP + OAuth Proxy API
  description: |
    Streamable HTTP MCP server with an OAuth 2.0 proxy that bridges
    CIMD-based MCP clients to a Cognito user pool.

    **Authentication flow:**
    1. Client POSTs to `/v1/mcp` → receives `401` with `WWW-Authenticate: Bearer resource_metadata="<url>"`
    2. Client fetches `/.well-known/oauth-protected-resource` → discovers authorization server
    3. Client fetches `/.well-known/oauth-authorization-server` → discovers OAuth endpoints
    4. Client performs Authorization Code + PKCE flow via `/oauth2/*`
    5. Client retries MCP requests with the Bearer token
  version: "0.8.0"

servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    variables:
      apiId:
        default: example
      region:
        default: eu-west-1

paths:
  # ── Discovery ────────────────────────────────────────────────
  /.well-known/oauth-protected-resource:
    get:
      summary: Protected Resource Metadata (RFC 9728)
      description: Returns the MCP resource URL and its authorization server.
      tags: [Discovery]
      responses:
        "200":
          description: Protected resource metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                    example: https://api.example.com/v1/mcp
                  authorization_servers:
                    type: array
                    items: { type: string }
                  bearer_methods_supported:
                    type: array
                    items: { type: string }
                  scopes_supported:
                    type: array
                    items: { type: string }

  /.well-known/oauth-authorization-server:
    get:
      summary: Authorization Server Metadata (RFC 8414)
      description:
        Returns OAuth endpoints, supported grants, and CIMD support flag.
      tags: [Discovery]
      responses:
        "200":
          description: Authorization server metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
                  response_types_supported:
                    type: array
                    items: { type: string }
                  grant_types_supported:
                    type: array
                    items: { type: string }
                  code_challenge_methods_supported:
                    type: array
                    items: { type: string }
                  client_id_metadata_document_supported:
                    type: boolean
                  scopes_supported:
                    type: array
                    items: { type: string }

  /.well-known/test-cimd.json:
    get:
      summary: Test CIMD document
      description: |
        Returns a Client ID Metadata Document for integration testing.
        Only available when `ENABLE_TEST_CIMD=true`.
      tags: [Discovery]
      responses:
        "200":
          description: CIMD document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CIMDDocument"
        "404":
          description: Test CIMD not enabled

  # ── OAuth 2.0 Proxy ─────────────────────────────────────────
  /oauth2/authorize:
    get:
      summary: Authorization endpoint (CIMD + PKCE)
      description: |
        Validates the client via its CIMD document, then redirects to
        the upstream Cognito authorization endpoint.
        Localhost redirect URIs match port-agnostically per RFC 8252 §7.3.
      tags: [OAuth]
      parameters:
        - name: client_id
          in: query
          required: true
          description: HTTPS URL of the client's CIMD document
          schema: { type: string, format: uri }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [S256] }
        - name: state
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to Cognito login
        "400":
          description:
            Invalid request (missing PKCE, CIMD validation failure, etc.)

  /oauth2/callback:
    get:
      summary: OAuth callback
      description: |
        Receives the authorization code from Cognito and redirects back
        to the client's `redirect_uri` with the code and original state.
      tags: [OAuth]
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
        - name: error_description
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to client with code or error
        "400":
          description: Invalid or expired state

  /oauth2/token:
    post:
      summary: Token endpoint
      description: |
        Proxies `authorization_code` and `refresh_token` grants to Cognito,
        injecting the server's client credentials.
      tags: [OAuth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                code:
                  type: string
                redirect_uri:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
                client_id:
                  type: string
      responses:
        "200":
          description: Token response (proxied from Cognito)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  id_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string }
                  expires_in: { type: integer }
        "400":
          description: Invalid grant or Cognito error

  # ── MCP (Streamable HTTP) ───────────────────────────────────
  /v1/mcp:
    get:
      summary: MCP SSE stream (auth check)
      description: |
        Returns `401` with `WWW-Authenticate` header to trigger OAuth
        discovery. Used by Streamable HTTP clients to open an SSE connection.
      tags: [MCP]
      security:
        - bearer: []
      responses:
        "401":
          description: Authentication required
          headers:
            WWW-Authenticate:
              schema: { type: string }
              example:
                'Bearer
                resource_metadata="https://api.example.com/.well-known/oauth-protected-resource"'

    post:
      summary: MCP JSON-RPC endpoint
      description: |
        Accepts JSON-RPC 2.0 requests. All requests require a Bearer token;
        unauthenticated requests receive `401` with OAuth discovery headers.

        **Supported methods:**
        - `initialize` — returns server info and capabilities
        - `notifications/initialized` — client acknowledgement (no-op)
        - `tools/list` — lists available tools (requires valid token)
        - `tools/call` — invokes a tool (requires valid token)
      tags: [MCP]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JSONRPCRequest"
            examples:
              initialize:
                summary: Initialize
                value: { "jsonrpc": "2.0", "id": 1, "method": "initialize" }
              tools_list:
                summary: List tools
                value: { "jsonrpc": "2.0", "id": 2, "method": "tools/list" }
              tools_call:
                summary: Call a tool
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: tools/call
                  params:
                    name: get_groups
                    arguments: {}
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCResponse"
        "401":
          description: Missing or invalid Bearer token
          headers:
            WWW-Authenticate:
              schema: { type: string }
        "405":
          description: Method not allowed

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Cognito access or ID token obtained via the OAuth proxy

  schemas:
    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: integer
            - type: string
        method:
          type: string
          enum: [initialize, notifications/initialized, tools/list, tools/call]
        params:
          type: object

    JSONRPCResponse:
      type: object
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: integer
            - type: string
            - type: "null"
        result:
          type: object
        error:
          $ref: "#/components/schemas/JSONRPCError"

    JSONRPCError:
      type: object
      properties:
        code:
          type: integer
          description: |
            `-32700` Parse error, `-32600` Invalid request,
            `-32601` Method not found, `-32602` Invalid params,
            `-32603` Internal error, `-32001` Unauthorized
        message:
          type: string

    CIMDDocument:
      type: object
      properties:
        client_id:
          type: string
          format: uri
        client_name:
          type: string
        redirect_uris:
          type: array
          items: { type: string, format: uri }
